[app]
entry = "main.lmn"
id    = "com.lumen.examples.music"

[script]
engine = "candela"

# Audio is a runtime module: declaring it is what makes the audio_* script
# functions exist at all. A statically built runtime compiles the module's
# plugin in instead and banners that this entry cannot load there.
[dependencies]
lumen-audio = { bundled = true }

[window]
title = "Waveform - Player"
size  = [1080, 760]

# Devtools: the running app serves the Lumen inspector (element tree, signals,
# events, screenshot) over HTTP on this port; open http://127.0.0.1:7878/.
# `simulate = true` lets the inspector inject input (click/key/set-signal).
[mcp]
port     = 7878
simulate = true

# Bundled soundtracks. The default "Featured" playlist ships three real
# CC-BY 4.0 OGG tracks by Kevin MacLeod (incompetech.com), delivered via
# Git LFS (see .gitattributes / CREDITS.md); the synthetic test tones
# (generated by `lumen-gen-test-tracks`) still back the pure/moving
# playlists. Declaring the assets dir keeps every static file the app ships
# under lumen.toml, and the AOT/bundle packer embeds these files so playback
# works from a packed app.
[asset_roots]
paths = ["assets"]
