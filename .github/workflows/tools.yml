name: tools

# Builds what ci.yml does not: the editor integrations under tools/, the
# release shell scripts, and the Python and C++ SDKs. Nothing here publishes,
# and nothing here needs liblumen.

on:
  push:
    branches: [main]
  pull_request:
  # These jobs are required checks, so the merge queue needs them to report;
  # a queued merge runs every area rather than diffing.
  merge_group:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      vscode: ${{ steps.areas.outputs.vscode }}
      jetbrains: ${{ steps.areas.outputs.jetbrains }}
      treesitter: ${{ steps.areas.outputs.treesitter }}
      zed: ${{ steps.areas.outputs.zed }}
      release: ${{ steps.areas.outputs.release }}
      python: ${{ steps.areas.outputs.python }}
      cpp: ${{ steps.areas.outputs.cpp }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      - id: areas
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail

          case "$EVENT" in
            schedule)
              changed=""
              ;;
            workflow_dispatch | merge_group)
              changed="$(git ls-files)"
              ;;
            *)
              # shallow checkout: the base must be fetched before diffing
              if [ -n "$BASE" ] &&
                 [ "$BASE" != "0000000000000000000000000000000000000000" ] &&
                 git fetch --no-tags --depth=1 origin "$BASE"; then
                changed="$(git diff --name-only "$BASE" "$HEAD")"
              else
                changed="$(git ls-files)"
              fi
              ;;
          esac

          # editing this workflow re-runs every area
          self='^\.github/workflows/tools\.yml$'

          area() {
            name="$1"
            dir="$2"
            pattern="$3"
            answer=false
            # missing directory = skipped job, not a red one
            if [ -d "$dir" ] && printf '%s\n' "$changed" | grep -Eq "$pattern"; then
              answer=true
            fi
            echo "$name=$answer" >> "$GITHUB_OUTPUT"
            echo "$name: $answer"
          }

          area vscode tools/vscode-lumen \
            "^tools/vscode-lumen/|$self"
          # the gradle build copies grammars out of the vscode extension
          area jetbrains tools/jetbrains-lumen \
            "^tools/jetbrains-lumen/|^tools/vscode-lumen/(syntaxes|language-configuration)/|$self"
          area treesitter tools/tree-sitter-lumen \
            "^tools/tree-sitter-lumen/|$self"
          area zed tools/zed-lumen \
            "^tools/zed-lumen/|$self"
          area release tools/release \
            "^tools/release/|^tools/setup-lumen/|^\.github/scripts/|$self"
          area python sdk/python \
            "^sdk/python/|$self"
          # include/ is the C ABI header the C++ SDK wraps
          area cpp sdk/cpp \
            "^sdk/cpp/|^include/|$self"

  vscode:
    name: vscode extension
    needs: changes
    if: needs.changes.outputs.vscode == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: tools/vscode-lumen
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # no lockfile, so npm ci and the npm cache are out
      - run: npm install --no-audit --no-fund

      - run: npm run compile

      # vsce validates the manifest the way the marketplace does
      - run: npm run package

  jetbrains:
    name: jetbrains plugin
    needs: changes
    if: needs.changes.outputs.jetbrains == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: tools/jetbrains-lumen
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - run: ./gradlew --no-daemon buildPlugin verifyPluginProjectConfiguration verifyPluginStructure

  # downloads a full IDE distribution per IDE checked; too slow for PRs
  jetbrains-verifier:
    name: jetbrains plugin verifier
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: tools/jetbrains-lumen
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - run: ./gradlew --no-daemon verifyPlugin

  tree-sitter:
    name: tree-sitter grammar
    needs: changes
    if: needs.changes.outputs.treesitter == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: tools/tree-sitter-lumen
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install --no-audit --no-fund

      # editors compile the committed src/, so it must match grammar.js
      - name: check committed parser
        run: |
          npx tree-sitter generate
          git diff --exit-code -- src

      - run: npx tree-sitter test

  zed:
    name: zed extension
    needs: changes
    if: needs.changes.outputs.zed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      # own [workspace], so ci.yml never builds it; wasm32-wasip1 is what
      # Zed compiles extensions for
      - name: install toolchain
        run: |
          rustup show active-toolchain
          rustup target add wasm32-wasip1

      - uses: Swatinem/rust-cache@v2
        with:
          key: zed
          workspaces: tools/zed-lumen

      - run: cargo check --manifest-path tools/zed-lumen/Cargo.toml --target wasm32-wasip1

  release-scripts:
    name: release scripts
    needs: changes
    if: needs.changes.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      - run: shellcheck tools/release/*.sh tools/setup-lumen/*.sh .github/scripts/*.sh

      # a local sums file keeps the rewrite offline; the checksums are
      # placeholders, the version rewrite is what is under test
      - name: manifest rewrite round-trip
        if: hashFiles('tools/release/update-package-manifests.sh') != ''
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/release"
          cp -r tools/release "$work"
          sums="$RUNNER_TEMP/sha256sums.txt"
          : > "$sums"
          n=0
          for asset in lumen-linux-x86_64.tar.gz lumen-linux-aarch64.tar.gz \
                       lumen-macos-x86_64.tar.gz lumen-macos-aarch64.tar.gz \
                       lumen-windows-x86_64.zip lumen-windows-x86_64.msi; do
            n=$((n + 1))
            printf '%064d  %s\n' "$n" "$asset" >> "$sums"
          done

          "$work/update-package-manifests.sh" 9.9.9 "$sums"

          cd "$work"
          for manifest in aur/PKGBUILD homebrew/lumen.rb scoop/lumen.json \
                          winget/LumenFX.Lumen.installer.yaml; do
            if ! grep -q '9\.9\.9' "$manifest"; then
              echo "$manifest did not pick up the version" >&2
              exit 1
            fi
          done

  # Two literal jobs, not a matrix: a skipped matrix job never expands, so
  # its per-version required contexts would wait forever on unrelated PRs.
  python-sdk-39:
    name: python sdk (3.9)
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: sdk/python
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      # 3.9 is the floor pyproject.toml claims.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - run: python -m compileall -q lumen examples tests

      - run: python -m unittest discover -s tests -v

  python-sdk-313:
    name: python sdk (3.13)
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: sdk/python
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - run: python -m compileall -q lumen examples tests

      - run: python -m unittest discover -s tests -v

  cpp-sdk:
    name: cpp sdk
    needs: changes
    if: needs.changes.outputs.cpp == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      # syntax-only: linking would need liblumen. Include order matches the
      # CMake interface target, SDK header first.
      - name: compile examples
        run: |
          set -euo pipefail
          for example in sdk/cpp/examples/*.cpp; do
            echo "$example"
            g++ -std=c++17 -fsyntax-only -Isdk/cpp/include -Iinclude \
                -DLUMEN_APP_DIR='"."' "$example"
          done

      - run: cmake -S sdk/cpp -B "$RUNNER_TEMP/cpp-build"
