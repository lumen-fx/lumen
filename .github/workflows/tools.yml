name: tools and SDKs

# Builds what ci.yml does not: the editor integrations under tools/, the
# release shell scripts, and the Python and C++ SDKs. Nothing here publishes,
# and nothing here needs liblumen.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: what changed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      vscode: ${{ steps.areas.outputs.vscode }}
      jetbrains: ${{ steps.areas.outputs.jetbrains }}
      treesitter: ${{ steps.areas.outputs.treesitter }}
      zed: ${{ steps.areas.outputs.zed }}
      release: ${{ steps.areas.outputs.release }}
      python: ${{ steps.areas.outputs.python }}
      cpp: ${{ steps.areas.outputs.cpp }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      - id: areas
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail

          case "$EVENT" in
            schedule)
              changed=""
              ;;
            workflow_dispatch)
              changed="$(git ls-files)"
              ;;
            *)
              # The checkout is shallow, so the commit being compared against
              # has to be fetched before git can diff the two trees.
              if [ -n "$BASE" ] &&
                 [ "$BASE" != "0000000000000000000000000000000000000000" ] &&
                 git fetch --no-tags --depth=1 origin "$BASE"; then
                changed="$(git diff --name-only "$BASE" "$HEAD")"
              else
                changed="$(git ls-files)"
              fi
              ;;
          esac

          self='^\.github/workflows/tools\.yml$'

          area() {
            name="$1"
            dir="$2"
            pattern="$3"
            answer=false
            # A directory the branch does not have leaves its job skipped
            # rather than red, so a job can be written before it lands.
            if [ -d "$dir" ] && printf '%s\n' "$changed" | grep -Eq "$pattern"; then
              answer=true
            fi
            echo "$name=$answer" >> "$GITHUB_OUTPUT"
            echo "$name: $answer"
          }

          area vscode tools/vscode-lumen \
            "^tools/vscode-lumen/|$self"
          # The Gradle build copies its TextMate grammars out of the VS Code
          # extension.
          area jetbrains tools/jetbrains-lumen \
            "^tools/jetbrains-lumen/|^tools/vscode-lumen/(syntaxes|language-configuration)/|$self"
          area treesitter tools/tree-sitter-lumen \
            "^tools/tree-sitter-lumen/|$self"
          area zed tools/zed-lumen \
            "^tools/zed-lumen/|$self"
          area release tools/release \
            "^tools/release/|^tools/setup-lumen/|^\.github/scripts/|$self"
          area python sdk/python \
            "^sdk/python/|$self"
          # include/ holds the C ABI header the C++ SDK wraps.
          area cpp sdk/cpp \
            "^sdk/cpp/|^include/|$self"

  vscode:
    name: vscode extension
    needs: changes
    if: needs.changes.outputs.vscode == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: tools/vscode-lumen
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # No lockfile is committed, which rules out `npm ci` and setup-node's
      # npm cache alike.
      - run: npm install --no-audit --no-fund

      - name: The extension compiles
        run: npm run compile

      # vsce reads package.json the way the marketplace does, so a broken
      # contribution point fails here rather than on someone's install.
      - name: The extension packages
        run: npm run package

  jetbrains:
    name: jetbrains plugin
    needs: changes
    if: needs.changes.outputs.jetbrains == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: tools/jetbrains-lumen
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: The plugin builds and its descriptor is well formed
        run: ./gradlew --no-daemon buildPlugin verifyPluginProjectConfiguration verifyPluginStructure

  # The Plugin Verifier downloads one full IDE distribution per IDE it checks,
  # which is tens of minutes. Weekly and on demand instead of per pull request.
  jetbrains-verifier:
    name: jetbrains plugin verifier
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: tools/jetbrains-lumen
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: The plugin is binary compatible with the recommended IDEs
        run: ./gradlew --no-daemon verifyPlugin

  tree-sitter:
    name: tree-sitter grammar
    needs: changes
    if: needs.changes.outputs.treesitter == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: tools/tree-sitter-lumen
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install --no-audit --no-fund

      # Editors compile the committed parser rather than generating their own,
      # so a grammar edit that ships without a regenerated src/ fails here.
      - name: The committed parser is the one the grammar generates
        run: |
          npx tree-sitter generate
          git diff --exit-code -- src

      - name: The corpus parses
        run: npx tree-sitter test

  zed:
    name: zed extension
    needs: changes
    if: needs.changes.outputs.zed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      # The crate carries its own [workspace], so ci.yml never builds it, and
      # wasm32-wasip1 is the target Zed compiles it for on install.
      - name: Install pinned toolchain
        run: |
          rustup show active-toolchain
          rustup target add wasm32-wasip1

      - uses: Swatinem/rust-cache@v2
        with:
          key: zed
          workspaces: tools/zed-lumen

      - run: cargo check --manifest-path tools/zed-lumen/Cargo.toml --target wasm32-wasip1

  release-scripts:
    name: release scripts
    needs: changes
    if: needs.changes.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      - name: The shell scripts lint clean
        run: shellcheck tools/release/*.sh tools/setup-lumen/*.sh .github/scripts/*.sh

      # update-package-manifests.sh normally downloads the checksum file a
      # release publishes. Handing it one written here keeps the rewrite
      # offline; the checksums are placeholders, the rewriting is the subject.
      - name: The package manifests survive a rewrite
        if: hashFiles('tools/release/update-package-manifests.sh') != ''
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/release"
          cp -r tools/release "$work"
          sums="$RUNNER_TEMP/sha256sums.txt"
          : > "$sums"
          n=0
          for asset in lumen-linux-x86_64.tar.gz lumen-linux-aarch64.tar.gz \
                       lumen-macos-x86_64.tar.gz lumen-macos-aarch64.tar.gz \
                       lumen-windows-x86_64.zip lumen-windows-x86_64.msi; do
            n=$((n + 1))
            printf '%064d  %s\n' "$n" "$asset" >> "$sums"
          done

          "$work/update-package-manifests.sh" 9.9.9 "$sums"

          cd "$work"
          for manifest in aur/PKGBUILD homebrew/lumen.rb scoop/lumen.json \
                          winget/LumenFX.Lumen.installer.yaml; do
            if ! grep -q '9\.9\.9' "$manifest"; then
              echo "$manifest did not pick up the version" >&2
              exit 1
            fi
          done

  python-sdk:
    name: python sdk (${{ matrix.python }})
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # 3.9 is the floor pyproject.toml claims.
        python: ["3.9", "3.13"]
    defaults:
      run:
        working-directory: sdk/python
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Every module parses on this interpreter
        run: python -m compileall -q lumen examples tests

      - name: The tests pass
        run: python -m unittest discover -s tests -v

  cpp-sdk:
    name: cpp sdk
    needs: changes
    if: needs.changes.outputs.cpp == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      # Compiled, not linked: linking would need liblumen. The include order
      # matches the CMake interface target, SDK header first, and LUMEN_APP_DIR
      # only ever becomes a string constant.
      - name: The examples compile against the committed headers
        run: |
          set -euo pipefail
          for example in sdk/cpp/examples/*.cpp; do
            echo "$example"
            g++ -std=c++17 -fsyntax-only -Isdk/cpp/include -Iinclude \
                -DLUMEN_APP_DIR='"."' "$example"
          done

      - name: The CMake package configures
        run: cmake -S sdk/cpp -B "$RUNNER_TEMP/cpp-build"
