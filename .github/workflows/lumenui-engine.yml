name: lumenui-engine

# The prebuilt engine the published `lumenui` crate links, and the proof that
# an app builds from it.
#
# `lumenui` (public/lumenui/rust) holds no engine code: its build script
# downloads, for its own version and the app's target, the compiled crates of
# `lumenui-engine` (public/lumenui/rust/engine) and points rustc at them. Each
# leg here makes that set for one target with tools/release/lumenui-engine.py
# (`build`, then `collect`), producing lumenui-engine-<target>.tar.zst and its
# manifest lumenui-engine-<target>.json, and then proves it the way a user
# would meet it: an app outside the checkout (public/lumenui/rust/smoke),
# depending on `lumenui` alone, is built against the set through
# LUMEN_ENGINE_ARTIFACTS, its `cargo build -v` log is checked for any engine
# crate compiling (lumenui-engine.py `check`), and it runs headless. The module
# wrapper crates (`lumenui-canvas` and the rest of MODULES in
# lumenui-engine.py) are not in the checkout: lumenui-engine.py `wrappers`
# generates them here, and each one's smoke app, on `lumenui` and that crate
# alone, gets the same proof. The Linux x86_64 leg also packages and verifies
# every crate publish.yml uploads, against its set, without uploading. Last,
# the `rust` template `lumenc new` scaffolds gets the proof too, plus its own
# `cargo test`: the template is a repository of its own, and its `lumenui`
# requirement names a version crates.io does not have until the release
# publishes it, so this is the one place it builds before a user meets it.
#
# Every leg builds natively for its own target. The set carries proc-macro
# libraries, which run inside the compiler, so a set is only usable on a
# machine of its own target; there is nothing to cross-compile.
#
# Two ways in:
#
#   - build-toolchain.yml calls it with `all_targets`, so a release and the
#     nightly build the set for every desktop target the toolchain archives
#     cover; the archive and the manifest land as run artifacts beside the
#     others, and the publishing job lists them in sha256sums.txt.
#   - A pull request that touches the SDK or this machinery runs it for the
#     three operating systems ci.yml tests, Linux x86_64, macOS on Apple
#     Silicon and Windows x86_64, which is what proves the shape on each.
#     workflow_dispatch runs the same three against any branch.

on:
  workflow_call:
    inputs:
      all_targets:
        description: Build every desktop target, not only one per operating system.
        type: boolean
        required: false
        default: false
  pull_request:
    paths:
      - public/lumenui/rust/**
      # What a Rust app's build script runs to compile its UI.
      - public/lumenc/src/cli/build.rs
      # The modules in lumenui-engine.py's MODULES, which the set compiles.
      - std/canvas/**
      - core/widget/macros/**
      # The crash helper the set carries and lumenui's build script places.
      - os/crash/helper/**
      - os/crash/report/**
      - tools/release/lumenui-engine.py
      - tools/release/publish-crates.py
      # What scaffolds the rust template: the gallery, the manifest and
      # toolchain pin it writes, and the download of the template's tree.
      - public/lumenc/src/cli/scaffold.rs
      - public/lumenc/build.rs
      - tools/fetch-templates.sh
      - rust-toolchain.toml
      - .github/workflows/lumenui-engine.yml
  workflow_dispatch:
    inputs:
      all_targets:
        description: Build every desktop target, not only one per operating system.
        type: boolean
        required: false
        default: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  engine:
    name: engine (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    # One release-profile build of the engine graph, then an app linked
    # against it twice over (the smoke build and its run).
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        # The six targets build-toolchain.yml ships, or the three a pull
        # request proves. The runner for each is the one build-toolchain.yml
        # uses, for the reasons it gives.
        include: >-
          ${{ fromJSON(inputs.all_targets && '[
            {"target": "linux-x86_64", "os": "ubuntu-24.04"},
            {"target": "linux-aarch64", "os": "ubuntu-24.04-arm"},
            {"target": "macos-aarch64", "os": "macos-latest"},
            {"target": "macos-x86_64", "os": "macos-26-intel"},
            {"target": "windows-x86_64", "os": "windows-latest"},
            {"target": "windows-aarch64", "os": "windows-11-arm"}
          ]' || '[
            {"target": "linux-x86_64", "os": "ubuntu-24.04"},
            {"target": "macos-aarch64", "os": "macos-latest"},
            {"target": "windows-x86_64", "os": "windows-latest"}
          ]') }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      # Same as build-toolchain.yml: the Arm64 Windows image has no rustup,
      # and rust-toolchain.toml still names the version.
      - name: Install rustup (Arm64 Windows)
        if: matrix.target == 'windows-aarch64'
        shell: pwsh
        run: |
          if (Get-Command rustup -ErrorAction SilentlyContinue) { exit 0 }
          $url = 'https://static.rust-lang.org/rustup/dist/aarch64-pc-windows-msvc/rustup-init.exe'
          Invoke-WebRequest -Uri $url -OutFile rustup-init.exe
          .\rustup-init.exe -y --default-toolchain none --no-modify-path
          "$env:USERPROFILE\.cargo\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install pinned toolchain
        run: |
          rustup show active-toolchain
          rustc -vV

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: .github/scripts/linux-deps.sh

      # The archive is compressed by the zstd command. The hosted images
      # carry it; the install covers one that does not.
      - name: Make sure zstd is there
        run: |
          if command -v zstd >/dev/null; then zstd --version; exit 0; fi
          case "$RUNNER_OS" in
            Linux)   sudo apt-get install -y --no-install-recommends zstd ;;
            macOS)   brew install zstd ;;
            Windows) choco install zstandard -y --no-progress ;;
          esac
          zstd --version

      - name: Build the engine
        run: >-
          python tools/release/lumenui-engine.py build
          --target-dir target/lumenui-engine
          --messages "$RUNNER_TEMP/lumenui-engine.jsonl"

      - name: Collect the engine set
        run: >-
          python tools/release/lumenui-engine.py collect
          --messages "$RUNNER_TEMP/lumenui-engine.jsonl"
          --out "$RUNNER_TEMP/lumenui-engine"

      # The compiler an app's build script compiles its UI with
      # (`lumenui_build::compile`), from this checkout: a release would hand
      # the app's build its own version's lumenc, which for an unreleased
      # version is this one. Named for every later step through LUMEN_LUMENC.
      - name: Build the lumenc the apps compile their UI with
        run: |
          set -euo pipefail
          cargo build -p lumenc --bin lumenc
          lumenc="$GITHUB_WORKSPACE/target/debug/lumenc"
          if [ "$RUNNER_OS" = Windows ]; then lumenc="$lumenc.exe"; fi
          "$lumenc" --version
          echo "LUMEN_LUMENC=$lumenc" >> "$GITHUB_ENV"

      # The module wrapper crates, outside the checkout, as a publish would
      # write them. Each `lumenui-<name>` directory is a crate, and its
      # `smoke` directory, where the module has one, an app on it.
      - name: Generate the module crates
        run: python tools/release/lumenui-engine.py wrappers --out "$RUNNER_TEMP/lumenui-sdk"

      # The published crates are workspaces of their own, so the workspace's
      # fmt and clippy gates never see them; this is where they run, on one
      # leg, since neither depends on the platform. A generated crate is
      # checked like a written one, which is what catches the generator
      # producing code rustfmt or clippy would not accept.
      - name: Lint the published crates
        if: matrix.target == 'linux-x86_64'
        env:
          LUMEN_ENGINE_ARTIFACTS: ${{ runner.temp }}/lumenui-engine/lumenui-engine-${{ matrix.target }}
        run: |
          set -euo pipefail
          cargo fmt --manifest-path public/lumenui/rust/Cargo.toml -- --check
          cargo fmt --manifest-path public/lumenui/rust/build/Cargo.toml -- --check
          cargo fmt --manifest-path public/lumenui/rust/smoke/Cargo.toml -- --check
          cargo clippy --manifest-path public/lumenui/rust/Cargo.toml --all-targets -- -D warnings
          cargo clippy --manifest-path public/lumenui/rust/build/Cargo.toml --all-targets -- -D warnings
          cargo test --manifest-path public/lumenui/rust/build/Cargo.toml
          # Globbed relative to the directory: a Windows runner's temp path has
          # backslashes, which a glob reads as escapes.
          cd "$RUNNER_TEMP/lumenui-sdk"
          for crate in lumenui-*/; do
            cargo fmt --manifest-path "${crate}Cargo.toml" -- --check
            if [ -d "${crate}smoke" ]; then
              cargo fmt --manifest-path "${crate}smoke/Cargo.toml" -- --check
            fi
            cargo clippy --manifest-path "${crate}Cargo.toml" --all-targets -- -D warnings
          done

      # The app a user writes, outside the checkout so nothing of the workspace
      # (its config, its lockfile, its target directory) reaches it. It names
      # the release's compiler the way `lumenc new` makes an app do, and finds
      # `lumenui` and `lumenui-build` at this checkout's public/lumenui/rust.
      - name: Build an app against the set
        env:
          LUMEN_ENGINE_ARTIFACTS: ${{ runner.temp }}/lumenui-engine/lumenui-engine-${{ matrix.target }}
        run: |
          set -euo pipefail
          app="$RUNNER_TEMP/smoke"
          rm -rf "$app"
          cp -R public/lumenui/rust/smoke "$app"
          python - "$app" "$GITHUB_WORKSPACE" <<'PY'
          import pathlib, re, sys
          app, repo = pathlib.Path(sys.argv[1]), pathlib.Path(sys.argv[2])
          manifest = app / "Cargo.toml"
          lumenui = (repo / "public" / "lumenui" / "rust").as_posix()
          build = (repo / "public" / "lumenui" / "rust" / "build").as_posix()
          manifest.write_text(
              manifest.read_text()
              .replace('path = "../build"', f'path = "{build}"')
              .replace('path = ".."', f'path = "{lumenui}"')
          )
          channel = re.search(
              r'^channel\s*=\s*"([^"]+)"', (repo / "rust-toolchain.toml").read_text(), re.M
          ).group(1)
          (app / "rust-toolchain.toml").write_text(f'[toolchain]\nchannel = "{channel}"\n')
          PY
          cat "$app/Cargo.toml" "$app/rust-toolchain.toml"
          cd "$app"
          cargo build -v 2>&1 | tee "$RUNNER_TEMP/smoke-build.log"

      - name: Check that no engine crate compiled
        run: >-
          python tools/release/lumenui-engine.py check
          --app "$RUNNER_TEMP/smoke"
          --log "$RUNNER_TEMP/smoke-build.log"

      - name: Run the app headless
        working-directory: ${{ runner.temp }}/smoke
        run: |
          set -euo pipefail
          exe=target/debug/lumenui-smoke
          helper=target/debug/lumen-crash
          if [ "$RUNNER_OS" = Windows ]; then exe="$exe.exe"; helper="$helper.exe"; fi
          "./$exe"
          # lumenui's build script puts the set's crash helper beside the
          # app, so a plain `cargo build` has it with no packaging step.
          test -x "$helper" || { echo "no $helper beside the app" >&2; exit 1; }

      # The same proof for each module wrapper: an app on `lumenui` and the
      # wrapper alone builds from the set and compiles no engine or module
      # crate, and its run checks what the module does (the canvas one renders
      # a pixel buffer headless on the CPU renderer and reads the frame back).
      # Each loop globs relative to the generated directory: a Windows
      # runner's temp path has backslashes, which a glob reads as escapes.
      - name: Build each module's app against the set
        working-directory: ${{ runner.temp }}/lumenui-sdk
        env:
          LUMEN_ENGINE_ARTIFACTS: ${{ runner.temp }}/lumenui-engine/lumenui-engine-${{ matrix.target }}
        run: |
          set -euo pipefail
          for crate in lumenui-*/; do
            [ -d "${crate}smoke" ] || continue
            (cd "${crate}smoke" && cargo build -v) 2>&1 \
              | tee "$RUNNER_TEMP/${crate%/}-smoke-build.log"
          done

      - name: Check that no engine crate compiled for a module's app
        working-directory: ${{ runner.temp }}/lumenui-sdk
        run: |
          set -euo pipefail
          for crate in lumenui-*/; do
            [ -d "${crate}smoke" ] || continue
            python "$GITHUB_WORKSPACE/tools/release/lumenui-engine.py" check \
              --app "${crate}smoke" --log "$RUNNER_TEMP/${crate%/}-smoke-build.log"
          done

      - name: Run each module's app headless
        working-directory: ${{ runner.temp }}/lumenui-sdk
        run: |
          set -euo pipefail
          for crate in lumenui-*/; do
            [ -d "${crate}smoke" ] || continue
            exe="target/debug/${crate%/}-smoke"
            if [ "$RUNNER_OS" = Windows ]; then exe="$exe.exe"; fi
            (cd "${crate}smoke" && "./$exe")
          done

      # The packages publish.yml uploads, verified the way it verifies them:
      # `lumenui` and every generated module crate packaged and built from the
      # packaged files, in publish order, against this leg's set. publish.yml
      # can only do that once the release carrying the set is up, so this is
      # where a version that is not released yet gets the check. Nothing is
      # uploaded. One leg, since the packages are the same for every target.
      - name: Package the published crates
        if: matrix.target == 'linux-x86_64'
        env:
          LUMEN_ENGINE_ARTIFACTS: ${{ runner.temp }}/lumenui-engine/lumenui-engine-${{ matrix.target }}
        run: python tools/release/publish-crates.py --sdk --dry-run

      # The `rust` template, the way a user starts a Rust app: downloaded as
      # a release would package it, scaffolded by this checkout's `lumenc
      # new` (which names the package, sets the `lumenui` version and writes
      # rust-toolchain.toml), outside the checkout. The scaffold asks for
      # `lumenui` at this checkout's version on crates.io, which has none of
      # it before the release, so `[patch.crates-io]` points that crate,
      # `lumenui-build`, and any `lumenui-<name>` wrapper the template adds,
      # at this checkout's copy.
      - name: Scaffold the rust template
        run: |
          set -euo pipefail
          tools/fetch-templates.sh "$RUNNER_TEMP/templates"
          rm -rf "$RUNNER_TEMP/rust-app"
          (cd "$RUNNER_TEMP" && LUMEN_TEMPLATES_DIR="$RUNNER_TEMP/templates" "$LUMEN_LUMENC" new rust-app rust)
          python - "$RUNNER_TEMP/rust-app" "$GITHUB_WORKSPACE" "$RUNNER_TEMP/lumenui-sdk" <<'PY'
          import pathlib, sys, tomllib
          app, repo, sdk = (pathlib.Path(a) for a in sys.argv[1:])
          manifest = app / "Cargo.toml"
          deps = tomllib.loads(manifest.read_text()).get("dependencies", {})
          if "lumenui" not in deps:
              sys.exit(f"{manifest} does not depend on lumenui")
          patch = {
              "lumenui": repo / "public" / "lumenui" / "rust",
              "lumenui-build": repo / "public" / "lumenui" / "rust" / "build",
          }
          for name in deps:
              if name.startswith("lumenui-"):
                  if not (sdk / name).is_dir():
                      sys.exit(f"{manifest} depends on {name}, which `wrappers` did not generate")
                  patch[name] = sdk / name
          lines = "".join(f'{n} = {{ path = "{p.as_posix()}" }}\n' for n, p in patch.items())
          manifest.write_text(manifest.read_text() + f"\n[patch.crates-io]\n{lines}")
          PY
          cat "$RUNNER_TEMP/rust-app/Cargo.toml" "$RUNNER_TEMP/rust-app/rust-toolchain.toml"

      - name: Build the rust template against the set
        working-directory: ${{ runner.temp }}/rust-app
        env:
          LUMEN_ENGINE_ARTIFACTS: ${{ runner.temp }}/lumenui-engine/lumenui-engine-${{ matrix.target }}
        run: |
          set -euo pipefail
          cargo build -v 2>&1 | tee "$RUNNER_TEMP/rust-app-build.log"

      - name: Check that no engine crate compiled for the rust template
        run: >-
          python tools/release/lumenui-engine.py check
          --app "$RUNNER_TEMP/rust-app"
          --log "$RUNNER_TEMP/rust-app-build.log"

      # The template's own test renders the app with no window and checks the
      # frame. The run after it is what `lumenc run . --headless` hands a Rust
      # app: the same executable, told through the environment to run a fixed
      # number of ticks with no window.
      - name: Test and run the rust template headless
        working-directory: ${{ runner.temp }}/rust-app
        env:
          LUMEN_ENGINE_ARTIFACTS: ${{ runner.temp }}/lumenui-engine/lumenui-engine-${{ matrix.target }}
        run: |
          set -euo pipefail
          cargo test
          exe=target/debug/rust-app
          if [ "$RUNNER_OS" = Windows ]; then exe="$exe.exe"; fi
          LUMEN_HEADLESS=1 LUMEN_HEADLESS_TICKS=60 "./$exe"

      - uses: actions/upload-artifact@v4
        with:
          name: lumenui-engine-${{ matrix.target }}
          path: |
            ${{ runner.temp }}/lumenui-engine/lumenui-engine-${{ matrix.target }}.tar.zst
            ${{ runner.temp }}/lumenui-engine/lumenui-engine-${{ matrix.target }}.json
          if-no-files-found: error
          retention-days: 7
