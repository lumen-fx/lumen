name: publish

# Publishes the Lumen packages to the language registries: `lumenui` on PyPI
# (the Python SDK), and on crates.io the Rust SDK (`lumenui` and its
# `lumenui-<name>` module crates) and `lumenc`. This is a different channel
# from the toolchain archives people install with install.sh; both go out for
# the same release, and release.yml starts both.
#
# release.yml calls this once the release is published, off the tag it was cut
# from. Waiting on `release: published` instead would never fire: release.yml
# creates the release with the built-in token, and GitHub raises no workflow
# events for anything that token writes. `workflow_dispatch` re-runs a leg that
# failed, or verifies the whole path without uploading.
#
# The registries take released versions only, and a nightly is not one. Nothing
# carries one here: nightly.yml calls no workflow, and the only automatic
# caller is release.yml, which fires on `v*` tags while the nightly publishes
# onto a tag named `nightly`.
#
# Owner setup. The two registry credentials are checked separately, and a leg
# without its credential verifies instead of uploading.
#
#   CRATES_IO_TOKEN         repository secret. A crates.io API token with
#                           publish-new and publish-update scope. With it the
#                           crates.io jobs publish; without it, they verify.
#   PYPI_PUBLISH_ENABLED    repository variable, set to "true" once the PyPI
#                           trusted publisher below is registered. Without it
#                           the PyPI job builds and checks the artifacts and
#                           uploads nothing.
#   PyPI trusted publisher  on pypi.org, for project `lumenui`, owner
#                           `lumen-fx`, repository `lumen`, environment `pypi`.
#                           This replaces a long-lived API token: the job mints
#                           a short-lived one from its OIDC identity. PyPI
#                           matches the registered workflow filename against
#                           the file that defines the publishing job, which is
#                           this one, and its documentation lists a workflow
#                           started by another workflow as unsupported. So
#                           confirm an upload is accepted before leaving
#                           PYPI_PUBLISH_ENABLED on; if PyPI rejects the
#                           identity, the upload step moves into release.yml
#                           and the registration names release.yml instead.
#
# Every registry job is an ordinary re-runnable step: it skips a version that
# is already published, so a leg that failed halfway is fixed by running the
# workflow again.
#
# crates.io gets two jobs, because the two sets have nothing in common and one
# of them cannot publish yet:
#
#   - The Rust SDK. `lumenui` (sdk/lumenui) names no engine crate: its build
#     script downloads, by its own version, the prebuilt engine set the
#     release carries for each target. The module crates are generated from
#     the module list in tools/release/lumenui-engine.py and depend on
#     `lumenui` alone. So the set publishes once the release with those sets
#     is up, which is why release.yml calls this after its upload, and
#     tools/release/publish-crates.py refuses to start when the release is
#     not there.
#   - `lumenc`, for `cargo install lumenc`. It depends on many workspace
#     crates that are `publish = false`, so the script refuses to start and
#     this job fails, with the list on the run summary, until that is unwound.
#     It runs after the SDK job, whatever that job's result, so it never holds
#     the SDK back, and the two never share the crates.io rate limit at once.
#     A release whose `lumenc` job is red still published the SDK; see the
#     registries section of tools/release/release-checklist.md.

on:
  # A release publishes, so the call defaults to uploading. A person reaching
  # for the Actions tab is usually checking rather than shipping, so the manual
  # form defaults the other way and has to be switched off to publish.
  workflow_call:
    inputs:
      dry_run:
        description: "Build and verify everything, upload nothing"
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and verify everything, upload nothing"
        type: boolean
        default: true

permissions:
  contents: read

# Governs a run started from the Actions tab. A call from release.yml is part
# of that workflow's run and is covered by its group instead, so the two jobs
# that reach a registry carry a lock of their own below.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  # What is being published, and whether each leg has what it needs. Secrets
  # cannot be read in a job-level `if`, so the answers become outputs here and
  # the jobs below gate on them.
  preflight:
    name: preconditions
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      dry_run: ${{ steps.mode.outputs.dry_run }}
      crates_io: ${{ steps.mode.outputs.crates_io }}
      pypi: ${{ steps.mode.outputs.pypi }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      - name: Read the workspace version
        id: version
        run: |
          version="$(awk -F'"' '
            /^\[workspace\.package\]/ { in_section = 1; next }
            /^\[/                     { in_section = 0 }
            in_section && /^version[[:space:]]*=/ { print $2; exit }
          ' Cargo.toml)"
          if [ -z "$version" ]; then
            echo "publish.yml: no [workspace.package] version in Cargo.toml" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "publishing version $version"

      # A release publishes the tag it was cut from, so the tag and the
      # workspace version have to agree, the same check release.yml makes
      # before it builds anything. A call from release.yml runs on the tag, so
      # the ref is where the tag comes from; a run started from the Actions tab
      # is usually on a branch, and there is no tag to compare against.
      - name: Compare the tag with the workspace version
        if: startsWith(github.ref, 'refs/tags/')
        env:
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          tag="${TAG#v}"
          if [ "$tag" != "$VERSION" ]; then
            echo "publish.yml: release $TAG says $tag, Cargo.toml says $VERSION." >&2
            exit 1
          fi
          echo "release $TAG matches the workspace version"

      - name: Decide what each leg may do
        id: mode
        env:
          CRATES_IO_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
          PYPI_PUBLISH_ENABLED: ${{ vars.PYPI_PUBLISH_ENABLED }}
          DRY_RUN_INPUT: ${{ inputs.dry_run }}
        run: |
          dry_run=false
          if [ "$DRY_RUN_INPUT" = "true" ]; then
            dry_run=true
          fi
          echo "dry_run=$dry_run" >> "$GITHUB_OUTPUT"

          if [ -n "$CRATES_IO_TOKEN" ]; then
            echo "crates_io=true" >> "$GITHUB_OUTPUT"
          else
            echo "crates_io=false" >> "$GITHUB_OUTPUT"
            echo "::notice::CRATES_IO_TOKEN is not set, so the crates.io job runs as a dry run"
          fi

          if [ "$PYPI_PUBLISH_ENABLED" = "true" ]; then
            echo "pypi=true" >> "$GITHUB_OUTPUT"
          else
            echo "pypi=false" >> "$GITHUB_OUTPUT"
            echo "::notice::PYPI_PUBLISH_ENABLED is not true, so the PyPI job uploads nothing"
          fi

  # The Python SDK. The distribution is pure Python: it wraps the C ABI with
  # ctypes and loads liblumen from wherever the machine has it, so one
  # py3-none-any wheel serves every platform and there is no build matrix.
  pypi:
    name: lumenui on PyPI
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: pypi
    concurrency:
      group: publish-pypi
      cancel-in-progress: false
    permissions:
      contents: read
      # Trusted publishing: the job proves its identity to PyPI with a
      # short-lived OIDC token instead of carrying an API token. A called
      # workflow can only narrow what its caller granted, so release.yml grants
      # this on the job that calls here.
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build the sdist and the wheel
        working-directory: sdk/python
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check dist/*

      # A version already on PyPI cannot be replaced, and re-running the
      # workflow after a partial release is normal, so a version that is
      # already there ends this job rather than failing it.
      - name: Check the version is not on PyPI yet
        id: pypi_state
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          code="$(curl -fsS -o /dev/null -w '%{http_code}' \
            "https://pypi.org/pypi/lumenui/$VERSION/json" || true)"
          if [ "$code" = "200" ]; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "::notice::lumenui $VERSION is already on PyPI"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload to PyPI
        if: >-
          needs.preflight.outputs.pypi == 'true' &&
          needs.preflight.outputs.dry_run == 'false' &&
          steps.pypi_state.outputs.published == 'false'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: sdk/python/dist

  # The Rust SDK: `lumenui` and the `lumenui-<name>` module crates, in
  # dependency order. tools/release/publish-crates.py `--sdk` generates the
  # module crates outside the checkout, checks the release carries the engine
  # sets, and holds the ordering, the already-published check, and the waits
  # the crates.io rate limit requires; the steps below only choose its mode.
  #
  # Verifying a crate builds it, and building `lumenui` downloads the release's
  # engine set for this runner's target, so the job only verifies a version
  # whose release is published. A run from the Actions tab on a branch whose
  # version is not released yet refuses at the plan step; verify such a
  # version where an engine set is built (lumenui-engine.yml) instead.
  crates-io-sdk:
    name: lumenui on crates.io
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 120
    concurrency:
      group: publish-crates-io
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      # The prebuilt engine is readable only by the compiler that built it,
      # which is the one rust-toolchain.toml pins, so verifying needs it too.
      - name: Install pinned toolchain
        run: |
          rustup show active-toolchain
          rustc --version

      - name: Plan the publish order
        run: |
          set -uo pipefail
          log="${RUNNER_TEMP:-/tmp}/sdk-plan.log"
          status=0
          python3 -u tools/release/publish-crates.py --sdk --plan 2>&1 | tee "$log" || status=$?
          if [ "$status" != "0" ]; then
            {
              echo "## crates.io: the Rust SDK was not published"
              echo
              echo "\`publish-crates.py --sdk --plan\` exited $status, so this run"
              echo "uploaded none of the SDK crates. The end of its output:"
              echo
              echo '```'
              tail -n 40 "$log"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$status"

      - name: Verify every crate packages
        if: >-
          needs.preflight.outputs.dry_run == 'true' ||
          needs.preflight.outputs.crates_io == 'false'
        run: python3 -u tools/release/publish-crates.py --sdk --dry-run

      - name: Publish
        if: >-
          needs.preflight.outputs.dry_run == 'false' &&
          needs.preflight.outputs.crates_io == 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
        run: python3 -u tools/release/publish-crates.py --sdk --execute

  # `lumenc` and the workspace crates it needs, in dependency order, for
  # `cargo install lumenc`. Same script, workspace set.
  #
  # It runs after the SDK job whatever that job's result: the SDK does not
  # depend on it, and running them one after the other keeps both inside one
  # account's rate limit.
  #
  # The timeout is generous because the first publish is: crates.io lets an
  # account create a few new crates and then meters the rest. Later releases
  # publish new versions of crates that exist, which is metered far more
  # loosely.
  crates-io-lumenc:
    name: lumenc on crates.io
    needs: [preflight, crates-io-sdk]
    if: always() && needs.preflight.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    concurrency:
      group: publish-crates-io
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      - name: Install pinned toolchain
        run: |
          rustup show active-toolchain
          rustc --version

      - name: Install Linux system dependencies
        run: .github/scripts/linux-deps.sh

      - uses: Swatinem/rust-cache@v2
        with:
          key: publish

      # The script exits 2 when something makes the run pointless to start: a
      # crate the published set depends on that is `publish = false`, a crate
      # name that belongs to another project, a git dependency with no
      # published release. A green job that uploaded nothing reads as a
      # successful publish, so the leg fails here instead, with the reason on
      # the run summary where a release is watched. Today it fails here on the
      # first reason.
      - name: Plan the publish order
        id: plan
        run: |
          set -uo pipefail
          # Outside the checkout: an untracked file in a package directory is a
          # dirty working tree to `cargo publish`.
          log="${RUNNER_TEMP:-/tmp}/crates-plan.log"
          status=0
          python3 -u tools/release/publish-crates.py --plan 2>&1 | tee "$log" || status=$?
          if [ "$status" != "0" ]; then
            {
              echo "## crates.io: lumenc was not published"
              echo
              echo "\`publish-crates.py --plan\` exited $status, so this run"
              echo "uploaded no workspace crates. The end of its output:"
              echo
              echo '```'
              tail -n 40 "$log"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$status"

      - name: Verify every crate packages
        if: >-
          needs.preflight.outputs.dry_run == 'true' ||
          needs.preflight.outputs.crates_io == 'false'
        run: python3 -u tools/release/publish-crates.py --dry-run

      - name: Publish
        if: >-
          needs.preflight.outputs.dry_run == 'false' &&
          needs.preflight.outputs.crates_io == 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
        run: python3 -u tools/release/publish-crates.py --execute
