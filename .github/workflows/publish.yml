name: publish

# Publishes the Lumen packages to the language registries: `lumenui` on PyPI
# (the Python SDK) and the Rust crates on crates.io (`lumenui`, `lumenc`, and
# everything they are built from). This is a different channel from
# release.yml, which builds the toolchain archives people install with
# install.sh; both run off the same release.
#
# Owner setup, all of it optional and each leg checked separately, so this
# workflow is safe to run before any of it exists:
#
#   CRATES_IO_TOKEN         repository secret. A crates.io API token with
#                           publish-new and publish-update scope. Without it
#                           the crates.io job skips.
#   PYPI_PUBLISH_ENABLED    repository variable, set to "true" once the PyPI
#                           trusted publisher below is registered. Without it
#                           the PyPI job builds and checks the artifacts and
#                           uploads nothing.
#   PyPI trusted publisher  on pypi.org, for project `lumenui`, owner
#                           `lumen-fx`, repository `lumen`, workflow
#                           `publish.yml`, environment `pypi`. This replaces a
#                           long-lived API token: the job mints a short-lived
#                           one from its OIDC identity.
#   candela-lang            published to crates.io from lumen-fx/candela, and
#                           `crates/script/candela/Cargo.toml` pointing at it
#                           with `package = "candela-lang"` and a `version`.
#                           crates.io takes no crate with a git dependency, so
#                           until that exists the crates.io job reports it and
#                           skips.
#
# Both registry jobs are ordinary re-runnable steps: they skip a version that
# is already published, so a leg that failed halfway is fixed by running the
# workflow again.
#
# One crates.io job, not one per package: `lumenui` depends on `lumenc`, which
# depends on the rest of the workspace, so there is a single dependency order
# covering all of them, and tools/release/publish-crates.py computes it.
# Publishing them in separate jobs would only mean computing the same order
# twice and racing on it.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and verify everything, upload nothing"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  # What is being published, and whether each leg has what it needs. Secrets
  # cannot be read in a job-level `if`, so the answers become outputs here and
  # the jobs below gate on them.
  preflight:
    name: preconditions
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      dry_run: ${{ steps.mode.outputs.dry_run }}
      crates_io: ${{ steps.mode.outputs.crates_io }}
      pypi: ${{ steps.mode.outputs.pypi }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      - name: Read the workspace version
        id: version
        run: |
          version="$(awk -F'"' '
            /^\[workspace\.package\]/ { in_section = 1; next }
            /^\[/                     { in_section = 0 }
            in_section && /^version[[:space:]]*=/ { print $2; exit }
          ' Cargo.toml)"
          if [ -z "$version" ]; then
            echo "publish.yml: no [workspace.package] version in Cargo.toml" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "publishing version $version"

      # A release publishes the tag it was cut from, so the tag and the
      # workspace version have to agree, the same check release.yml makes
      # before it builds anything.
      - name: Compare the tag with the workspace version
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          tag="${TAG#v}"
          if [ "$tag" != "$VERSION" ]; then
            echo "publish.yml: release $TAG says $tag, Cargo.toml says $VERSION." >&2
            exit 1
          fi
          echo "release $TAG matches the workspace version"

      - name: Decide what each leg may do
        id: mode
        env:
          CRATES_IO_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
          PYPI_PUBLISH_ENABLED: ${{ vars.PYPI_PUBLISH_ENABLED }}
          DRY_RUN_INPUT: ${{ inputs.dry_run }}
        run: |
          dry_run=false
          if [ "$DRY_RUN_INPUT" = "true" ]; then
            dry_run=true
          fi
          echo "dry_run=$dry_run" >> "$GITHUB_OUTPUT"

          if [ -n "$CRATES_IO_TOKEN" ]; then
            echo "crates_io=true" >> "$GITHUB_OUTPUT"
          else
            echo "crates_io=false" >> "$GITHUB_OUTPUT"
            echo "::notice::CRATES_IO_TOKEN is not set, so the crates.io job runs as a dry run"
          fi

          if [ "$PYPI_PUBLISH_ENABLED" = "true" ]; then
            echo "pypi=true" >> "$GITHUB_OUTPUT"
          else
            echo "pypi=false" >> "$GITHUB_OUTPUT"
            echo "::notice::PYPI_PUBLISH_ENABLED is not true, so the PyPI job uploads nothing"
          fi

  # The Python SDK. The distribution is pure Python: it wraps the C ABI with
  # ctypes and loads liblumen from wherever the machine has it, so one
  # py3-none-any wheel serves every platform and there is no build matrix.
  pypi:
    name: lumenui on PyPI
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: pypi
    permissions:
      # Trusted publishing: the job proves its identity to PyPI with a
      # short-lived OIDC token instead of carrying an API token.
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build the sdist and the wheel
        working-directory: sdk/python
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check dist/*

      # A version already on PyPI cannot be replaced, and re-running the
      # workflow after a partial release is normal, so a version that is
      # already there ends this job rather than failing it.
      - name: Check the version is not on PyPI yet
        id: pypi_state
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          code="$(curl -fsS -o /dev/null -w '%{http_code}' \
            "https://pypi.org/pypi/lumenui/$VERSION/json" || true)"
          if [ "$code" = "200" ]; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "::notice::lumenui $VERSION is already on PyPI"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload to PyPI
        if: >-
          needs.preflight.outputs.pypi == 'true' &&
          needs.preflight.outputs.dry_run == 'false' &&
          steps.pypi_state.outputs.published == 'false'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: sdk/python/dist

  # The Rust crates, in dependency order. tools/release/publish-crates.py
  # holds the ordering, the already-published check, and the waits the
  # crates.io rate limit requires; the step below only chooses its mode.
  #
  # The timeout is generous because the first publish is: crates.io lets an
  # account create a few new crates and then meters the rest, and this
  # workspace is several dozen crates. Later releases publish new versions of
  # crates that exist, which is metered far more loosely.
  crates-io:
    name: crates on crates.io
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      - name: Install pinned toolchain
        run: |
          rustup show active-toolchain
          rustc --version

      - name: Install Linux system dependencies
        run: .github/scripts/linux-deps.sh

      - uses: Swatinem/rust-cache@v2
        with:
          key: publish

      # The script exits 2 when something makes the run pointless to start: a
      # crate name that belongs to another project, a git dependency with no
      # published release, a version already out. That is a state to report and
      # skip on, not a failing build, so this workflow can sit on main while
      # those get sorted out.
      - name: Plan the publish order
        id: plan
        run: |
          set +e
          python3 tools/release/publish-crates.py --plan
          status=$?
          set -e
          if [ "$status" = "2" ]; then
            echo "runnable=false" >> "$GITHUB_OUTPUT"
            echo "::notice::crates.io publishing is blocked, see the plan above"
            exit 0
          fi
          echo "runnable=true" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Verify every crate packages
        if: >-
          steps.plan.outputs.runnable == 'true' &&
          (needs.preflight.outputs.dry_run == 'true' ||
           needs.preflight.outputs.crates_io == 'false')
        run: python3 tools/release/publish-crates.py --dry-run

      - name: Publish
        if: >-
          steps.plan.outputs.runnable == 'true' &&
          needs.preflight.outputs.dry_run == 'false' &&
          needs.preflight.outputs.crates_io == 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
        run: python3 tools/release/publish-crates.py --execute
