name: release

# Publishes the Lumen toolchain (lumenc + liblumen + the app launcher stub) to
# a GitHub release, in the exact shape tools/release/install.sh expects: one
# lumen-<target>.tar.gz per Unix target, lumen-windows-x86_64.msi as the
# Windows install channel plus lumen-windows-x86_64.zip as the portable
# archive, and lumen-web.tar.gz for the browser runtime. build-toolchain.yml
# builds every one of them and explains why each archive holds what it holds;
# this workflow decides when that happens and where the result lands.
#
# The release carries one more asset than the archives: sha256sums.txt, in
# sha256sum's own format, covering every asset published above. install.sh
# downloads it first, and refuses to install anything whose download does not
# match the line for it, so a release without this file is a release nobody
# can install from. .github/scripts/collect-release-assets.sh writes it in the
# publish job, from the artifacts as they are about to be uploaded, which is
# what keeps it in step with a partial release where a build leg failed.
#
# The MSI installs one extra file the zip does not carry: the receipt at
# share/lumen/lumen.receipt. That file is what marks a copy as installed, and
# an installed copy is the only kind that checks for updates. See
# tools/release/msi/lumen.wxs.
#
# A release starts from one click: run this workflow by hand (the Actions tab,
# or `gh workflow run release -f version=X.Y.Z`) on main. That run is the cut:
# it reads the version from the workspace Cargo.toml, refuses unless the typed
# version is the same one, refuses a version that is already tagged or is not
# newer than the last release, regenerates THIRD-PARTY-LICENSES and commits it
# to main when it changed, waits for `ci` to pass on the commit it is about to
# tag, and pushes the tag. Nothing is built in that run.
#
# The tag push starts this workflow a second time, and that run is the
# release: everything from the version guard down. The tag goes over SSH with
# the write deploy key for the reason the bump job gives below: a push made
# with GITHUB_TOKEN raises no workflow events, so a tag pushed that way would
# start nothing.
#
# nightly.yml builds the same artifacts every night and publishes them under a
# rolling `nightly` tag; that tag does not match the pattern below, so a
# nightly never cuts a release, moves the version on main, or reaches any of
# the channels named next.
#
# Once the release exists, this workflow starts everything that follows from
# it: the language registries, the OS package managers, the editor
# marketplaces, the docs site, and the lumen-server container image. Each of
# those lives in its own file and is called from here rather than triggered by
# the release, because the release is created with the built-in token and
# GitHub raises no workflow events for anything that token writes; a workflow
# waiting on `release: published` waits forever. Each file but the image one
# keeps a `workflow_dispatch` trigger, so a leg that failed is re-run on its
# own without another tag; the image is re-run from the release run, because
# it copies that run's binaries.
#
# The last job sets the workspace version on `main` to the next patch, files
# the migration notes the release shipped with under its own version, and
# pushes both there, so the click is the whole release: nothing is left to
# merge and nothing is left to type.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: >-
          The version to release, typed back as the workspace Cargo.toml on
          main carries it (for example 0.0.10). The run stops if it differs.
        type: string
        required: true

# contents: write is granted to the one job whose token writes to the
# repository, the one that publishes the release, and packages: write to the
# one that pushes the server image. The license, tag and bump jobs write to
# the repository over SSH with a deploy key instead, for the reasons the bump
# job's comment gives, so their tokens stay read-only; the cut's jobs add
# actions: read to see `ci` runs. build-toolchain.yml declares its own
# read-only token for the builds.
permissions:
  contents: read

# Unlike ci.yml, a release in progress is never cancelled by a follow-up
# push to the same tag (tags do not move) or a different tag (different
# group). This only matters if the same tag is deleted and re-pushed.
#
# Every cut shares one group, whatever branch it was started from, so two
# clicks cannot race each other to the tag: the second waits for the first and
# then finds the tag already there.
concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && 'release-cut' || format('release-{0}', github.ref) }}
  cancel-in-progress: false

jobs:
  # The first of the three jobs a click runs. Everything it refuses, it refuses
  # before anything is written anywhere, and each refusal says what to fix.
  #
  # The commit being released is the one main was at when the button was
  # pressed (github.sha), not whatever main is by the time a job reads it. The
  # license commit below lands only as a fast-forward of that commit, and the
  # tag lands only on that commit or on the license commit, so a merge to main
  # during the run is never released by accident.
  preflight:
    name: check what is being released
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      sha: ${{ steps.version.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      - name: Check the version
        id: version
        env:
          TYPED: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF}" != refs/heads/main ]; then
            echo "release.yml: a release is cut from main, and this run was started on ${GITHUB_REF}." >&2
            echo "Start it again with main selected as the branch." >&2
            exit 1
          fi

          version="$(awk -F'"' '
            /^\[workspace\.package\]/ { in_section = 1; next }
            /^\[/                     { in_section = 0 }
            in_section && /^version[[:space:]]*=/ { print $2; exit }
          ' Cargo.toml)"
          if ! printf '%s' "$version" | grep -Eqx '[0-9]+\.[0-9]+\.[0-9]+'; then
            echo "release.yml: the [workspace.package] version in Cargo.toml is '${version}', not X.Y.Z." >&2
            exit 1
          fi

          # The typed version is the confirmation. A checkbox is ticked out of
          # habit; typing the number proves the person pressing the button
          # knows which release they are about to publish, and catches the
          # case where main is not at the version they expect.
          if [ "${TYPED#v}" != "$version" ]; then
            echo "release.yml: you typed '${TYPED}', and main's Cargo.toml says ${version}." >&2
            echo "Nothing was released. Start the run again and type ${version}, or move" >&2
            echo "main to the version you meant with tools/release/bump-version.py first." >&2
            exit 1
          fi

          tag="v${version}"
          tags="$(git ls-remote --tags --refs origin 'refs/tags/v*' | sed 's|.*refs/tags/||')"
          if printf '%s\n' "$tags" | grep -qx "$tag"; then
            echo "release.yml: ${tag} is already tagged, so it is already released or being released." >&2
            echo "If that release only partly published, re-run the failed jobs of its own run" >&2
            echo "rather than cutting it again; tools/release/release-checklist.md says how." >&2
            exit 1
          fi
          newest="$(printf '%s\n' "$tags" | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1 || true)"
          if [ -n "$newest" ] && [ "$(printf '%s\n%s\n' "$newest" "$tag" | sort -V | tail -n 1)" != "$tag" ]; then
            echo "release.yml: ${tag} is not newer than the last release, ${newest}." >&2
            exit 1
          fi

          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "sha=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          {
            echo "### Cutting ${tag}"
            echo
            echo "From main at \`${GITHUB_SHA}\`${newest:+, the release after ${newest}}."
          } >> "$GITHUB_STEP_SUMMARY"

      # A commit whose run already failed is not going to be released, so say
      # so now rather than after the license commit and a two-hour wait. A run
      # still going is waited for by the tag job.
      - name: Check ci on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: tools/release/main-ci.sh check "${GITHUB_SHA}"

      # The migration notes in this tree are the release's migration guide,
      # and the release job turns their headings into the top of the release
      # body. Rendering that section now, from a tag that exists only on this
      # runner, stops a malformed note before the tag rather than after it,
      # and puts the section on this run's summary to read.
      - name: Check the migration notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          git fetch --quiet --depth=1 origin '+refs/tags/v*:refs/tags/v*'
          git tag "v${VERSION}" "${GITHUB_SHA}"
          tools/release/migration-notes.sh "v${VERSION}" "${RUNNER_TEMP}/migration-notes.md"
          git tag -d "v${VERSION}" >/dev/null
          if [ -s "${RUNNER_TEMP}/migration-notes.md" ]; then
            { echo; cat "${RUNNER_TEMP}/migration-notes.md"; } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "no migration notes for v${VERSION}"
          fi

  # Every archive, the MSI, and every app `lumenc package` writes carries
  # THIRD-PARTY-LICENSES, so a stale one ships the wrong license text. The file
  # is a function of Cargo.lock and the pinned cargo-about, so it is
  # regenerated here and, when it changed, committed straight to main the way
  # the bump job commits: over SSH with the write deploy key, for the same two
  # reasons that job gives. The commit is a fast-forward of the commit the
  # click released and nothing else, so a main that moved meanwhile refuses
  # it and the run stops.
  #
  # A license cargo-about does not recognise stops the job. Read it and add it
  # to the `accepted` list in about.toml, rather than dropping the crate.
  licenses:
    name: regenerate the third-party licenses
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.sha }}
          lfs: false

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about@0.9.2

      - name: Regenerate THIRD-PARTY-LICENSES
        run: cargo about generate about.hbs -o THIRD-PARTY-LICENSES

      - name: Commit it to main if it changed
        id: commit
        env:
          BASE: ${{ needs.preflight.outputs.sha }}
          VERSION: ${{ needs.preflight.outputs.version }}
          DEPLOY_KEY: ${{ secrets.REPIN_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "THIRD-PARTY-LICENSES is current"
            echo "sha=${BASE}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed="$(git diff --name-only)"
          if [ "$changed" != THIRD-PARTY-LICENSES ]; then
            echo "release.yml: regenerating the licenses changed more than THIRD-PARTY-LICENSES:" >&2
            printf '%s\n' "$changed" | sed 's/^/  /' >&2
            exit 1
          fi
          if [ -z "${DEPLOY_KEY}" ]; then
            echo "release.yml: THIRD-PARTY-LICENSES is out of date, and there is no REPIN_DEPLOY_KEY" >&2
            echo "to push the regenerated file to main with. Restore the secret and start again." >&2
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -qam "chore(license): bring THIRD-PARTY-LICENSES up to date for v${VERSION}"

          key_file="$(mktemp)"
          trap 'rm -f "${key_file}"' EXIT
          printf '%s\n' "${DEPLOY_KEY}" > "${key_file}"
          export GIT_SSH_COMMAND="ssh -i ${key_file} -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
          if ! git push "git@github.com:${GITHUB_REPOSITORY}.git" HEAD:main; then
            echo "release.yml: the license commit could not be pushed to main. Either main" >&2
            echo "moved after the click, which starting the release again answers, or the" >&2
            echo "deploy key no longer bypasses the ruleset on main." >&2
            exit 1
          fi
          sha="$(git rev-parse HEAD)"
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"
          echo "::notice::THIRD-PARTY-LICENSES updated on main at ${sha}"

  # The tag goes only on a commit whose `ci` run on main passed: the commit the
  # click released, or the license commit on top of it. A license commit
  # starts its own run, and this waits for it.
  #
  # The tag is pushed over SSH with the deploy key. GITHUB_TOKEN would create
  # it just as well, but GitHub starts no workflow for anything that token
  # pushes, so the release run below would never begin.
  tag:
    name: tag the release
    needs: [preflight, licenses]
    runs-on: ubuntu-latest
    # The ci wait below gives up after two hours.
    timeout-minutes: 140
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.licenses.outputs.sha }}
          lfs: false

      - name: Wait for ci on main
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ needs.licenses.outputs.sha }}
        run: tools/release/main-ci.sh wait "${SHA}" 120

      - name: Push the tag
        env:
          SHA: ${{ needs.licenses.outputs.sha }}
          VERSION: ${{ needs.preflight.outputs.version }}
          DEPLOY_KEY: ${{ secrets.REPIN_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          tag="v${VERSION}"
          if [ -z "${DEPLOY_KEY}" ]; then
            echo "release.yml: no REPIN_DEPLOY_KEY to push ${tag} with. A tag pushed with the" >&2
            echo "workflow's own token would start no release run. Restore the secret and" >&2
            echo "start again." >&2
            exit 1
          fi
          key_file="$(mktemp)"
          trap 'rm -f "${key_file}"' EXIT
          printf '%s\n' "${DEPLOY_KEY}" > "${key_file}"
          export GIT_SSH_COMMAND="ssh -i ${key_file} -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"

          # Asked again here, because a tag pushed by hand during the wait
          # would otherwise be overwritten or collide.
          if git ls-remote --tags --refs origin "refs/tags/${tag}" | grep -q .; then
            echo "release.yml: ${tag} appeared while this run was waiting; nothing was pushed." >&2
            exit 1
          fi
          git tag "${tag}" "${SHA}"
          git push "git@github.com:${GITHUB_REPOSITORY}.git" "refs/tags/${tag}"
          echo "::notice::pushed ${tag} at ${SHA}"

      # The tag push is what starts the release, so a run that never appears
      # is the one failure that would otherwise be silent.
      - name: Find the release run
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          set -euo pipefail
          tag="v${VERSION}"
          for _ in $(seq 1 30); do
            url="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/release.yml/runs?event=push&branch=${tag}&per_page=1" \
                     --jq '.workflow_runs[0].html_url // empty')"
            if [ -n "$url" ]; then
              echo "the ${tag} release is building: ${url}"
              echo "The ${tag} release is building: ${url}" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 10
          done
          echo "release.yml: ${tag} is pushed, but no release run started for it within five" >&2
          echo "minutes. Look for it in the Actions tab; if there is none, the tag push raised" >&2
          echo "no event, and tools/release/release-checklist.md says how to recover." >&2
          exit 1

  # The tag is the version, and three separate things read it: the MSI's
  # ProductVersion, the receipt the MSI installs, and CARGO_PKG_VERSION baked
  # into lumenc by the workspace Cargo.toml. Nothing downstream reconciles
  # them, so a tag that disagrees with Cargo.toml ships an installer whose
  # ARP entry, receipt, and `lumenc --version` all say different things. Catch
  # it before anything is built.
  #
  # This is the first job of the run the tag push starts, and the only one the
  # rest of the release depends on directly, so gating it on the event keeps
  # every job below out of the run a click starts.
  version:
    name: tag matches the workspace version
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.compare.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      - name: Compare the tag with Cargo.toml
        id: compare
        run: |
          tag="${GITHUB_REF_NAME#v}"
          crate="$(awk -F'"' '
            /^\[workspace\.package\]/ { in_section = 1; next }
            /^\[/                     { in_section = 0 }
            in_section && /^version[[:space:]]*=/ { print $2; exit }
          ' Cargo.toml)"
          if [ -z "$crate" ]; then
            echo "release.yml: no [workspace.package] version in Cargo.toml" >&2
            exit 1
          fi
          if [ "$tag" != "$crate" ]; then
            echo "release.yml: tag ${GITHUB_REF_NAME} says $tag, Cargo.toml says $crate." >&2
            echo "The MSI version, the install receipt, and lumenc --version all come from" >&2
            echo "these two values. Bump [workspace.package] version to $tag (or retag as" >&2
            echo "v$crate) and push again." >&2
            exit 1
          fi
          echo "version=$crate" >> "$GITHUB_OUTPUT"
          echo "tag ${GITHUB_REF_NAME} matches the workspace version $crate"

  # Every archive on the release, plus the Windows installer stamped with the
  # version the job above agreed on.
  build:
    name: build
    needs: version
    uses: ./.github/workflows/build-toolchain.yml
    with:
      msi_version: ${{ needs.version.outputs.version }}

  release:
    name: publish release
    needs: [version, build]
    # Runs even if one build leg failed, so a single broken target (most
    # likely linux-aarch64 or macos-x86_64 - see build-toolchain.yml) or a
    # broken browser runtime still lets every other archive reach the release
    # instead of blocking all of them. gh release upload --clobber makes
    # re-running this job safe after a fix: it replaces same-named assets
    # rather than failing on them.
    #
    # A tag that disagrees with Cargo.toml publishes nothing at all, which is
    # why the version guard is a gate here and not one more build leg.
    if: always() && needs.version.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      # Refuses a run where every leg failed, and writes the sha256sums.txt
      # install.sh verifies every download against.
      - name: Collect what was built
        run: .github/scripts/collect-release-assets.sh artifacts

      # For a plain vX.Y.Z tag, the migration notes in the tag's tree become
      # the top of the release body: the release they migrate from, a link to
      # the guide, and one line per note. The earlier release tags are fetched so the script can name
      # the one this migrates from. With no notes the section is empty. GitHub
      # puts the file's text, this section and the template list below it,
      # above its own generated notes.
      - name: Write the migration notes
        run: |
          git fetch --quiet --depth=1 origin '+refs/tags/v*:refs/tags/v*'
          tools/release/migration-notes.sh "${{ github.ref_name }}" "${RUNNER_TEMP}/migration-notes.md"

      # Then the commit of every template the toolchain packaged, since a
      # template is fetched from its repository's main and carries no tag of
      # its own for this release.
      - name: Name the template commits
        env:
          REVS: ${{ needs.build.outputs.templates }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          notes="${RUNNER_TEMP}/migration-notes.md"
          if [ -z "${REVS}" ]; then
            echo "::warning::the build named no template commits, so the release body names none"
            exit 0
          fi
          if [ -s "$notes" ]; then echo >> "$notes"; fi
          printf "## Templates\n\n\`lumenc new\` scaffolds these commits of the template repositories:\n\n" >> "$notes"
          tr ' ' '\n' <<< "${REVS}" | while IFS='=' read -r name sha; do
            printf -- "- [\`%s\` at \`%s\`](https://github.com/%s/%s/tree/%s)\n" \
              "${name}" "${sha:0:7}" "${OWNER}" "${name}" "${sha}" >> "$notes"
          done

      - name: Create the release and upload assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          files=(artifacts/*.tar.gz artifacts/*.zip artifacts/*.msi artifacts/sha256sums.txt)
          if gh release view "${{ github.ref_name }}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "${{ github.ref_name }}" "${files[@]}" \
              --repo "${{ github.repository }}" --clobber
          else
            gh release create "${{ github.ref_name }}" "${files[@]}" \
              --repo "${{ github.repository }}" \
              --title "${{ github.ref_name }}" \
              --notes-file "${RUNNER_TEMP}/migration-notes.md" \
              --generate-notes
          fi

  # The four channels a release feeds, each in the file that owns it. They run
  # alongside each other and alongside the bump, off the tag this run was
  # started by: a called workflow sees the caller's ref, so `actions/checkout`
  # in any of them lands on the commit that was tagged.
  #
  # `secrets: inherit` because every one of them reads credentials the
  # repository holds, and none of them can be handed a secret this workflow
  # does not already have.

  registries:
    name: registries
    needs: release
    uses: ./.github/workflows/publish.yml
    # The PyPI leg proves its identity to PyPI with an OIDC token. A called
    # workflow can only narrow the permissions its caller granted, so the grant
    # is made here; `contents: read` is listed too, because naming any
    # permission drops the rest to none and the jobs check the repository out.
    permissions:
      contents: read
      id-token: write
    secrets: inherit

  packages:
    name: package managers
    needs: release
    uses: ./.github/workflows/publish-packages.yml
    with:
      tag: ${{ github.ref_name }}
    secrets: inherit

  extensions:
    name: editor extensions
    needs: release
    uses: ./.github/workflows/publish-extensions.yml
    secrets: inherit

  site:
    name: site rebuild
    needs: release
    uses: ./.github/workflows/site-rebuild.yml
    secrets: inherit

  # The lumen-server image on GHCR, built from the Linux archives this run
  # just published. It needs nothing but those two, so a failed macOS or
  # Windows leg does not hold it back; a failed Linux leg fails it.
  # server-image.yml decides the tags, and only a plain vX.Y.Z tag moves
  # :latest.
  server-image:
    name: server image
    needs: [version, release]
    if: always() && needs.release.result == 'success'
    uses: ./.github/workflows/server-image.yml
    permissions:
      contents: read
      packages: write
    with:
      channel: release
      version: ${{ needs.version.outputs.version }}

  # Cutting a release is one click and nothing else, so the version main
  # carries has to move afterwards on its own. This moves it, by committing
  # straight to main, which leaves a release asking nothing of anyone after the
  # click.
  #
  # The push goes over SSH with the write deploy key, not with GITHUB_TOKEN,
  # for two separate reasons. A push authenticated by GITHUB_TOKEN raises no
  # workflow events, so the bump commit would sit on main with no `ci` run
  # behind it. And the ruleset on main requires a pull request, which only a
  # bypass actor may skip; the deploy key is the one actor in that list allowed
  # to skip it on a direct push. `grammar-pins.yml` pushes to main the same way
  # with the same key, which is why there is one secret for both.
  #
  # The next version is always the next patch. Nothing here can know whether
  # the work after this release is a fix or a feature, and being predictable is
  # worth more than being right: a number that is always one patch ahead is
  # corrected by one commit, while a number that follows a rule somebody has to
  # remember is not. Tags in any other shape, a prerelease among them, are left
  # alone, because incrementing one is a decision rather than an increment.
  #
  # The same commit moves the migration notes. In the tree of a tag,
  # docs/migration/unreleased/ is the guide for that tag, so the notes it holds
  # move to docs/migration/<tag>/ (tools/release/release-fragments.sh). That
  # happens even when the version is left alone because main is already at or
  # past the next one: a note left in unreleased/ would be claimed by the next
  # release instead. A note merged after the tag is not in its tree and stays
  # where it is. When only the notes move, the commit carries only them. A
  # prerelease or other tag shape files no notes; they stay for the plain
  # release that follows it.
  #
  # A release that published only some of its archives still published the tag,
  # so main stops claiming that version either way; `release` runs on a partial
  # release and this follows it. What makes a re-run safe is the version on
  # main itself: the first run moves main past the tag it was cut for, and
  # every later run of that tag, or of an older one, reads main, finds it at or
  # past the number it was going to write, finds the notes already moved, and
  # stops before committing anything. Two releases running at once resolve the same way, because each
  # attempt re-reads main immediately before it writes.
  #
  # A push that cannot be made fails the job rather than falling back to a
  # pull request. There is one way for main to move here, and a fallback that
  # quietly restores the flow this replaced would hide a missing key or a
  # changed ruleset until the next release fails its tag-versus-manifest check.
  #
  # Only main moves here. The publishing jobs above check out the tag this run
  # was started by, so none of them is disturbed by main moving under them.
  bump:
    name: move main to the next version
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          lfs: false

      - name: Set main to the next version
        env:
          TAG: ${{ github.ref_name }}
          DEPLOY_KEY: ${{ secrets.REPIN_DEPLOY_KEY }}
        run: |
          set -euo pipefail

          # The migration notes move by what the tag's tree holds, so the tag
          # itself has to be here.
          git fetch --quiet --depth=1 origin "+refs/tags/${TAG}:refs/tags/${TAG}"

          next=""
          released="${TAG#v}"
          if printf '%s' "$released" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            next="${released%.*}.$(( 10#${released##*.} + 1 ))"
          else
            echo "::notice::${TAG} is not a plain vX.Y.Z tag, so what comes after it is a choice; bump by hand"
          fi

          if [ -n "${DEPLOY_KEY}" ]; then
            key_file="$(mktemp)"
            trap 'rm -f "${key_file}"' EXIT
            printf '%s\n' "${DEPLOY_KEY}" > "${key_file}"
            export GIT_SSH_COMMAND="ssh -i ${key_file} -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Each attempt reads main, writes the change against that exact
          # commit, and pushes it as a fast-forward. A refused push means either
          # that main moved while this was being prepared, which reading main
          # again answers, or that the key cannot write, which nothing here
          # answers.
          for attempt in 1 2 3; do
            git fetch --quiet origin main
            git reset --quiet --hard FETCH_HEAD
            if ! git diff --quiet; then
              echo "release.yml: main is dirty the moment it is checked out, so a commit here would carry more than the bump" >&2
              exit 1
            fi

            bump=""
            if [ -n "$next" ]; then
              current="$(awk -F'"' '
                /^\[workspace\.package\]/ { in_section = 1; next }
                /^\[/                     { in_section = 0 }
                in_section && /^version[[:space:]]*=/ { print $2; exit }
              ' Cargo.toml)"
              if [ -z "$current" ]; then
                echo "release.yml: no [workspace.package] version in Cargo.toml" >&2
                exit 1
              fi

              # The bump already landed, or this is a re-run of an older
              # release after later ones went out. Either way main is where it
              # should be or further on, and bumping would walk it backwards.
              oldest="$(printf '%s\n%s\n' "$current" "$next" | sort -V | head -1)"
              if [ "$current" = "$next" ] || [ "$oldest" = "$next" ]; then
                echo "::notice::main is at ${current}, at or past ${next}; nothing to bump"
              else
                python3 tools/release/bump-version.py "$next"
                if git diff --quiet; then
                  echo "release.yml: bump-version.py changed nothing on the way to ${next}" >&2
                  exit 1
                fi
                bump="$next"
              fi
            fi

            # The notes a plain tag shipped with move to docs/migration/<tag>/
            # in the same commit, whether or not the version moved. Notes
            # merged after the tag are not in its tree and stay for the next
            # release.
            tools/release/release-fragments.sh "$TAG"

            if git diff --quiet && git diff --cached --quiet; then
              echo "::notice::nothing to commit for ${TAG}"
              exit 0
            fi
            if [ -n "$bump" ]; then
              body=()
              if ! git diff --cached --quiet -- docs/migration; then
                body=(-m "Files the ${TAG} migration notes under docs/migration/${TAG}/.")
              fi
              git commit -qa -m "chore: set the workspace version to ${bump}" "${body[@]}"
            else
              git commit -qm "docs: file the ${TAG} migration notes under their release"
            fi

            if [ -z "${DEPLOY_KEY}" ]; then
              echo "release.yml: no REPIN_DEPLOY_KEY, and main takes no other pusher." >&2
              echo "Land this commit as a pull request instead:" >&2
              git show --stat --format='  %s' HEAD >&2
              exit 1
            fi
            if git push "git@github.com:${GITHUB_REPOSITORY}.git" HEAD:main; then
              echo "::notice::main is at $(git rev-parse --short HEAD) for ${TAG}"
              exit 0
            fi
            echo "::notice::attempt ${attempt} to push the ${TAG} follow-up to main was refused; reading main again"
          done

          echo "release.yml: the ${TAG} follow-up could not be pushed to main. Either the" >&2
          echo "deploy key no longer bypasses the ruleset, or main is moving faster than" >&2
          echo "this can follow. Run tools/release/bump-version.py <next version> (if the" >&2
          echo "version still has to move) and tools/release/release-fragments.sh ${TAG}," >&2
          echo "and land the result as a pull request." >&2
          exit 1
