name: site-rebuild

# Tells the site repo to rebuild and redeploy when a release is published, so
# the docs a visitor reads describe the version they can install. Following
# main instead would document a feature before there is anything to download
# it in.
#
# The trigger is the published release rather than the tag push, because the
# tag is what starts `release.yml`: dispatching then would rebuild the site
# while the assets it links to are still being built.
#
# `workflow_dispatch` is here for a docs correction that should not wait for
# the next release.
#
# Needs the SITE_BUILD_TOKEN secret: a fine-grained PAT that can write
# contents on lumen-fx/site. Without the secret the step skips with a notice
# and the site's daily cron picks the change up; with it, a failed dispatch
# fails this run.

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Send product-updated to the site
        env:
          GH_TOKEN: ${{ secrets.SITE_BUILD_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::notice::SITE_BUILD_TOKEN is not set; skipping the site dispatch." \
                 "The site's daily cron rebuild picks this change up instead."
            exit 0
          fi
          gh api repos/lumen-fx/site/dispatches -f event_type=product-updated
