name: site-rebuild

# Tells the site repo to rebuild and redeploy when a release goes out, so the
# docs a visitor reads describe the version they can install. Following main
# instead would document a feature before there is anything to download it in.
#
# release.yml calls this once the release is published, so the assets the docs
# link to are there before the site is rebuilt. Waiting on `release: published`
# instead would never fire:
# release.yml creates the release with the built-in token, and GitHub raises no
# workflow events for anything that token writes.
#
# `workflow_dispatch` is here for a docs correction that should not wait for
# the next release.
#
# A nightly never reaches this. nightly.yml calls nothing, and the only
# automatic caller is release.yml, which fires on `v*` tags while the nightly
# publishes onto a tag named `nightly`.
#
# Needs the SITE_BUILD_TOKEN secret: a fine-grained PAT that can write
# contents on lumen-fx/site. Without the secret the step skips with a notice
# and the site's daily cron picks the change up; with it, a failed dispatch
# fails this run.

on:
  workflow_call:
  workflow_dispatch:

# The dispatch authenticates as SITE_BUILD_TOKEN, so the built-in token needs
# nothing at all.
permissions: {}

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Send product-updated to the site
        env:
          GH_TOKEN: ${{ secrets.SITE_BUILD_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::notice::SITE_BUILD_TOKEN is not set; skipping the site dispatch." \
                 "The site's daily cron rebuild picks this change up instead."
            exit 0
          fi
          gh api repos/lumen-fx/site/dispatches -f event_type=product-updated
