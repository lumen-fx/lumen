name: site-rebuild

# Tells the site repo to rebuild and redeploy when main changes, so the
# published docs track this repo. Needs the SITE_BUILD_TOKEN secret: a
# fine-grained PAT that can write contents on lumen-fx/site. Without the
# secret the step skips with a notice and the site's daily cron picks the
# change up; with it, a failed dispatch fails this run.

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "tools/install.sh"

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Send product-updated to the site
        env:
          GH_TOKEN: ${{ secrets.SITE_BUILD_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::notice::SITE_BUILD_TOKEN is not set; skipping the site dispatch." \
                 "The site's daily cron rebuild picks this change up instead."
            exit 0
          fi
          gh api repos/lumen-fx/site/dispatches -f event_type=product-updated
