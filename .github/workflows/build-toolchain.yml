name: build-toolchain

# Builds the Lumen toolchain archives, in the exact shape
# tools/release/install.sh expects: one lumen-<target>.tar.gz per Unix target
# and, for Windows, lumen-windows-x86_64.zip as the portable archive plus
# lumen-windows-x86_64.msi as the install channel. Every one of them holds
# bin/lumenc, the liblumen shared library, bin/lumen-launcher, and the two
# trees lumenc reads from beside itself: the candela standard library in
# bin/libs and the `lumenc new` templates in bin/templates. The Unix
# archives also carry the shared engine (liblumen_engine + the Rust libstd
# it was built against - see the dynamic-engine build step) and the shell
# completions under share/. That layout comes from four places, not from
# guessing:
#
#   - install.sh requires a top-level bin/ directory in the archive (its
#     unpack step fails otherwise) and looks up the asset by the exact name
#     lumen-<target>.tar.gz / lumen-windows-x86_64.msi.
#   - public/lumenc/src/loader.rs dlopens liblumen from next to its own executable
#     (or an LUMEN_LIB_DIR override, or the platform loader's default
#     search path) - never from a sibling lib/ directory. So the shared
#     library goes in bin/, next to lumenc, or a normal `~/.lumen` install
#     would put a lumenc on PATH that cannot find its own runtime.
#   - public/lumenc/src/package_cli.rs looks for the launcher stub in the same place
#     it looks for liblumen, so `lumenc package` on an installed toolchain
#     finds it without being told where it is. An archive without the stub
#     leaves that command with nothing to build an app executable from.
#   - public/lumenc/src/scaffold.rs reads the `lumenc new` templates from a
#     templates/ directory beside the executable. The templates are not in
#     this repository at all: each is its own repository under lumen-fx, and
#     tools/fetch-templates.sh downloads the copy that ships here.
#
# The Unix legs also produce lumen-modules-<target>.tar.gz: the bundled
# runtime modules (std/ in the tree, `bundled = true` in an app's
# [dependencies]), built in the same cargo invocation as the engine so their
# build ids match it exactly, and shipped as their own archive with the same
# bin/ layout. install.sh unpacks it over the same prefix. Windows gets no
# modules archive; the capabilities are compiled into its binaries.
#
# It also builds one artifact that belongs to no platform: lumen-web.tar.gz,
# holding the browser runtime `lumenc web` copies beside the pages it emits.
# WebAssembly is the same everywhere, so it is built once and downloaded by
# every `lumenc` that emits a site, into a cache keyed on the version rather
# than on a target. public/lumenc/src/package_cli.rs looks for it under that
# exact name, so a publish without it leaves `lumenc web` with nothing to give
# a page to load.
#
# All builds run under the workspace's [profile.release] (opt-level "s",
# fat LTO, strip = "symbols" - already stripped, no separate strip step
# needed here).
#
# Target coverage - every leg here builds natively for its own target, no
# cross-compilation:
#
#   linux-x86_64    ubuntu-latest, same image as ci.yml
#   linux-aarch64   ubuntu-24.04-arm, GitHub's hosted Arm64 Linux runner.
#                   ci.yml's matrix has no aarch64 leg, so this is the only
#                   place this target gets built at all; unlike x86_64 it is
#                   not proven by a green CI run first.
#   macos-aarch64   macos-latest (Apple Silicon), same image as ci.yml
#   macos-x86_64    macos-26-intel. ci.yml has no Intel Mac leg either;
#                   this label is what lumen-fx/candela's own release
#                   workflow uses today, which is the freshest evidence
#                   available that it is a real, current runner image.
#   windows-x86_64  windows-latest, same image as ci.yml
#
# install.sh also accepts a windows-aarch64 target in principle (it derives
# the target from `uname`/platform detection generically), but there is no
# GitHub-hosted Windows-on-Arm runner to build it on, so it is not produced.
# install.sh already handles a missing Windows asset gracefully (it prints
# the release page link instead of failing).
#
# Two workflows call this: release.yml, which publishes the result on a
# vX.Y.Z tag, and nightly.yml, which publishes it on the rolling `nightly`
# prerelease. Both download the same artifact names, so anything that changes
# the shape of an archive changes it for both at once.

on:
  workflow_call:
    inputs:
      msi_version:
        description: >-
          The version to stamp the Windows installer with, without a leading
          "v". Leave it empty to build the portable zip alone and skip the
          MSI; a caller with no version behind a release has nothing safe to
          stamp one with.
        type: string
        required: false
        default: ""

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    # The release profile (fat LTO, one codegen unit) is slower to build
    # than the dev-ish builds in ci.yml's test job, hence the longer budget.
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x86_64
            os: ubuntu-latest
            libname: liblumen.so
          - target: linux-aarch64
            os: ubuntu-24.04-arm
            libname: liblumen.so
          - target: macos-aarch64
            os: macos-latest
            libname: liblumen.dylib
          - target: macos-x86_64
            os: macos-26-intel
            libname: liblumen.dylib
          - target: windows-x86_64
            os: windows-latest
            libname: lumen.dll
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      - name: Install pinned toolchain
        run: |
          rustup show active-toolchain
          rustc --version

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: .github/scripts/linux-deps.sh

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      # Three crates, four-plus artifacts: the lumenc binary, the liblumen
      # shared library (crate lumen), the launcher stub `lumenc package` turns
      # into a shipped app, and - on Linux and macOS - the shared engine both
      # binaries link.
      #
      # The Unix leg builds lumenc and liblumen TOGETHER, dynamic-engine: one
      # cargo invocation resolves one engine feature graph, so the two link
      # the same liblumen_engine, which ships in bin/ beside them along with
      # the Rust standard library they were built against (`prefer-dynamic`
      # applies to libstd too). The `$ORIGIN` / `@loader_path` rpath is what
      # lets both resolve from bin/ with nothing else installed. The explicit
      # --target keeps prefer-dynamic off build scripts and proc macros. A
      # process shaped like this shares one engine instance with the runtime
      # modules it dlopens, which is what makes `[dependencies]` work in
      # shipped apps.
      #
      # The launcher stub stays a static self-contained binary on every
      # platform: it dlopens liblumen, and liblumen's own NEEDED entries bring
      # the engine into the process.
      #
      # Windows keeps the fully-static shape - its import-library format
      # cannot describe the engine's export count, so no engine dylib exists
      # there (see public/lumen-dylib/Cargo.toml).
      - name: Build lumenc + liblumen (dynamic engine, Unix)
        if: runner.os != 'Windows'
        env:
          # The engine is fetched and built by lumenc's build script only when
          # it is installed from outside a checkout; say so explicitly here so
          # a workspace change can never turn a release build into a download.
          LUMEN_SKIP_ENGINE_BUILD: "1"
        run: |
          triple="$(rustc -vV | sed -n 's/^host: //p')"
          echo "triple=$triple" >> "$GITHUB_ENV"
          case "$(uname -s)" in
            Darwin) rpath='@loader_path' ;;
            *)      rpath='$ORIGIN' ;;
          esac
          export RUSTFLAGS="-C prefer-dynamic -C link-arg=-Wl,-rpath,$rpath"
          # LTO cannot cross a dynamic-library boundary (rustc refuses
          # prefer-dynamic under LTO outright), so the dynamic shape trades
          # the release profile's fat LTO away.
          # The bundled runtime modules (std/) build in the same invocation:
          # one feature graph, so each module records the exact build id of
          # the engine shipping beside it. They ship in their own archive
          # (see the modules packaging step below).
          cargo build --release --target "$triple" \
            -p lumen \
            -p lumen-audio \
            -p lumen-fs \
            -p lumenc \
            --config 'profile.release.lto="off"' \
            --features lumenc/dynamic-engine,lumen/dynamic-engine

      - name: Build lumenc (Windows)
        if: runner.os == 'Windows'
        run: cargo build --release -p lumenc
        env:
          LUMEN_SKIP_ENGINE_BUILD: "1"

      - name: Build liblumen (Windows)
        if: runner.os == 'Windows'
        run: cargo build --release -p lumen

      - name: Build the app launcher stub
        run: cargo build --release -p lumen-launcher

      # The `lumenc new` templates. Each is maintained in a repository of its
      # own under lumen-fx and published there as an archive of its tree;
      # Lumen keeps no copy of any of them, so the copy the toolchain ships is
      # downloaded here and packaged below. `shell: bash` because the Windows
      # leg defaults to PowerShell; curl and tar are on every runner image.
      - name: Fetch the app templates
        shell: bash
        run: tools/fetch-templates.sh target/templates

      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist/bin
          cp "target/$triple/release/lumenc" dist/bin/
          cp "target/$triple/release/${{ matrix.libname }}" dist/bin/
          cp target/release/lumen-launcher dist/bin/
          # The shared engine the two binaries above link. cargo writes a
          # dependency's dylib into deps/ (unhashed - a shared library's file
          # name is its identity); tolerate either layout.
          for engine in \
            "target/$triple/release/liblumen_engine.so" \
            "target/$triple/release/liblumen_engine.dylib" \
            "target/$triple/release/deps/liblumen_engine.so" \
            "target/$triple/release/deps/liblumen_engine.dylib"; do
            if [ -f "$engine" ]; then cp "$engine" dist/bin/; break; fi
          done
          test -f dist/bin/liblumen_engine.so || test -f dist/bin/liblumen_engine.dylib
          # The engine ships to be loaded, never to be compiled against: its
          # consumers linked it in the build above. So the Rust crate
          # metadata rustc embeds in every dylib and any leftover debug info
          # are dead weight in the archive; drop both, keep the dynamic
          # symbols - they are what the linked binaries and the dlopen'd
          # runtime modules resolve. rustup's llvm-objcopy handles ELF and
          # Mach-O alike; on macOS the strip invalidates the ad-hoc code
          # signature, so it is re-signed. The `lumenc --version` run below
          # is what proves the stripped engine still loads.
          rustup component add llvm-tools
          objcopy="$(rustc --print sysroot)/lib/rustlib/$triple/bin/llvm-objcopy"
          for engine in dist/bin/liblumen_engine.so dist/bin/liblumen_engine.dylib; do
            [ -f "$engine" ] || continue
            "$objcopy" --strip-debug --remove-section=.rustc \
              --remove-section=__DATA,.rustc "$engine"
            if [ "$(uname -s)" = Darwin ]; then codesign -f -s - "$engine"; fi
          done
          # The shared Rust standard library everything above was built
          # against; prefer-dynamic makes every binary and dylib here open it.
          libdir="$(rustc --print target-libdir --target "$triple")"
          case "$(uname -s)" in
            Darwin) cp "$libdir"/libstd-*.dylib dist/bin/ ;;
            *)      cp "$libdir"/libstd-*.so dist/bin/ ;;
          esac
          # The candela standard library, staged beside the binaries by
          # lumen-script-candela's build script. candela reads `import
          # "std/..."` (and the array methods) out of `libs/` next to the
          # running executable, so it belongs beside lumenc, not in share/.
          cp -R "target/$triple/release/libs" dist/bin/libs
          # The app templates, beside lumenc for the same reason: `lumenc new`
          # reads them from next to its own executable
          # (public/lumenc/src/scaffold.rs), so an archive without them ships a
          # compiler that can scaffold nothing.
          cp -R target/templates dist/bin/templates
          # The rpath wiring is what this exercises: a dynamic lumenc that
          # cannot find its engine or libstd beside itself dies right here.
          ./dist/bin/lumenc --version
          # Shell completions, each under the directory its shell searches, so
          # a prefix on the usual search paths picks them up as installed. The
          # same scripts are embedded in lumenc (`lumenc completions <shell>`)
          # for anyone who installed some other way.
          mkdir -p dist/share/bash-completion/completions \
                   dist/share/zsh/site-functions \
                   dist/share/fish/vendor_completions.d
          cp public/lumenc/completions/lumenc.bash dist/share/bash-completion/completions/lumenc
          cp public/lumenc/completions/_lumenc dist/share/zsh/site-functions/_lumenc
          cp public/lumenc/completions/lumenc.fish dist/share/fish/vendor_completions.d/lumenc.fish
          tar -czf lumen-${{ matrix.target }}.tar.gz -C dist .

      # The bundled runtime modules, as their own archive beside the
      # toolchain one. Same bin/ layout, so unpacking it over the same
      # prefix drops each module beside the engine - which is where the
      # loader's `bundled = true` probe looks. Engine-locked modules are a
      # Unix shape; Windows compiles the same capabilities in.
      - name: Package the bundled modules (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p modules-dist/bin
          # One entry per module; the two spellings are the Linux and macOS
          # library names of the same build.
          modules=(
            "liblumen_audio.so liblumen_audio.dylib"
            "liblumen_fs.so liblumen_fs.dylib"
          )
          for spellings in "${modules[@]}"; do
            found=""
            for module in $spellings; do
              for built in \
                "target/$triple/release/$module" \
                "target/$triple/release/deps/$module"; do
                if [ -f "$built" ]; then
                  cp "$built" modules-dist/bin/
                  found="$module"
                  break 2
                fi
              done
            done
            if [ -z "$found" ]; then
              echo "no library built for: $spellings" >&2
              exit 1
            fi
          done
          tar -czf lumen-modules-${{ matrix.target }}.tar.gz -C modules-dist .

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist\bin | Out-Null
          Copy-Item target\release\lumenc.exe dist\bin\
          Copy-Item target\release\${{ matrix.libname }} dist\bin\
          Copy-Item target\release\lumen-launcher.exe dist\bin\
          Copy-Item -Recurse target\release\libs dist\bin\libs
          Copy-Item -Recurse target\templates dist\bin\templates
          Compress-Archive -Path dist\* -DestinationPath lumen-${{ matrix.target }}.zip

      # The MSI payload is staged separately from dist\, and only after the
      # zip is closed, because the two differ by one file. The MSI installs a
      # receipt, which is what marks a copy as installed and turns the daily
      # update check on; the portable zip must not carry one, or a
      # hand-extracted copy would start offering to MSI-install a second Lumen
      # beside itself.
      - name: Stage the MSI payload (Windows)
        if: runner.os == 'Windows' && inputs.msi_version != ''
        shell: pwsh
        env:
          MSI_VERSION: ${{ inputs.msi_version }}
        run: |
          New-Item -ItemType Directory -Force -Path msi-stage\bin, msi-stage\share\lumen | Out-Null
          Copy-Item -Recurse dist\bin\* msi-stage\bin\
          # LF line endings and no BOM: lumenc reads this with a plain line
          # split, and a BOM would land inside the first key.
          $receipt = "version $env:MSI_VERSION`ntarget windows-x86_64`ninstaller msi`n"
          [IO.File]::WriteAllText("$PWD\msi-stage\share\lumen\lumen.receipt", $receipt, [Text.Encoding]::ASCII)
          Get-Content msi-stage\share\lumen\lumen.receipt

      - name: Install WiX (Windows)
        if: runner.os == 'Windows' && inputs.msi_version != ''
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 6.0.1
          "$env:USERPROFILE\.dotnet\tools" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build the MSI (Windows)
        if: runner.os == 'Windows' && inputs.msi_version != ''
        shell: pwsh
        env:
          MSI_VERSION: ${{ inputs.msi_version }}
        run: |
          tools\release\msi\build-msi.ps1 `
            -Version $env:MSI_VERSION `
            -StageDir "$PWD\msi-stage" `
            -OutFile "$PWD\lumen-${{ matrix.target }}.msi"

      - uses: actions/upload-artifact@v4
        with:
          name: lumen-${{ matrix.target }}
          path: |
            lumen-${{ matrix.target }}.tar.gz
            lumen-modules-${{ matrix.target }}.tar.gz
            lumen-${{ matrix.target }}.zip
            lumen-${{ matrix.target }}.msi
          if-no-files-found: error
          retention-days: 1

  # One build for every platform, which is why the browser runtime is a job of
  # its own rather than a leg of the matrix above.
  #
  # The two files sit at the root of the archive. Nothing unpacks this one into
  # an install prefix: `lumenc` picks the members it wants out by name and
  # ignores their directories (public/lumenc/src/package_cli.rs), so a flat
  # archive is also what someone unpacking it by hand for `--lib-dir` ends up
  # wanting.
  web:
    name: build (web)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      - name: Install pinned toolchain
        run: |
          rustup show active-toolchain
          rustc --version

      # The command-line tool refuses an artifact built against a different
      # `wasm-bindgen` version, so this pin tracks the workspace dependency.
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen-cli@0.2.127

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-web

      # The same recipe ci.yml measures and runs a browser against, so what
      # ships is what was tested.
      - name: Build the browser runtime
        run: .github/scripts/build-web-runtime.sh web-dist

      - name: Package
        run: tar -czf lumen-web.tar.gz -C web-dist lumen-web.wasm lumen-web.js

      - uses: actions/upload-artifact@v4
        with:
          name: lumen-web
          path: lumen-web.tar.gz
          if-no-files-found: error
          retention-days: 1
