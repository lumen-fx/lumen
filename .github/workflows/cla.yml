name: CLA

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: read
  pull-requests: write
  statuses: write

jobs:
  cla:
    name: Check CLA signature
    runs-on: ubuntu-latest
    steps:
      - name: Check CLA signature
        if: >-
          github.event_name == 'pull_request_target' ||
          github.event.comment.body == 'recheck' ||
          github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'
        # Pinned by commit: contributor-assistant/github-action is archived and
        # unmaintained, so the tag is not a moving target worth trusting.
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PERSONAL_ACCESS_TOKEN: ${{ secrets.CLA_SIGNATURES_TOKEN }}
        with:
          path-to-document: https://github.com/lumen-fx/lumen/blob/main/CLA.md
          remote-organization-name: lumen-fx
          remote-repository-name: cla-signatures
          path-to-signatures: signatures/v1/cla.json
          branch: main
          allowlist: FizzWizZleDazzle,dependabot[bot],bot*
          lock-pullrequest-aftermerge: true
          custom-notsigned-prcomment: >-
            Thanks for the pull request. Before it can be merged, please read
            the [Contributor License Agreement](https://github.com/lumen-fx/lumen/blob/main/CLA.md)
            and sign it by posting the comment below. Signing is once per
            GitHub account and covers all your future pull requests here.
          custom-allsigned-prcomment: All contributors have signed the CLA.
          create-file-commit-message: Create the CLA signature store
          signed-commit-message: >-
            $contributorName signed the CLA in $owner/$repo#$pullRequestNo
