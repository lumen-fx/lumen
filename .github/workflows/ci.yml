name: ci

# Build and test the workspace on Linux, macOS, and Windows. The three-OS
# matrix is also the alpha-release parity matrix: a red mac or windows leg is
# a real portability gap, not a reason to drop the OS from the matrix.
#
# fmt and clippy run on Linux only. Both are repo law (CONTRIBUTING.md), and
# neither is platform dependent.

on:
  push:
    branches: [main]
  pull_request:
  # The merge queue runs these same jobs against the queued merge commit, and
  # they are required checks on main. Without this trigger the workflow never
  # reports a result there and queued pull requests wait forever.
  merge_group:
  # Manual trigger, for re-checking the platform matrix on demand.
  workflow_dispatch:

# One run per ref. A new push cancels the run it supersedes. Merge-queue refs
# are unique per queued merge, so this never cancels a queue entry.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Keep incremental artifacts out of the cache; they are large and useless
  # across runners.
  CARGO_INCREMENTAL: 0

jobs:
  # Whether the diff can affect the Rust build at all. The test matrix is
  # skipped step-by-step rather than at the job level: a job-level skip on a
  # matrix never expands it, and the required test contexts would wait
  # forever (the same trap the python sdk jobs hit).
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      rust: ${{ steps.diff.outputs.rust }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          rust=true
          if [ "$EVENT" = "pull_request" ] &&
             [ -n "$BASE" ] &&
             git fetch --no-tags --depth=1 origin "$BASE"; then
            # docs/docs/ is in the list because the suite compiles the
            # complete programs the documentation shows, so a page can turn
            # the test job red on its own.
            pattern='^(src/|crates/|sdk/rust/|include/|tests/|apps/|fixtures/|docs/docs/|Cargo|rust-toolchain|\.cargo/|\.github/(workflows/ci\.yml|scripts/))'
            if ! git diff --name-only "$BASE" "$HEAD" | grep -Eq "$pattern"; then
              rust=false
            fi
          fi
          echo "rust=$rust" >> "$GITHUB_OUTPUT"
          echo "rust: $rust"

  fmt:
    name: fmt
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # apps/music/*.ogg is the only LFS content in the repo. The audio test
      # fixtures are stored as raw bytes on purpose (.gitattributes), so tests
      # pass without an LFS fetch. Keep lfs off.
      - uses: actions/checkout@v4
        with:
          lfs: false
      - name: Install pinned toolchain
        run: |
          rustup show active-toolchain
          rustc --version
      - run: cargo fmt --all --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - name: Install pinned toolchain
        run: |
          rustup show active-toolchain
          rustc --version
      - name: Install Linux system dependencies
        run: .github/scripts/linux-deps.sh
      - uses: Swatinem/rust-cache@v2
        with:
          key: clippy
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: test (${{ matrix.os }})
    needs: changes
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - if: needs.changes.outputs.rust == 'true'
        uses: actions/checkout@v4
        with:
          lfs: false
      - name: Install pinned toolchain
        if: needs.changes.outputs.rust == 'true'
        run: |
          rustup show active-toolchain
          rustc --version
      - name: Install Linux system dependencies
        if: needs.changes.outputs.rust == 'true' && runner.os == 'Linux'
        run: .github/scripts/linux-deps.sh
      - if: needs.changes.outputs.rust == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          key: test
      - if: needs.changes.outputs.rust == 'true'
        run: cargo build --workspace
      # Runners have no display and no GPU. Every test that needs one probes
      # for an adapter and skips itself, so the suite runs unmodified; on
      # Linux the mesa lavapipe ICD installed above gives wgpu a software
      # Vulkan device, which covers the renderer end to end: device init,
      # scene encode, submit, and framebuffer readback.
      #
      # Two things do not survive a runner and skip themselves with a printed
      # reason rather than failing:
      #
      #   - Framebuffer readback on a software adapter. Direct3D's WARP
      #     rasterizer faults the test process outright when a texture is read
      #     back, so those tests want a real GPU.
      #   - The screenshot goldens. They carry the font set of the machine that
      #     captured them; a runner resolves a different default sans-serif and
      #     every case containing text redraws with different glyphs. Linux and
      #     macOS runners diverge from the baselines by nearly the same amount
      #     on the same cases despite sharing no renderer, which is the font
      #     talking, not the rasterizer. Pinning a font file into the harness
      #     would make them portable; widening the tolerance would only stop
      #     them catching real text regressions.
      #
      # --no-fail-fast so one red target does not hide the rest of the suite.
      # This matrix doubles as the release parity check and a partial report
      # per OS is worth much less than a complete one.
      - if: needs.changes.outputs.rust == 'true'
        run: cargo test --workspace --no-fail-fast

  # The crates the browser runtime shares with the desktop build must keep
  # compiling for the web. A native-only API reintroduced into any of them
  # breaks here, on the pull request that adds it, rather than months later
  # when someone next builds the web target.
  wasm:
    name: wasm
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - if: needs.changes.outputs.rust == 'true'
        uses: actions/checkout@v4
        with:
          lfs: false
      - name: Install pinned toolchain
        if: needs.changes.outputs.rust == 'true'
        run: |
          rustup show active-toolchain
          rustc --version
          rustup target list --installed
      - if: needs.changes.outputs.rust == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          key: wasm
      - if: needs.changes.outputs.rust == 'true'
        run: |
          cargo check --target wasm32-unknown-unknown \
            -p lumen-core \
            -p lumen-ir \
            -p lumen-html \
            -p lumen-portable \
            -p lumen-scene \
            -p lumen-script \
            -p lumen-script-candela \
            -p lumen-web-dom \
            -p lumen-web-http

  # The browser runtime, end to end: build the module a page loads, measure it,
  # and run the suite in a real headless browser. A DOM shim is not an option
  # here - the browser is the layout engine this target is built around, so a
  # fake one would pass on things a page rejects.
  web:
    name: web
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # The size a page pays for the runtime, with room to move above the
      # current measurement. Raising it is a decision, not a fix: it went up
      # once, when the module stopped being a script host alone and gained the
      # scene layer, the DOM backend and the input and widget behaviour the
      # page shares with a desktop app. Trimming what a page does not use is
      # its own piece of work, and this follows the measurement back down when
      # that lands.
      WASM_SIZE_BUDGET_BYTES: 3000000
    steps:
      - if: needs.changes.outputs.rust == 'true'
        uses: actions/checkout@v4
        with:
          lfs: false
      - name: Install pinned toolchain
        if: needs.changes.outputs.rust == 'true'
        run: |
          rustup show active-toolchain
          rustc --version
      # The page test builds the compiler, and the compiler links the desktop
      # libraries a native app needs. The wasm build alone does not.
      - name: Install Linux system dependencies
        if: needs.changes.outputs.rust == 'true'
        run: .github/scripts/linux-deps.sh
      # The command-line tool refuses an artifact built against a different
      # `wasm-bindgen` version, so this pin tracks the workspace dependency.
      - if: needs.changes.outputs.rust == 'true'
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen-cli@0.2.127
      - if: needs.changes.outputs.rust == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          key: web
      # The same recipe a release runs, so the module measured here is the
      # module a site downloads.
      - name: Build the browser runtime
        if: needs.changes.outputs.rust == 'true'
        run: .github/scripts/build-web-runtime.sh web-dist
      - name: Record the module size
        if: needs.changes.outputs.rust == 'true'
        run: |
          set -euo pipefail
          bytes=$(stat -c%s web-dist/lumen-web.wasm)
          gzipped=$(gzip -9 -c web-dist/lumen-web.wasm | wc -c)
          {
            echo "| lumen-web-runtime | bytes |"
            echo "| --- | --- |"
            echo "| wasm | $bytes |"
            echo "| wasm, gzipped | $gzipped |"
            echo "| budget | $WASM_SIZE_BUDGET_BYTES |"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$bytes" -gt "$WASM_SIZE_BUDGET_BYTES" ]; then
            echo "the module is $bytes bytes, over the $WASM_SIZE_BUDGET_BYTES budget" >&2
            exit 1
          fi
      - if: needs.changes.outputs.rust == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: lumen-web-runtime
          path: web-dist/
      # The runner ships Chrome and a matching chromedriver;
      # `wasm-bindgen-test-runner` drives the browser over WebDriver.
      - name: Run the browser suite
        if: needs.changes.outputs.rust == 'true'
        run: |
          set -euo pipefail
          export CHROMEDRIVER="$CHROMEWEBDRIVER/chromedriver"
          cargo test -p lumen-web-runtime --target wasm32-unknown-unknown
          cargo test -p lumen-web-dom --target wasm32-unknown-unknown
          cargo test -p lumen-web-http --target wasm32-unknown-unknown
      # Both halves at once: emit an app with the runtime built above, serve
      # it, and open it in a browser. Neither crate's own tests can see a
      # disagreement between the emitter and the runtime, because neither has
      # the other; this step is where a page that loads to a console error
      # instead of an app stops being indistinguishable from one that works.
      - name: Open an emitted app in a browser
        if: needs.changes.outputs.rust == 'true'
        run: .github/scripts/web-page-smoke.sh web-dist
