name: publish-packages

# Keeps the OS package managers in step with a GitHub release. The manifests
# under tools/release/{aur,homebrew,winget} and the Scoop manifest at
# bucket/lumen.json are rewritten to point at the release that just went out,
# and each one is pushed to the repository that serves it:
#
#   AUR         ssh://aur@aur.archlinux.org/lumen-bin.git
#   Homebrew    lumen-fx/homebrew-lumen, Formula/lumen.rb
#   Scoop       this repository's main, bucket/lumen.json
#   winget      a pull request against microsoft/winget-pkgs, raised by
#               wingetcreate
#
# The Lumen repository is its own Scoop bucket (`scoop bucket add lumen
# https://github.com/lumen-fx/lumen`), so the scoop job commits the rewritten
# manifest straight to main.
#
# Nothing here has to exist for this workflow to be safe to run. Every
# publishing job checks its own precondition first and, when the secret or the
# repository is missing, prints a notice and stops without failing. That is
# what lets the workflow land before any of the accounts below are set up.
#
# What the owner creates, and the secret each one needs:
#
#   AUR_SSH_PRIVATE_KEY   An AUR account (https://aur.archlinux.org) with an
#                         SSH public key registered on it. The secret is the
#                         matching private key, in full, including the header
#                         and footer lines. The first push creates the
#                         lumen-bin package under that account; there is
#                         nothing to create by hand first.
#   AUR_GIT_NAME          Optional. The name and address on the AUR commits.
#   AUR_GIT_EMAIL         They default to a generic Lumen identity.
#
#   HOMEBREW_TAP_TOKEN    A repository lumen-fx/homebrew-lumen, and a token
#                         with write access to it. A fine-grained token scoped
#                         to that one repository with Contents: read and write
#                         is enough.
#
#   REPIN_DEPLOY_KEY      The write deploy key release.yml already pushes the
#                         tag and the version bump with. The scoop job commits
#                         the bucket to main with it and needs nothing else.
#
#   WINGET_TOKEN          A classic token with public_repo scope, belonging to
#                         an account that has forked microsoft/winget-pkgs.
#                         wingetcreate pushes a branch to that fork and opens
#                         the pull request from it. The winget job also needs
#                         the package to exist in winget-pkgs already: submit
#                         tools/release/winget by hand once, as
#                         manifests/l/LumenFX/Lumen/<version>/, and every
#                         release after that is raised automatically. Until
#                         then the job uploads the manifests it prepared and
#                         says so.
#
# A prerelease, a draft, and a release with no sha256sums.txt asset are all
# skipped: the first two are not what a package manager should hand people, and
# the third leaves nothing to write into the manifests. That prerelease check
# reads the release itself, so it holds however this workflow was started, and
# it is the second thing keeping a nightly out of the package managers. The
# first is that nothing brings one here: nightly.yml calls no workflow, and the
# only automatic caller is release.yml, which fires on `v*` tags while the
# nightly publishes onto a tag named `nightly`.
#
# release.yml calls this once the release is published, passing the tag it was
# cut from. Waiting on `release: published` instead would never fire:
# release.yml creates the release with the built-in token, and GitHub raises no
# workflow events for anything that token writes.

on:
  workflow_call:
    inputs:
      tag:
        description: Release tag to publish. Defaults to the newest release.
        required: false
        type: string
  # Manual trigger, for re-publishing a release whose first run failed, or for
  # the first run after a secret is added.
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish. Defaults to the newest release.
        required: false
        type: string

permissions:
  contents: read

# Two releases published close together would otherwise race each other to the
# same package repositories, and the loser would publish the older version.
# Each publishing job takes the lock for the repository it pushes to, rather
# than one lock covering the workflow: a called workflow's jobs join the
# caller's run, so a workflow-level group has no run of its own to gate. The
# group below still covers a run started from the Actions tab.
concurrency:
  group: publish-packages
  cancel-in-progress: false

jobs:
  release:
    name: resolve the release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.pick.outputs.tag }}
      version: ${{ steps.pick.outputs.version }}
      publish: ${{ steps.pick.outputs.publish }}
    steps:
      - name: Pick the release to publish
        id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          tag="$INPUT_TAG"
          if [ -z "$tag" ]; then
            tag="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName -q .tagName)"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

          view="$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" \
            --json isDraft,isPrerelease,assets)"
          if [ "$(echo "$view" | jq -r .isDraft)" = "true" ]; then
            echo "::notice::$tag is a draft; nothing published"
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$(echo "$view" | jq -r .isPrerelease)" = "true" ]; then
            echo "::notice::$tag is a prerelease; package managers get stable releases only"
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! echo "$view" | jq -e '.assets[] | select(.name == "sha256sums.txt")' >/dev/null; then
            echo "::notice::$tag publishes no sha256sums.txt; there are no checksums to write into the manifests"
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "publish=true" >> "$GITHUB_OUTPUT"
          echo "publishing $tag"

  prepare:
    name: rewrite the manifests
    needs: release
    if: needs.release.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      - name: Point the manifests at ${{ needs.release.outputs.tag }}
        run: tools/release/update-package-manifests.sh "${{ needs.release.outputs.version }}"

      # The AUR reads .SRCINFO rather than the PKGBUILD, and only makepkg
      # writes it. makepkg refuses to run as root, so the container copies the
      # directory out of the read-only mount and works on it as an ordinary
      # user.
      - name: Generate .SRCINFO
        run: |
          docker run --rm -v "$PWD/tools/release/aur:/pkg:ro" archlinux:base-devel sh -c '
            useradd -m build
            cp -r /pkg /tmp/pkg
            chown -R build /tmp/pkg
            cd /tmp/pkg && su build -c "makepkg --printsrcinfo"
          ' > tools/release/aur/.SRCINFO
          cat tools/release/aur/.SRCINFO

      # The Scoop manifest is not in the artifact: the scoop job rewrites it
      # on main itself. Adding it would also move the artifact's root from
      # tools/release up to the repository root (upload-artifact roots it at
      # the paths' common ancestor), and the jobs below read manifests/aur/
      # and manifests/homebrew/.
      - uses: actions/upload-artifact@v4
        with:
          name: package-manifests
          path: |
            tools/release/aur/PKGBUILD
            tools/release/aur/.SRCINFO
            tools/release/homebrew/lumen.rb
            tools/release/winget/
          # .SRCINFO is a dotfile, and this action drops those unless told not
          # to. Without this the AUR job would push a package with no metadata.
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  aur:
    name: aur
    needs: [release, prepare]
    if: needs.release.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: publish-packages-aur
      cancel-in-progress: false
    steps:
      - name: Check the AUR key is set
        id: gate
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          if [ -z "$AUR_SSH_PRIVATE_KEY" ]; then
            echo "::notice::AUR_SSH_PRIVATE_KEY is not set; the AUR package was not updated"
            echo "ok=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "ok=true" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        if: steps.gate.outputs.ok == 'true'
        with:
          name: package-manifests
          path: manifests

      - name: Push lumen-bin ${{ needs.release.outputs.version }}
        if: steps.gate.outputs.ok == 'true'
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          AUR_GIT_NAME: ${{ secrets.AUR_GIT_NAME }}
          AUR_GIT_EMAIL: ${{ secrets.AUR_GIT_EMAIL }}
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$AUR_SSH_PRIVATE_KEY" > ~/.ssh/aur
          chmod 600 ~/.ssh/aur
          # The AUR publishes no long-lived key fingerprint to pin against, so
          # the host key is taken on first contact, as every AUR client does.
          ssh-keyscan aur.archlinux.org >> ~/.ssh/known_hosts 2>/dev/null
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/aur -o IdentitiesOnly=yes"

          git clone ssh://aur@aur.archlinux.org/lumen-bin.git aur
          cp manifests/aur/PKGBUILD manifests/aur/.SRCINFO aur/
          cd aur
          git config user.name "${AUR_GIT_NAME:-Lumen FX}"
          git config user.email "${AUR_GIT_EMAIL:-releases@lumenfx.dev}"
          git add PKGBUILD .SRCINFO
          if git diff --cached --quiet; then
            echo "::notice::the AUR already carries $VERSION"
            exit 0
          fi
          git commit -m "lumen-bin $VERSION"
          git push origin HEAD:master

  homebrew:
    name: homebrew
    needs: [release, prepare]
    if: needs.release.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: publish-packages-homebrew
      cancel-in-progress: false
    steps:
      - name: Check the tap is reachable
        id: gate
        env:
          TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::notice::HOMEBREW_TAP_TOKEN is not set; the tap was not updated"
            echo "ok=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! git ls-remote "https://x-access-token:$TOKEN@github.com/lumen-fx/homebrew-lumen.git" >/dev/null 2>&1; then
            echo "::notice::lumen-fx/homebrew-lumen is not reachable with HOMEBREW_TAP_TOKEN; the tap was not updated"
            echo "ok=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "ok=true" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        if: steps.gate.outputs.ok == 'true'
        with:
          name: package-manifests
          path: manifests

      - name: Push lumen ${{ needs.release.outputs.version }} to the tap
        if: steps.gate.outputs.ok == 'true'
        env:
          TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          git clone "https://x-access-token:$TOKEN@github.com/lumen-fx/homebrew-lumen.git" tap
          mkdir -p tap/Formula
          cp manifests/homebrew/lumen.rb tap/Formula/lumen.rb
          cd tap
          git config user.name "lumenfx-bot[bot]"
          git config user.email "346573052+lumenfx-bot[bot]@users.noreply.github.com"
          git add Formula/lumen.rb
          if git diff --cached --quiet; then
            echo "::notice::the tap already carries $VERSION"
            exit 0
          fi
          git commit -m "lumen $VERSION"
          git push

  # The bucket is this repository, so the Scoop manifest lands on main rather
  # than in a repository of its own. The commit is a function of the release's
  # sha256sums.txt and nothing else, which is what lets a job push it to main
  # directly; it goes over SSH with the deploy key for the reasons release.yml's
  # bump job gives.
  #
  # The manifest is rewritten on main, not taken from the prepare job's
  # artifact: that copy started from the tagged tree, and anything merged into
  # bucket/lumen.json after the tag would be reverted by copying it over.
  #
  # release.yml's bump job pushes to main at about the same time. The two
  # touch different files, so neither has to know about the other: each
  # attempt here reads main, rewrites the manifest against that exact commit,
  # and pushes it as a fast-forward, and a refused push is answered by reading
  # main again. The bump does the same on its side.
  #
  # A re-run, or a run for an older release after a newer one went out, finds
  # main's bucket at or past the version it was asked for and stops, so the
  # bucket never walks backwards.
  scoop:
    name: scoop
    needs: [release, prepare]
    if: needs.release.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: publish-packages-scoop
      cancel-in-progress: false
    steps:
      - name: Check the deploy key is set
        id: gate
        env:
          DEPLOY_KEY: ${{ secrets.REPIN_DEPLOY_KEY }}
        run: |
          if [ -z "$DEPLOY_KEY" ]; then
            echo "::notice::REPIN_DEPLOY_KEY is not set; the bucket on main was not updated"
            echo "ok=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "ok=true" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.gate.outputs.ok == 'true'
        with:
          ref: main
          lfs: false

      - name: Commit lumen ${{ needs.release.outputs.version }} to the bucket on main
        if: steps.gate.outputs.ok == 'true'
        env:
          DEPLOY_KEY: ${{ secrets.REPIN_DEPLOY_KEY }}
          VERSION: ${{ needs.release.outputs.version }}
          TAG: ${{ needs.release.outputs.tag }}
        run: |
          set -euo pipefail

          sums="$(mktemp)"
          key_file="$(mktemp)"
          trap 'rm -f "${sums}" "${key_file}"' EXIT
          curl -fsSL --retry 3 --retry-all-errors --retry-delay 2 -o "${sums}" \
            "https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/sha256sums.txt"

          printf '%s\n' "${DEPLOY_KEY}" > "${key_file}"
          export GIT_SSH_COMMAND="ssh -i ${key_file} -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
          git config user.name "lumenfx-bot[bot]"
          git config user.email "346573052+lumenfx-bot[bot]@users.noreply.github.com"

          for attempt in 1 2 3; do
            git fetch --quiet origin main
            git reset --quiet --hard FETCH_HEAD

            current="$(sed -n 's/^ *"version": "\([^"]*\)".*/\1/p' bucket/lumen.json | head -n 1)"
            if [ "${current}" = "${VERSION}" ]; then
              echo "::notice::the bucket on main already carries ${VERSION}"
              exit 0
            fi
            oldest="$(printf '%s\n%s\n' "${current}" "${VERSION}" | sort -V | head -n 1)"
            if [ "${oldest}" = "${VERSION}" ]; then
              echo "::notice::the bucket on main carries ${current}, newer than ${VERSION}; left alone"
              exit 0
            fi

            # The script rewrites every manifest; only the bucket is committed.
            tools/release/update-package-manifests.sh "${VERSION}" "${sums}"
            git add bucket/lumen.json
            git commit -qm "chore: point the Scoop bucket at ${TAG}"

            if git push "git@github.com:${GITHUB_REPOSITORY}.git" HEAD:main; then
              echo "::notice::the bucket on main carries ${VERSION} at $(git rev-parse --short HEAD)"
              exit 0
            fi
            echo "::notice::attempt ${attempt} to push the bucket to main was refused; reading main again"
          done

          echo "publish-packages.yml: the bucket could not be pushed to main. Either the deploy" >&2
          echo "key no longer bypasses the ruleset, or main is moving faster than this can" >&2
          echo "follow. Run this workflow again for ${TAG}." >&2
          exit 1

  winget:
    name: winget
    needs: [release, prepare]
    if: needs.release.outputs.publish == 'true'
    runs-on: windows-latest
    timeout-minutes: 20
    concurrency:
      group: publish-packages-winget
      cancel-in-progress: false
    steps:
      - name: Check the token and the existing package
        id: gate
        shell: pwsh
        env:
          TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: |
          if (-not $env:TOKEN) {
            Write-Output "::notice::WINGET_TOKEN is not set; no winget pull request was raised"
            "ok=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            exit 0
          }
          $url = "https://api.github.com/repos/microsoft/winget-pkgs/contents/manifests/l/LumenFX/Lumen"
          try {
            # The token is only here to lift the anonymous rate limit, which is
            # shared by everything on the runner's address.
            Invoke-WebRequest -Uri $url -UseBasicParsing -ErrorAction Stop `
              -Headers @{ Authorization = "Bearer $env:TOKEN" } | Out-Null
          } catch {
            Write-Output "::notice::LumenFX.Lumen is not in winget-pkgs yet; submit tools/release/winget by hand once (it is on this run as the package-manifests artifact)"
            "ok=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            exit 0
          }
          "ok=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      # wingetcreate reads the installer itself, so it fills in the version,
      # the checksum, and the product code WiX generated for this build. The
      # manifests in the repository are the record of what a release looks
      # like and the set the first submission is made from; they are not what
      # this step uploads.
      - name: Raise the winget pull request
        if: steps.gate.outputs.ok == 'true'
        shell: pwsh
        env:
          TOKEN: ${{ secrets.WINGET_TOKEN }}
          VERSION: ${{ needs.release.outputs.version }}
          TAG: ${{ needs.release.outputs.tag }}
        run: |
          Invoke-WebRequest -Uri https://aka.ms/wingetcreate/latest -OutFile wingetcreate.exe
          # Both installers, so wingetcreate rewrites the arm64 entry too; it
          # reads the architecture out of each package rather than being told.
          $base = "https://github.com/lumen-fx/lumen/releases/download/$env:TAG"
          .\wingetcreate.exe update LumenFX.Lumen `
            --version $env:VERSION `
            --urls "$base/lumen-windows-x86_64.msi" "$base/lumen-windows-aarch64.msi" `
            --submit `
            --token $env:TOKEN
          if ($LASTEXITCODE -ne 0) {
            throw "wingetcreate exited with $LASTEXITCODE"
          }
