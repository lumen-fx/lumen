pluginGroup = dev.lumenfx.lumen
pluginName = Lumen UI
pluginVersion = 0.1.0

# The plugin loads in any IntelliJ-based IDE from 2024.2 on, which is also the
# floor LSP4IJ supports.
pluginSinceBuild = 242

# The IDE the plugin compiles and runs against. It is the oldest supported
# release, so the plugin cannot pick up an API that the floor lacks.
platformType = IC
platformVersion = 2024.2.5

# Red Hat's LSP client, from the JetBrains Marketplace.
lsp4ijVersion = 0.20.1

org.gradle.jvmargs = -Xmx2g
org.gradle.caching = true
org.gradle.configuration-cache = true
kotlin.stdlib.default.dependency = false
