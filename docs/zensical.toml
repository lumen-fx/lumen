# Zensical configuration for the Lumen documentation.
#
# Build a static site into `site/`:
#
#   uv run zensical build --strict
#
# The theme block mirrors the Candela docs so both doc sets look the same when
# they are combined at docs.lumenfx.dev.

[project]

site_name = "Lumen Docs"
site_description = "Documentation for Lumen, a markup-first UI framework for native desktop apps."
site_author = "Lumen FX"
site_url = "https://docs.lumenfx.dev"

repo_url = "https://github.com/lumen-fx/lumen"
repo_name = "lumen-fx/lumen"
edit_uri = "edit/main/docs/docs/"

copyright = """
Copyright &copy; 2026 Lumen FX &middot; Lumen is MPL-2.0 licensed
"""

nav = [
  {"Introduction" = "index.md"},
  {"Getting started" = [
     "getting-started/install.md",
     "getting-started/first-app.md",
     "getting-started/project-layout.md",
     "getting-started/templates.md",
  ]},
  {"Authoring" = [
     "authoring/tags.md",
     "authoring/css.md",
     "authoring/rhai-builtins.md",
     "authoring/templates.md",
     "authoring/animations.md",
     "authoring/lumen-toml.md",
  ]},
  {"Reference" = [
     "reference/devtools.md",
     "reference/headless.md",
     "reference/plugins.md",
     "reference/ffi.md",
  ]},
  {"Candela language" = "/candela/"},
]

# ----------------------------------------------------------------------------
# Theme
# ----------------------------------------------------------------------------
[project.theme]

language = "en"

features = [
    "announce.dismiss",
    "content.action.edit",
    "content.action.view",
    "content.code.annotate",
    "content.code.copy",
    "content.code.select",
    "content.footnote.tooltips",
    "content.tabs.link",
    "content.tooltips",
    "navigation.footer",
    "navigation.indexes",
    "navigation.instant",
    "navigation.instant.prefetch",
    "navigation.path",
    "navigation.sections",
    "navigation.top",
    "navigation.tracking",
    "search.highlight",
]

[project.theme.icon]
repo = "fontawesome/brands/github"

[[project.theme.palette]]
accent = "blue"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
accent = "blue"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

# ----------------------------------------------------------------------------
# Extra
# ----------------------------------------------------------------------------
[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/lumen-fx/lumen"

# ----------------------------------------------------------------------------
# Markdown extensions
# ----------------------------------------------------------------------------
[project.markdown_extensions.abbr]
[project.markdown_extensions.admonition]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.def_list]
[project.markdown_extensions.footnotes]
[project.markdown_extensions.md_in_html]
[project.markdown_extensions.toc]
permalink = true
[project.markdown_extensions.pymdownx.betterem]
[project.markdown_extensions.pymdownx.caret]
[project.markdown_extensions.pymdownx.details]
[project.markdown_extensions.pymdownx.emoji]
emoji_generator = "zensical.extensions.emoji.to_svg"
emoji_index = "zensical.extensions.emoji.twemoji"
[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
line_spans = "__span"
pygments_lang_class = true
[project.markdown_extensions.pymdownx.inlinehilite]
[project.markdown_extensions.pymdownx.keys]
[project.markdown_extensions.pymdownx.magiclink]
[project.markdown_extensions.pymdownx.mark]
[project.markdown_extensions.pymdownx.smartsymbols]
[project.markdown_extensions.pymdownx.superfences]
custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" }
]
[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true
combine_header_slug = true
[project.markdown_extensions.pymdownx.tasklist]
custom_checkbox = true
[project.markdown_extensions.pymdownx.tilde]
[project.markdown_extensions.zensical.extensions.glightbox]
auto = true
[project.markdown_extensions.zensical.extensions.preview]
configurations = [
    { targets.include = [
        "*.md"
    ]}
]
