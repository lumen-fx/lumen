# cargo-about accepted-license allowlist for the Lumen workspace.
# Copied from the candela repo and expanded for Lumen's larger native
# stack (wgpu / vello / winit / cosmic-text / taffy / bevy_ecs), which
# pulls BSD/MPL/Zlib/Unicode-family licenses candela does not.
# Run `cargo about generate about.hbs > third-party-licenses.html` to
# surface any license still missing from this list.
