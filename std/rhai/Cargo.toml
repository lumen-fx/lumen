# The Rhai script host, as a runtime module. Deprecated: candela is the
# supported language, and this host gets no new builtins. An app runs a
# `.rhai` script on it like any other first-party module: compiled into the dev
# `lumenc`, opened from the modules archive on Linux and macOS, and linked into
# a Windows app's `lumen.dll` by its engine kit.
[package]
name = "lumen-rhai"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Lumen's Rhai script host, as a runtime module. Deprecated in favour of candela."
keywords = ["ui", "gui", "scripting", "rhai", "lumen"]
categories = ["gui"]
# Not published: `lumenc` and `lumenui` are the only crates.io packages.
publish = false

[package.metadata.lumen]
# Where this module is compiled in: the dev toolchain (`lumenc`, and through
# it the Windows `lumen.dll`, whose engine kit links it into an app that runs
# this language). The static launcher and its link kit leave it out: a
# deprecated host is not carried by every static package. See
# .github/scripts/first-party-modules.sh.
link = "toolchain"

[lib]
name = "lumen_rhai"
crate-type = ["lib", "cdylib"]

[dependencies]
lumen-module = { workspace = true }
lumen-scene = { workspace = true }
# `json` and `markdown` pull in the shared `parse_json` / `parse_markdown`
# walk (and, with it, serde_json / pulldown-cmark) through the builtin table.
lumen-script = { workspace = true, features = ["json", "markdown"] }
lumen-core = { workspace = true }
bevy_ecs.workspace = true
rhai.workspace = true
# T5.3: non-poisoning, faster-on-uncontested, smaller-sizeof Mutex.
# Already pulled transitively by taffy + winit; we just opt in directly.
parking_lot = "0.12"
tracing.workspace = true

[features]
default = ["engine-dylib"]
# The shared engine, and the probe-and-install pair a loader looks up after
# opening this crate's `cdylib`.
engine-dylib = ["lumen-module/engine-dylib"]
