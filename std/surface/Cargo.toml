# Shows frames another renderer draws on the GPU (a game, a video decoder, an
# engine in another process or this one) in a `<surface>` element, with no
# copy. A self-contained runtime module: the engine knows nothing about
# surfaces. It adopts its element through the generic tag registry, paints
# through the native-paint seam and the render backend's texture seam,
# registers the `surface` script namespace through the generic
# `ScriptFnRegistry`, and raises its events through the custom-event seam.
# The cdylib is the bundled `lumen-surface` module an app declares in
# `lumen.toml`; the lib is the same plugin compiled into a static build.
[package]
name = "lumen-surface"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Lumen's surface module: a <surface> element showing another renderer's GPU frames in place, fed over the Lumen surface protocol or from in-process code."
keywords = ["ui", "gui", "gpu", "game-engine", "viewport"]
categories = ["graphics", "gui", "game-development"]
publish = false

[lib]
# `lumen_surface` is the spelling the module loader's bundled probe derives
# from `lumen-surface = { bundled = true }`: the cdylib builds to
# `liblumen_surface.so`.
name = "lumen_surface"
crate-type = ["lib", "cdylib"]

[dependencies]
# The engine-facing dependency. `paint` brings lumen-paint, through which the
# element draws its texture; `gpu` brings the render backend's device and
# texture table, and the wgpu the backend draws with.
lumen-module = { workspace = true, features = ["paint", "gpu"] }
# The wire format, the endpoint string and the transport.
lumen-surface-protocol = { workspace = true }
glam = { workspace = true }
# Named directly for `#[derive(Component)]` / `#[derive(Resource)]`, whose
# expansion spells the crate by name; the types arrive through the SDK.
bevy_ecs = { workspace = true }

# The Vulkan importer: the raw image and memory calls wgpu has no API for.
# The same ash release wgpu-hal uses, so the handles wgpu hands out are
# this crate's types.
[target.'cfg(target_os = "linux")'.dependencies]
ash = "0.38"
libc = { workspace = true }

[features]
default = ["engine-dylib"]
# The shared engine, and the probe-and-install pair a loader looks up after
# opening this crate's `cdylib`. On by default, which is the shipping shape.
engine-dylib = ["lumen-module/engine-dylib"]

[dev-dependencies]
# Reads the Vulkan validation layer's reports, which wgpu logs.
log = "0.4"
lumen-core = { workspace = true }
lumen-render-wgpu = { workspace = true }
lumen-render-cpu = { workspace = true }
lumen-runtime = { workspace = true }
lumen-script = { workspace = true }
lumen-candela-dev = { workspace = true }
lumen-text = { workspace = true }
lumen-text-cosmic = { workspace = true }
