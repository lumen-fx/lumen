# Docks and windows for a Lumen app: tab stacks, resizable splits and panels
# the user shows, hides, collapses, maximizes, pops out into windows of their
# own and docks back, with the arrangement saved and restored. A
# self-contained runtime module: the engine knows nothing about docks. It
# adopts its elements through the generic tag registry, builds its stacks and
# splits out of the core <tabs> and <split>, opens windows through the core
# window entities, registers the `dock` script namespace through the generic
# `ScriptFnRegistry`, raises its events through the custom-event seam, and
# ships its look as a user-agent stylesheet. The cdylib is the bundled
# `lumen-dock` module an app declares in `lumen.toml`; the lib is the same
# plugin compiled into a static build.
[package]
name = "lumen-dock"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Lumen's dock module: tab stacks, splits and panels that pop out into windows of their own and dock back, with saved layouts."
keywords = ["ui", "gui", "docking", "windows", "layout"]
categories = ["gui"]
publish = false

[lib]
# `lumen_dock` is the spelling the module loader's bundled probe derives
# from `lumen-dock = { bundled = true }`: the cdylib builds to
# `liblumen_dock.so`.
name = "lumen_dock"
crate-type = ["lib", "cdylib"]

[dependencies]
# The one engine-facing dependency.
lumen-module = { workspace = true }
# The workspace model and the saved layout format.
lumen-dock-model = { workspace = true }
glam = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# The module's `config` table arrives as TOML.
toml = { workspace = true }
# Named directly for `#[derive(Component)]` / `#[derive(Resource)]`, whose
# expansion spells the crate by name; the types arrive through the SDK.
bevy_ecs = { workspace = true }

[features]
default = ["engine-dylib"]
# The shared engine, and the probe-and-install pair a loader looks up after
# opening this crate's `cdylib`. On by default, which is the shipping shape.
engine-dylib = ["lumen-module/engine-dylib"]

[dev-dependencies]
lumen-core = { workspace = true }
lumen-ir = { workspace = true }
lumen-runtime = { workspace = true }
lumen-script = { workspace = true }
lumen-candela-dev = { workspace = true }
