# The web half of the dock module. A page shows the dock's default layout as
# it was written: the splits as rows and columns at their declared sizes and
# each stack's panels behind a strip of tabs a visitor switches between. The
# rearranging calls (moving, popping out, saving) need the runtime to move the
# panels, which a page does not do yet, so on a page they report that and
# change nothing. The desktop half in src/ takes its function signatures from
# this file, so a script sees the same names on every target.
[addon]
namespace = "dock"
module = "dock.js"
styles = ["dock.css"]

[[function]]
name = "show"
params = ["panel: string"]
returns = "bool"
doc = "Bring the panel into view where it was hidden from, else where its place attribute puts it, and make it its stack's showing tab. A panel declared outside any dock, or one that does not dock, opens in a window of its own. False when no panel has the id."

[[function]]
name = "hide"
params = ["panel: string"]
returns = "bool"
doc = "Take the panel out of view, remembering where it was so show puts it back there. Its content stays mounted. False when it is not shown."

[[function]]
name = "toggle"
params = ["panel: string"]
returns = "bool"
doc = "Hide the panel if it is shown, show it if it is not: what a Window menu item calls. True when it is shown afterwards."

[[function]]
name = "focus"
params = ["panel: string"]
returns = "bool"
doc = "Show the panel and move keyboard focus into it: to the element last focused there, else its first focusable element, else its tab. Raises its window."

[[function]]
name = "activate"
params = ["panel: string"]
returns = "bool"
doc = "Make the panel its stack's showing tab. False when it is not shown."

[[function]]
name = "close"
params = ["panel: string"]
returns = "bool"
doc = "Close the panel as its close button does, without asking: it is hidden, or removed from the document when it has destroy-on-close."

[[function]]
name = "move"
params = ["panel: string", "target: string", "zone: string"]
returns = "bool"
doc = "Move the panel beside another panel or into a dock. target is a panel id or a dock id; zone is tab (into the target's stack, or the dock's center) or left, right, top, bottom (a new stack on that side of the target's stack, or along that edge of the dock)."

[[function]]
name = "detach"
params = ["panel: string"]
returns = "bool"
doc = "Pop the panel out into a window of its own, over the place it has on screen now. The panel keeps its content and its state."

[[function]]
name = "detach_group"
params = ["panel: string"]
returns = "bool"
doc = "Pop the whole stack holding the panel out into a window of its own."

[[function]]
name = "attach"
params = ["panel: string"]
returns = "bool"
doc = "Dock the panel back from its window to the place it came from. False when it is not in a window, or does not dock."

[[function]]
name = "window_of"
params = ["panel: string"]
returns = "int"
doc = "The window the panel is in: 0 for the main window, the number dock::windows lists for a window of its own, -1 when it is not shown."

[[function]]
name = "windows"
returns = "int[]"
doc = "The windows of their own panels are in, by number."

[[function]]
name = "collapse"
params = ["panel: string", "collapsed: bool"]
returns = "bool"
doc = "Collapse the stack holding the panel to its header, or expand it."

[[function]]
name = "maximize"
params = ["panel: string"]
returns = "bool"
doc = "Fill the panel's dock with its stack, showing the panel, until dock::restore_maximized or Escape. False when the panel is not in a dock."

[[function]]
name = "restore_maximized"
params = ["dock: string"]
returns = "bool"
doc = "Give the dock its whole layout back. False when nothing in it was maximized."

[[function]]
name = "panels"
returns = "string[]"
doc = "Every panel id the module knows, shown or not."

[[function]]
name = "is_shown"
params = ["panel: string"]
returns = "bool"
doc = "Whether the panel is in view: in a dock or in a window of its own."

[[function]]
name = "save"
returns = "string"
doc = "The whole arrangement as JSON: every dock, the windows of their own with their places, and where each hidden panel goes back to. Hand it to dock::restore later, in this run or another."

[[function]]
name = "restore"
params = ["layout: string"]
returns = "bool"
doc = "Arrange everything as a string from dock::save says. False, and a layouterror event, when it is not a layout this app can use: another format, another layout-version, or broken."

[[function]]
name = "layouts"
returns = "string[]"
doc = "The named layouts: the ones the markup declares with dock-layout, and the user's own."

[[function]]
name = "save_layout"
params = ["name: string"]
returns = "bool"
doc = "Keep the arrangement as it is now as a named layout. A name the markup also declares shadows that layout until it is deleted."

[[function]]
name = "apply_layout"
params = ["name: string"]
returns = "bool"
doc = "Arrange everything as the named layout says. Panels it does not name keep the place the markup gives them. False when no layout has the name."

[[function]]
name = "delete_layout"
params = ["name: string"]
returns = "bool"
doc = "Delete a layout the user saved. False when the user saved none by that name."

[[function]]
name = "reset"
returns = "bool"
doc = "Go back to the named layout the arrangement came from, or to the layout the markup declares."

[[function]]
name = "forget"
params = ["panel: string"]
returns = "bool"
doc = "Drop everything remembered about a panel: its place, its home, and what a restore would ask the app to recreate."

[[element]]
tag = "dock"
html = "div"
note = "a page shows a dock's default layout and switches its tabs; moving, popping out and saving panels work on the desktop only for now"
# A dock inside another dock's panel is not supported yet.
not-inside = ["dock"]

[[element]]
tag = "dock-split"
html = "div"

[[element]]
tag = "dock-stack"
html = "div"

[[element]]
tag = "dock-panel"
html = "section"

[[element]]
tag = "dock-layout"
html = "template"

[[element]]
tag = "dock-ref"
html = "span"

[[element]]
tag = "dock-window"
html = "div"
