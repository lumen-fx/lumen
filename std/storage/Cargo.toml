# The `storage` module: text values under text keys, kept for the app from
# one run to the next, plus a set that lasts one run. Its web half in web/ is
# the browser's local and session storage; this crate is its desktop half, a
# JSON file in the app's data directory holding the same surface. Two link
# shapes from one crate, like every std module: the `cdylib` target is the
# bundled `lumen-storage` module an app declares in `lumen.toml`, and the `lib`
# target is the same plugin compiled into a static build.
[package]
name = "lumen-storage"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Lumen's storage module: key/value text storage that lasts across runs, as the browser's local storage in a web build and a JSON file in the app's data directory on the desktop."
keywords = ["ui", "gui", "storage", "persistence", "scripting"]
categories = ["gui", "database"]
publish = false

[lib]
# `lumen_storage` is the spelling the module loader's bundled probe derives
# from the app's `lumen-storage = { bundled = true }` declaration: the cdylib
# builds to `liblumen_storage.so`.
name = "lumen_storage"
crate-type = ["lib", "cdylib"]

[dependencies]
lumen-module = { workspace = true }
# The file's format: one JSON object of strings.
serde_json = { workspace = true }

[features]
default = ["engine-dylib"]
# The shared engine, and the probe-and-install pair a loader looks up after
# opening this crate's `cdylib`. On by default, which is the shipping shape.
# A binary that links the `lib` target in drops the feature and links no
# engine dylib; what the module registers before `main` is unaffected.
engine-dylib = ["lumen-module/engine-dylib"]

# Tests only: the compiled-in-shape tests build a headless app around the
# plugin the way `lumenc run` would.
[dev-dependencies]
lumen-core = { workspace = true }
lumen-ir = { workspace = true }
lumen-runtime = { workspace = true }
