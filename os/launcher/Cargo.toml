[package]
name = "lumen-os-launcher"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "URL / file launcher for Lumen (opener wrapper). QDesktopServices::openUrl / gtk_show_uri analog."
keywords = ["ui", "gui", "open", "url", "lumen"]
categories = ["os", "gui"]
# Not published: `lumenc` and `lumenui` are the only crates.io packages.
publish = false

[dependencies]
# The optional-subsystem entry this crate registers itself through.
lumen-capability = { workspace = true }
# The command stream the scripts' builtins write, which the entry applies.
lumen-script = { workspace = true }
lumen-core = { workspace = true }
bevy_ecs.workspace = true

# Cross-platform URL / path launcher. Wraps the platform helpers
# (`xdg-open`, `start`, `open`) plus a fallback to `webbrowser`.
opener.workspace = true
