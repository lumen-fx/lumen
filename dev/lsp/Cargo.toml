[package]
name = "lumen-lsp"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "tower-lsp server for .lmn markup, Lumen CSS, and Rhai sources."
keywords = ["ui", "gui", "lsp", "editor", "lumen"]
categories = ["development-tools", "gui"]
# Editor tooling ships with the toolchain, not from crates.io: the name
# `lumen-lsp` there belongs to an unrelated project, and an LSP server is
# something an editor extension installs, not something a crate depends on.
publish = false

[lib]
name = "lumen_lsp"
path = "src/lib.rs"

[[bin]]
name = "lumen-lsp"
path = "src/main.rs"

[dependencies]
# Link the thin compiler library only: `runtime-parse` gives us the markup /
# CSS front-end (`parse_html`, `formatter`, `FsLoader`) the LSP needs; dropping
# the default `dev-run` feature keeps the runtime and every heavy backend
# (wgpu / winit / vello / cosmic-text / taffy / rodio / mlua) out of the LSP.
lumenc = { workspace = true, features = ["runtime-parse"] }
# Source of truth for the Rhai builtins table + a fully-registered
# engine to compile `.rhai` buffers against. Optional: only a `lang-rhai`
# build analyses `.rhai` buffers (see [features]).
lumen-script-rhai = { workspace = true, default-features = true, optional = true }
rhai = { workspace = true, optional = true }
tower-lsp.workspace = true
tokio = { version = "1.52", features = ["rt-multi-thread", "io-util", "io-std", "macros", "sync"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[features]
default = ["lang-rhai"]
# Rhai script intelligence: compile-error diagnostics, builtin completion,
# hover, and signature help for `.rhai` buffers, which need the Rhai engine
# and the host's builtin table. Everything the server does for markup, CSS,
# and the cross-file id features is script-language-neutral and stays.
lang-rhai = ["dep:lumen-script-rhai", "dep:rhai"]
