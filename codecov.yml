# Coverage gates on the change, not the whole tree: the project status is
# informational, while the patch status is a required check and fails when
# less than 80 percent of the diff's new lines are covered.
#
# The target is a fixed number rather than `auto`. An auto target is main's
# own coverage at the time of the run, so it moves, and a pull request is
# graded against one base while the merge queue grades the same diff against
# another. A change could pass on the pull request, fail on the queue commit,
# and get ejected every time it was requeued.

coverage:
  status:
    project:
      default:
        informational: true
    patch:
      default:
        target: "80%"

# Nothing is excluded from the report. Code a CI runner cannot execute -
# the device-bound half of the wgpu surface, the wasm32-only browser crates
# - grades at the number the suite actually reaches. The fixture cdylibs
# and the helpers that build them are instrumented by their nested builds
# and grade like everything else.
