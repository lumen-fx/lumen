# Coverage gates on the change, not the whole tree: the project status is
# informational, while the patch status is a required check and fails when
# the diff's new lines are meaningfully less covered than the baseline.

coverage:
  status:
    project:
      default:
        informational: true
    patch:
      default:
        target: auto
        threshold: "5%"

# Measured and tested, but not graded. Presenting to a window needs a real
# adapter, a real swap chain, and a window to own them, none of which a CI
# runner has; the GPU tests that do exist skip themselves there anyway,
# since all it offers is a software rasterizer. The device-bound half of
# this file therefore reads as uncovered whatever the suite does. Codecov
# excludes whole paths only, so the file goes with it. The parts that need
# no device (the present gate, the damage diff, the init watchdog) are
# still tested and still run under `cargo test`.
#
# The browser crates are the same case for a different reason: they call the
# DOM, so they run on wasm32 and nowhere else, while coverage is measured on
# the host. What drives them is a suite in a real browser and a test that
# opens an emitted page, both in the web job, on a target llvm-cov does not
# instrument here. Reading them as uncovered says nothing about whether they
# are tested. Everything they are built on stays graded: the scene layer, the
# emitter, the contract types, and the host-neutral scripting layer are all
# ordinary crates that run under `cargo test`.
ignore:
  - "crates/backends/render-wgpu/src/surface.rs"
  - "crates/backends/web-dom"
  - "crates/web-runtime"
