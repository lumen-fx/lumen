# The engine crate lives at the workspace root: `src/` builds `liblumen`, the
# shared library every app executable, launcher stub, and SDK loads. Internal
# crates sit under `crates/`, grouped by the role it plays; the author-facing
# crates external code depends on (the compiler, the plugin and module SDKs,
# the engine carrier) sit under `public/`; first-party runtime modules under
# `std/`; app SDKs under `sdk/`.
[package]
name = "lumen"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Lumen C-ABI: opaque LumenApp + tagged LumenValue, drives lumenc::run_app from any C-callable language."
# The engine ships as a shared library through the toolchain installer, not as
# a crates.io package: the `lumen` name there belongs to an unrelated project.
# The Rust-facing package is `lumenui` (sdk/rust), which depends on this crate
# and re-exports it; the C-facing one is the installed liblumen.
publish = false

[lib]
# The file name of the shared library is the seam: `lumenc`, the launcher
# stub, and the C++/Python SDKs all look for `liblumen.{so,dylib}` /
# `lumen.dll`. Renaming this renames all of them.
name = "lumen"
# `cdylib` is the C seam: it exports the `extern "C"` surface and nothing else,
# which is what the launcher and the C++ and Python SDKs open. The Rust SDK
# needs a library carrying Rust metadata instead, and that is a second crate
# type on one target, which cargo does not allow - so it lives in its own
# crate, `public/lumen-dylib`. See the note there for why it is not a member
# of this workspace.
crate-type = ["lib", "cdylib", "staticlib"]

[dependencies]
lumen-core = { workspace = true }
# Runtime core: `RunOptions` / `run_app` / the default plugin stack. The
# workspace entry takes it without defaults, so the full shared library turns
# every subsystem on through this crate's own default feature set below, while a
# trimmed static `--bundle` build (`--no-default-features --features "<caps>"`)
# selects exactly the app's subsystems (Part B).
lumen-runtime = { workspace = true }
# Host-neutral DOM read side (query / traversal over the snapshot) for the
# LumenNode C-ABI. No host features needed here; the query engine is
# host-independent.
lumen-script = { workspace = true }
# Compiler front-end, kept only to inject its parser (`default_parser()`).
# OPTIONAL behind the default-on `embed-parser` feature: a static `--bundle`
# runs a prebuilt LMNA artifact with NO parser, so dropping lumenc also drops
# the feature-unification that would otherwise pull lumen-runtime back to full.
lumenc = { workspace = true, default-features = true, optional = true }
# Widget trait, `Attributes`, and the `#[derive(Widget)]` macro. Not used by
# the C ABI itself; carried so the Rust SDK reaches them through this one
# library rather than compiling a second copy beside it (see the `sdk`
# re-export module in src/lib.rs).
lumen-widget = { workspace = true }
lumen-widget-macros = { workspace = true }
# Same reason: the Rust SDK's `AppBuilder::rhai_extension` takes a
# `rhai::Engine`, so the type has to come from here to be the same type.
# Follows the `host-rhai` feature, which is what compiles that host at all.
rhai = { workspace = true, optional = true }
# Close-hook router (ABI 0.5): the `lumen_app_on_close` dispatch system
# reads `Messages<CloseRequest>` through a `MessageCursor`, which
# `lumen_core::prelude` does not re-export.
bevy_ecs.workspace = true
crossbeam-channel.workspace = true

[build-dependencies]
cbindgen.workspace = true

# The engine as a shared library, for the `dynamic-engine` release shape (see
# [features]). Only off Windows - no linkable engine exists there.
[target.'cfg(not(windows))'.dependencies]
lumen-dylib = { workspace = true, optional = true }

[features]
# The DEFAULT shared/static library is FULL-featured: one shared library serves
# every app (the whole point of link-not-embed). Per-app trimming applies ONLY
# to the static `--bundle` path, built `--no-default-features --features
# "<resolved capabilities>"` by lumenc.
default = [
    "embed-parser",
    "runtime-parse",
    "http-fetch",
    "mcp",
    "async",
    "modules",
    "host-rhai",
    "host-lua",
    "host-candela",
]
# Link lumenc for its `default_parser()` (the from-source embed path). Dropping
# it yields a parser-free launcher that only runs prebuilt LMNA bytes.
embed-parser = ["dep:lumenc", "runtime-parse"]
# Forwards to the runtime's Part B tree-shaking knobs.
runtime-parse = ["lumen-runtime/runtime-parse"]
http-fetch = ["lumen-runtime/http-fetch"]
mcp = ["lumen-runtime/mcp"]
async = ["lumen-runtime/async"]
# Runtime modules: the `[dependencies]` dylib loader.
modules = ["lumen-runtime/modules"]
host-rhai = ["lumen-runtime/host-rhai", "dep:rhai"]
host-lua = ["lumen-runtime/host-lua"]
host-candela = ["lumen-runtime/host-candela"]
# Link the engine as the shared `liblumen_engine` library instead of compiling
# it into `liblumen`. The release shape on Linux and macOS: built with
# `-C prefer-dynamic` (and an `$ORIGIN` / `@loader_path` rpath), `liblumen`
# keeps only the C ABI and the parser and shares one engine instance -
# `liblumen_engine` beside it - with the `lumenc` binary's own build and with
# the runtime modules the loader dlopens. Off by default: a plain build stays
# fully static. Windows has no linkable engine; the feature resolves to
# nothing there.
dynamic-engine = ["dep:lumen-dylib"]

[workspace]
resolver = "2"
# The grouped directories glob cleanly. The flat spine is listed crate by
# crate, because a `crates/*` glob would also match the group directories,
# which hold crates rather than being one.
members = [
    "crates/assets",
    "crates/core",
    "crates/html",
    "crates/i18n",
    "crates/input",
    "crates/ir",
    "crates/launcher",
    "crates/mcp",
    "crates/modules",
    "crates/plugin-abi",
    "crates/portable",
    "crates/prerender",
    "crates/primitives",
    "crates/runtime",
    "crates/scene",
    "crates/ssr",
    "crates/text",
    "crates/web",
    "crates/web-runtime",
    "crates/widget",
    "crates/widget-macros",
    "crates/backends/*",
    "crates/dev/*",
    "crates/os/*",
    "crates/script/*",
    "std/*",
    "sdk/rust",
    "public/lumen-module",
    "public/lumen-module/fixture",
    "public/lumen-module/fixture-host",
    "public/lumen-plugin",
    "public/lumen-plugin/fixture",
    "public/lumenc",
    "public/lumenc-plugin",
    "public/lumenc-plugin/fixture",
]
# The linkable engine is built through the Rust SDK's own dependency on it, on
# the platforms whose linker can produce one. Listing it here would build it on
# Windows too, where it cannot link. See public/lumen-dylib/Cargo.toml.
exclude = ["public/lumen-dylib"]

[workspace.package]
version = "0.0.6"
edition = "2024"
license = "MPL-2.0"
authors = ["Lumen contributors"]
repository = "https://github.com/lumen-fx/lumen"
rust-version = "1.85"
homepage = "https://lumenfx.dev"
documentation = "https://docs.lumenfx.dev"
# Registry metadata every crate inherits with `keywords.workspace = true` /
# `categories.workspace = true`. A crate whose subject is narrower than "the
# UI framework" (audio, i18n, the OS hosts, the renderers) overrides these in
# its own manifest; the rest take them as they are. crates.io caps keywords at
# five, and categories must be slugs it already knows.
keywords = ["ui", "gui", "framework", "desktop", "lumen"]
categories = ["gui"]

# Every dependency the workspace uses, declared once. Crates opt in by adding
# e.g.
#     bevy_ecs.workspace = true
# in their own Cargo.toml. Adding a line here pulls nothing on its own;
# stub crates stay dep-free until they need it.
[workspace.dependencies]
# The workspace's own crates. Each one is spelled out here and nowhere else; a
# member reaches it with `lumen-core = { workspace = true }`, adding `optional`
# or `features` beside that when it needs them.
#
# None of these carries a `version`. `lumenc` and `lumenui` are the only two
# packages that reach crates.io, everything else is `publish = false`, and a
# path dependency of a crate nobody publishes needs no version requirement. The
# one version literal in the workspace is `[workspace.package] version`.
#
# `default-features = false` on an entry below means some member needs that
# crate stripped, and the flag has to live here to take effect: cargo silently
# ignores a member that turns defaults off against an entry leaving them on. The
# reverse works, so a member that does want the defaults says
# `default-features = true` and gets them.
lumen = { path = "." }
lumen-a11y-accesskit = { path = "crates/backends/a11y-accesskit" }
lumen-archive = { path = "std/archive" }
lumen-assets = { path = "crates/assets" }
lumen-async-tokio = { path = "crates/backends/async-tokio" }
lumen-audio = { path = "std/audio" }
lumen-core = { path = "crates/core" }
lumen-devtools = { path = "crates/dev/devtools" }
lumen-download = { path = "std/download" }
# The engine in the form a Rust app links instead of compiling in. Excluded from
# the workspace, so it is the one internal crate that cannot inherit this table;
# see public/lumen-dylib/Cargo.toml for why it sits outside.
lumen-dylib = { path = "public/lumen-dylib" }
lumen-fs = { path = "std/fs" }
lumen-html = { path = "crates/html" }
lumen-http-ureq = { path = "crates/backends/http-ureq" }
lumen-i18n = { path = "crates/i18n" }
lumen-input = { path = "crates/input" }
lumen-ir = { path = "crates/ir" }
lumen-layout-taffy = { path = "crates/backends/layout-taffy" }
lumen-mcp = { path = "crates/mcp" }
lumen-module = { path = "public/lumen-module" }
lumen-modules = { path = "crates/modules" }
lumen-os-clipboard = { path = "crates/os/clipboard" }
lumen-os-dnd = { path = "crates/os/dnd" }
lumen-os-filedialog = { path = "crates/os/filedialog" }
lumen-os-hotkey = { path = "crates/os/hotkey" }
lumen-os-launcher = { path = "crates/os/launcher" }
lumen-os-menu = { path = "crates/os/menu" }
lumen-os-mime = { path = "crates/os/mime" }
lumen-os-notify = { path = "crates/os/notify" }
lumen-os-power = { path = "crates/os/power" }
lumen-os-tray = { path = "crates/os/tray" }
# Runtime-plugin SDK and loader. Defaults off: plugin authors take the trait
# and macro only; the runtime asks for the `host` loader feature.
lumen-plugin = { path = "public/lumen-plugin", default-features = false }
# The plugin plumbing both plugin systems sit on. Defaults off: the loader
# halves ask for `dlopen` and `resolve`, a plugin author's crate takes neither.
lumen-plugin-abi = { path = "crates/plugin-abi", default-features = false }
# `host-candela` is the default on both, and the browser build takes them
# without it: a page runs precompiled bytecode and has no use for the compiler.
lumen-portable = { path = "crates/portable", default-features = false }
lumen-prerender = { path = "crates/prerender", default-features = false }
lumen-primitives = { path = "crates/primitives" }
lumen-process = { path = "std/process" }
lumen-render-headless = { path = "crates/backends/render-headless" }
lumen-render-wgpu = { path = "crates/backends/render-wgpu" }
# Every subsystem is a default feature, and every consumer picks its own set:
# the shared library takes them all, a `--bundle` takes the app's capabilities.
lumen-runtime = { path = "crates/runtime", default-features = false }
lumen-scene = { path = "crates/scene" }
# These three carry no features of their own, so the flag only records that a
# host is taken bare: giving one a default later will not switch it on
# everywhere by surprise. `lumen-script-candela` below is the exception.
lumen-script = { path = "crates/script/api", default-features = false }
# Default `compiler` builds candela source at run time. A build script wants it;
# a shipped runtime executes precompiled `.cdlb` and does not.
lumen-script-candela = { path = "crates/script/candela", default-features = false }
lumen-script-lua = { path = "crates/script/lua", default-features = false }
lumen-script-rhai = { path = "crates/script/rhai", default-features = false }
lumen-ssr = { path = "crates/ssr" }
lumen-text = { path = "crates/text" }
lumen-text-cosmic = { path = "crates/backends/text-cosmic" }
lumen-web = { path = "crates/web" }
lumen-web-dom = { path = "crates/backends/web-dom" }
lumen-web-http = { path = "crates/backends/web-http" }
lumen-widget = { path = "crates/widget" }
lumen-widget-macros = { path = "crates/widget-macros" }
lumen-window-winit = { path = "crates/backends/window-winit" }
# A default lumenc links the whole runtime. The launcher stub and the LSP each
# take one feature of it instead, so defaults are off here and the engine, which
# wants the parser, asks for them back.
lumenc = { path = "public/lumenc", default-features = false }

# Compiler-plugin SDK and loader. Defaults off: plugin authors take the trait
# and macro only; lumenc/lumen-runtime ask for the `host` loader feature.
lumenc-plugin = { path = "public/lumenc-plugin", default-features = false }

# Core
# Bevy 0.18 merged bevy_hierarchy into bevy_ecs::hierarchy, and 0.19 keeps it
# there. Parent -> ChildOf.
# Do NOT add a separate bevy_hierarchy dep - it is stuck at 0.15 and would
# create a duplicate-type graph.
bevy_ecs = { version = "0.19", default-features = false, features = ["multi_threaded"] }
bevy_tasks = { version = "0.19", default-features = false, features = ["multi_threaded"] }
crossbeam-channel = "0.5"
# Vector/matrix math for our own boundary types (Vec2 rects, Mat4 transforms).
# Bevy's glam is a *separate* graph: `bevy_ecs` here is default-features = false,
# so the only crate that could pull Bevy's ^0.32 pin is `bevy_reflect`, and that
# path is not enabled. Nothing in the build passes a glam type across a Bevy API,
# so this version moves independently of `bevy_ecs`. Check `cargo tree -d glam`
# after any Bevy bump: if a second glam appears, a Bevy feature turned reflection
# on and the two must be reconciled before types can cross that boundary.
glam = "0.33"

# Rendering
# Pinned to wgpu 29 because vello 0.9 ships wgpu 29; mixing versions yields
# duplicate-type errors at FFI boundaries. Use `vello::wgpu` re-export in
# code so the version follows vello automatically.
#
# Part A (runtime-tree-shaking): `vello` drops default features and asks only
# for `wgpu` -- that drops vello's `wgpu_default` alias which turned on
# `wgpu/default` and with it ALL FOUR native backends (+ all four naga
# shader-output generators) on every OS. `wgpu` itself is `default-features =
# false` here as a shared anchor; `lumen-render-wgpu` adds ONE target-scoped
# `wgpu` dep selecting exactly the current OS's backend (Vulkan/Metal/DX12),
# so cargo feature unification resolves wgpu to a single backend per OS.
wgpu = { version = "29", default-features = false }
vello = { version = "0.9", default-features = false, features = ["wgpu"] }
# SVG parser. vello_svg can't be used directly: its 0.8 release pins
# vello 0.6 and its 0.9 release pins vello 0.7 - both conflict with
# our pinned vello 0.9 + wgpu 29. So we pull `usvg` standalone, walk
# the parsed tree on the asset worker, and emit kurbo paths into our
# own vello::Scene. Keeps vello version control local and supports the
# common SVG-icon subset (paths + solid fills/strokes).
#
# default-features = false drops usvg's `text` stack (rustybuzz + its
# fontdb wiring) - a SECOND shaping engine next to cosmic-text's
# harfrust, ~0.5 MiB of duplicate .text in release lumenc. No behavior
# change: the usvg->vello walker in lumen-assets has always ignored
# `Node::Text` (the enum variant exists regardless of the feature), so
# SVG <text> was never rendered. If SVG text support ever lands,
# prefer pre-flattening via cosmic-text over re-enabling usvg's
# parallel shaper stack.
usvg = { version = "0.48", default-features = false }

# Layout
taffy = "0.13"

# Text
cosmic-text = "0.19"

# Windowing - 0.30 is current stable; 0.31 is still beta as of May 2026.
winit = "0.30"

# Async
tokio = { version = "1.52", features = ["rt-multi-thread", "io-util", "fs", "net", "macros", "sync"] }

# A11y
accesskit = "0.24"
accesskit_winit = "0.33"

# Scripting. The `sync` feature swaps internal `Rc`s for `Arc`s so the
# Engine + AST + Dynamic are Send + Sync, letting hosts move between
# threads / sit in regular bevy Resources / parallelize naturally.
rhai = { version = "1.24", features = ["sync"] }
# Alternative script host (lumen-script-lua). `vendored` statically
# builds Lua 5.4 (no system dependency, hermetic under the pinned
# toolchain); `send` swaps mlua's internals so `Lua`, `Value`,
# `Function` are `Send + Sync` - required so `LuaHost` can be a regular
# bevy Resource + satisfy `ScriptHost: Send + Sync`, exactly as rhai's
# `sync` feature does for `RhaiHost`.
mlua = { version = "0.12", features = ["lua54", "vendored", "send"] }

# Tooling
cbindgen = "0.29"
tower-lsp = "0.20"

# Observability
tracing = "0.1"
tracing-subscriber = "0.3"
# Chrome trace exporter - emits a JSON file readable by chrome://tracing
# and Perfetto. Compiled only behind lumenc's `profiling` cargo feature
# (which also flips bevy_ecs/trace on so spans exist); installed at
# runtime by `lumenc run --profile chrome`.
tracing-chrome = "0.7"

# Errors
thiserror = "2"

# Shared-library loading: the dlopen run path and the compiler-plugin loader.
libloading = "0.9"

# Version-requirement matching for `[[plugins]] version` resolution
# (cargo-compatible semantics: "1.2" means ^1.2).
semver = "1"

# Unix signal -> flag bridge (lumenc --headless graceful SIGINT/SIGTERM).
signal-hook = "0.4"
# Raw dlopen flags (RTLD_NOLOAD) for the module loader's engine probe.
libc = "0.2"
# Windows console-control (Ctrl+C / Ctrl+Break / close) -> graceful close.
# The Unix arm uses signal-hook directly; ctrlc wraps SetConsoleCtrlHandler
# so the windows arms mirror the SIGINT/SIGTERM behavior.
ctrlc = "3"

# Serialization (used by lumen-mcp + lumen-mcp-server)
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Reads the script builtin metadata (`crates/script/api/builtins.ron`) in that
# crate's build script, which generates the per-host tables. Build-time only:
# no shipped binary links it, and nothing parses RON at run time.
ron = "0.11"
# Finds the C compiler for the target in `lumen-script-candela`'s build script,
# which builds candela's C-backed standard library modules. Build-time only.
cc = "1"
# Compact binary codec for the AOT compiled-app artifact (`lumenc build`).
# Chosen over RON/JSON because bincode drops all field-name/schema overhead;
# the artifact is embedded/shipped, so on-disk size is the priority.
bincode = "1.3"
# TOML parser for lumen.toml per-app config. `std` is listed explicitly:
# toml 1.0 broke it out of the always-on core into its own default feature,
# so a `default-features = false` dep drops filesystem/error plumbing without
# it. Parse whole documents with `toml::from_str`, never `str::parse::<Value>`
# - since 1.0 the `FromStr` impl parses a single TOML *value*, so handing it a
# document fails, and every call site here treats a parse failure as "no
# config" rather than an error.
toml = { version = "1.1", default-features = false, features = [
    "std",
    "parse",
    "serde",
    "display",
] }

# Image encoding (PNG for headless screenshots in lumen-mcp).
image = { version = "0.25", default-features = false, features = ["png"] }

# Base64 encoding (for screenshot transport).
base64 = "0.23"

# Synchronous HTTP for scripts' `fetch(url, tag)` builtin. Spawned on a
# dedicated thread per request, so the main loop stays unblocked. Also how
# `lumenc package --target` fetches another platform's toolchain files.
ureq = { version = "3", features = ["json"] }

# Release-archive handling for `lumenc package --target`: verify a download
# against the release's published checksums, then read the two files needed
# out of the archive. Unix releases ship .tar.gz, Windows ships .zip, so both
# readers are needed on every host that can cross-package.
sha2 = "0.10"
tar = "0.4"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
zip = { version = "6", default-features = false, features = ["deflate"] }

# OS clipboard for text-input copy/cut/paste. Cross-platform: Wayland, X11,
# macOS, Windows. We instantiate one Clipboard per process at plugin init.
arboard = { version = "3", default-features = false, features = ["image-data"] }

# System info (CPU%, memory, processes) - exposed to Rhai as builtins
# so apps can build system-monitor-style UIs. One cached
# `sysinfo::System` lives on `RhaiHost`; refreshes throttle to >= 200 ms
# to match sysinfo's CPU sampling minimum.
sysinfo = { version = "0.39", default-features = false, features = ["system"] }

# Markdown parser - exposed as `parse_markdown(s)` Rhai builtin so apps
# can render markdown blocks via `<for>`. Block-level only at the Rhai
# layer; inline emphasis flattens to plain text.
pulldown-cmark = { version = "0.13", default-features = false }

# Bounded LRU cache. Pure-Rust, no_std-compatible; ~200 LoC. Used by
# lumen-text-cosmic (shape result cache), lumen-render-wgpu (GPU upload
# cache), and lumen-assets (image / SVG / failure caches). Pinning to one
# version here keeps the dep graph unified across the workspace.
lru = "0.18"

# Fast, non-DoS-resistant hasher (Firefox's FxHash). Used for internal
# render / shaping caches keyed on trusted data (font ids, fragment keys)
# where the cryptographic strength of the std `DefaultHasher` (SipHash) is
# wasted cycles. Pure-Rust, no_std-compatible.
rustc-hash = "2"

# Rope buffer for editable text (W3.1). O(log n) insert/delete + cheap
# slicing - used by lumen-core's TextBuffer for editable inputs.
ropey = "1"

# Grapheme cluster / word boundary iteration (W3.1 + W3.4). Powers
# double-click word selection and grapheme-level cursor movement.
unicode-segmentation = "1"

# `std::time::Instant` and `SystemTime` panic on wasm32-unknown-unknown, where
# there is no OS clock to read. Backs `lumen_core::time`, which every crate in
# the browser-reachable graph imports instead of `std::time`. Target-gated to
# wasm32 in the crates that use it, so a native build never links it. Already
# in the tree through winit/wgpu, so this pins the one version they share.
web-time = "1.1"

# The browser boundary (lumen-web-runtime). `web-sys` ships one cargo feature
# per Web IDL interface and generates nothing that is not named, so every
# consumer lists the interfaces it calls rather than enabling a group; the
# generated glue is what a page downloads. The three versions move together and
# are pinned here so one `wasm-bindgen` CLI matches the whole workspace: the
# command-line tool refuses an artifact built against a different version.
wasm-bindgen = "0.2.127"
wasm-bindgen-test = "0.3"
# Awaiting a JavaScript promise from Rust, which is how the runtime fetches the
# files a page names. Versioned with `wasm-bindgen`, whose ABI it shares.
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", default-features = false }

# Cross-platform filesystem watch - backs lumen-assets' disk-change
# invalidation. Wraps inotify / FSEvents / ReadDirectoryChangesW.
# `RecommendedWatcher` picks the best backend per platform at runtime.
notify = "8"

# Cross-platform URL / file opener. Backs `lumen-os-launcher`
# (`open_url`, `open_path`, `reveal_in_file_manager`). Wraps
# `xdg-open` / `start` / `open` per OS - same surface every desktop
# app re-implements.
opener = "0.8"

# CSS tokenizer (W4.1). Provides W3C-spec-compliant component-value /
# at-rule tokenization. We layer our own selector parser + matcher on
# top because `selectors` (the Servo crate) requires implementing six
# ECS-touching traits (`Element`, `SelectorImpl`, bloom filters ...) for
# a feature surface (`@layer`, full attr selectors, namespaces) much
# wider than W4.1-W4.4 needs. Keeping the matcher in-house buys
# specificity + combinators + `:is/:where/:not` + structural pseudos
# against `cssparser` tokens at much lower wire-up cost.
cssparser = "0.37"

# Internationalization (W5.7 / W5.8). Fluent for translation; ICU4X
# umbrella for locale-aware number / date / currency / relative-time
# formatting. The `unstable` feature pulls in `icu_experimental`
# (currency formatter + relative-time formatter; named `experimental`
# before icu 2.2); the `sync` feature swaps internal Rcs for Arcs so baked-data
# DataPayloads inside formatters become Send + Sync, which bevy_ecs
# `Resource` requires. The `ryu` feature enables `Decimal::try_from_f64`.
fluent = "0.17"
fluent-bundle = "0.16"
unic-langid = "0.9"
# Exact pin, on purpose. `unstable` pulls `icu_experimental`, which makes
# no API promise and which the umbrella tracks with a `~` requirement, so
# a caret range here lets an unlocked build (`cargo install --git`, which
# ignores Cargo.lock) pick up an experimental release the source does not
# compile against. Bump deliberately, with the currency / relative-time
# call sites in lumen-i18n.
icu = { version = "=2.3.0", features = ["unstable", "sync"] }
# Separate pin so the `ryu` feature on `fixed_decimal` is enabled -
# the icu umbrella doesn't re-export it, and Decimal::try_from_f64 is
# gated behind it. Both icu_decimal and this pin resolve to the same
# fixed_decimal 0.7.x major.
fixed_decimal = { version = "0.7", features = ["ryu"] }
# System locale detection - already a transitive dep via cosmic-text.
# Declaring it at workspace level so lumen-i18n can grab the same pin.
sys-locale = "0.3"

# Testing
proptest = "1.11"

# Line tables keep panic backtraces pointing at file and line; the full
# debug-info tier is opt-in for a debugger session (cargo's own default via
# `debug = true`) because it multiplies the on-disk size of every artifact.
[profile.dev]
opt-level = 0
debug = "line-tables-only"

# panic stays "unwind": lumen's C-ABI exports rely on catch_unwind to
# convert panics into error codes; abort would kill the host process instead.
#
# opt-level "s": author's trade (2026-07-22) - measured 27.66 -> 19.98 MiB
# stripped lumenc (-26%) for +1.5-3.3 ms startup and noise-level scroll
# p95. Size is the headline priority; revisit if a hot path regresses.
[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
debug = false
strip = "symbols"

# The wasm module a page downloads, so size beats everything: "z" over "s",
# and `panic = "abort"` because wasm32-unknown-unknown has no unwinder to
# generate landing pads for. Build the browser runtime with
# `--profile wasm-release --target wasm32-unknown-unknown`; `wasm-opt -Oz`
# runs after, on the wasm-bindgen output.
[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"

# Speed up dev builds of heavy backend crates while keeping our own crates
# fast to recompile. Dependencies carry no debug info at all: their sources
# do not change under a debugger here, and the debug-info sections are what
# turn a target directory into hundreds of gigabytes.
[profile.dev.package."*"]
opt-level = 1
debug = false

# Build scripts and proc macros run at compile time; nothing debugs them.
[profile.dev.build-override]
debug = false
