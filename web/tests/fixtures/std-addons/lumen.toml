# Proof fixture for the first-party browser add-ons. The app declares each
# one the way an app would, calls into all of them, and writes every answer
# into a label of its own, so a page opened in a browser shows which leg
# worked. .github/scripts/web-addons-smoke.py opens it and checks them.
#
# The canvas is declared for every target: a web build takes its page
# implementation and a desktop build loads the runtime module. The rest are
# for the web build only.
[script]
engine = "candela"

[dependencies]
lumen-canvas = { bundled = true, tags = ["canvas"] }

[target.web.dependencies]
lumen-js = { bundled = true, config = { allow = ["data:"] } }
lumen-websocket = { bundled = true }
lumen-storage = { bundled = true }
lumen-cookie = { bundled = true }
lumen-browser = { bundled = true }
lumen-svg = { bundled = true }

# No introspection server, so a `--headless` run binds no port.
[mcp]
port = 0
