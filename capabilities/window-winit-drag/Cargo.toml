# The link's handle on the `window-winit-drag` capability: nothing but the
# constructor that registers it, in an object of its own. A link that names
# the register symbol carries drags across windows on the winit backend; one
# that leaves it out carries none of that code.
[package]
name = "lumen-window-winit-drag-capability"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Registers the window-winit-drag capability of the Lumen runtime for a link to select."
keywords.workspace = true
categories.workspace = true
publish = false

[dependencies]
lumen-capability = { workspace = true }
lumen-window-winit-drag = { workspace = true }
