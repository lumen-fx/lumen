# cbindgen config for lumen-ffi.
#
# Generates the "simple" subset of the C ABI into
# `include/lumen_simple.h` - the parts where cbindgen's output is
# trustworthy and the hand-written `lumen.h` is happy to delegate.
#
# The complex LumenValue / LumenValueData / LumenArrayView /
# Option<extern "C" fn> surface stays hand-written in `lumen.h`. See
# the header at the top of `lumen.h` for the rationale.

language = "C"
header = """
/*
 * AUTO-GENERATED by cbindgen - do not edit by hand.
 *
 * Generated from lumen-ffi for the simple-side C ABI (status enum,
 * version macro, app lifecycle entry points). The complex tagged-
 * union types and callback signatures live in the hand-written
 * `lumen.h`, which includes this file.
 */
"""
include_guard = "LUMEN_SIMPLE_H"
pragma_once = true
cpp_compat = true
documentation = true
documentation_style = "c"
sys_includes = ["stddef.h", "stdint.h", "stdbool.h"]
no_includes = true
style = "type"
line_length = 100
tab_width = 4
usize_is_size_t = true

[parse]
parse_deps = false

# Only emit declarations whose name is listed. cbindgen stumbles on
# the recursive LumenValue/LumenValueData/LumenArrayView cycle and on
# Option<extern "C" fn> in `LumenFn`; those stay hand-written in
# `lumen.h`. We surface the simple entry points + the version function
# here. The status enum stays hand-written in `lumen.h` so the
# `LUMEN_OK` / `LUMEN_ERR_*` C identifiers match the existing
# `lumen.hpp` and embedder code (cbindgen would emit `OK` / `ERR_*`
# under ScreamingSnakeCase variant renaming).
[export]
include = [
    "lumen_abi_version",
    "lumen_app_new",
    "lumen_app_set_title",
    "lumen_app_set_size",
    "lumen_app_free",
    "lumen_app_run",
    "lumen_last_error",
    "lumen_last_error_global",
    "lumen_signal_set_string",
    "lumen_signal_set_int",
    "lumen_signal_set_f64",
    "lumen_signal_clear",
    # W7.x typed scalar accessors. The hand-written `lumen.h` also
    # declares these (to keep one canonical authoritative copy that
    # never depends on cbindgen running); the cbindgen mirror lets
    # downstream tooling that consumes the auto-generated header
    # also pick them up.
    "lumen_signal_set_int64",
    "lumen_signal_get_int64",
    "lumen_signal_set_float64",
    "lumen_signal_get_float64",
    "lumen_signal_set_bool",
    "lumen_signal_get_bool",
    "lumen_signal_set_color",
    "lumen_signal_get_color",
    "lumen_status_message",
]
# Skip the value-tree types; the hand-written `lumen.h` defines them.
exclude = [
    "LumenStatus",
    "LumenValue",
    "LumenValueData",
    "LumenKind",
    "LumenMapEntry",
    "LumenArrayView",
    "LumenMapView",
    "LumenApp",
    "LumenFn",
    "UserData",
    "lumen_app_expose",
    "lumen_signal_set_array",
    # ABI 0.3 additions. Hand-written in `lumen.h`; excluded here so
    # cbindgen doesn't emit a conflicting declaration (the callback-typed
    # ones render `Option<extern fn>` as an `Option_*` struct cbindgen
    # can't reconcile with the real function-pointer signature).
    "LumenFnV2",
    "LumenClickFn",
    "lumen_app_expose_v2",
    "lumen_app_on_click",
    "lumen_app_run_headless",
    "lumen_signal_get_string",
    "lumen_signal_array_len",
    "lumen_signal_array_get_field",
    # ABI 0.4 change-subscription surface. Hand-written in `lumen.h`; the
    # callback-typed export renders `Option<extern fn>` as an unusable
    # `Option_*` struct under cbindgen, so it stays excluded here.
    "LumenWatchFn",
    "lumen_signal_watch",
    # ABI 0.5 graceful-shutdown hook. Hand-written in `lumen.h` for the
    # same callback-typed reason.
    "LumenCloseFn",
    "lumen_app_on_close",
    # ABI 0.10 dynamic DOM events. `lumen_on` takes an `Option<extern fn>`
    # callback, which cbindgen renders as an unusable `Option_*` struct;
    # hand-written in `lumen.h`. The rest of the event surface (`LumenEvent`,
    # `LumenEventToken`, `lumen_off`, and the `lumen_event_*` accessors) has no
    # function-pointer parameters and stays auto-generated here.
    "LumenEventFn",
    "LumenEvent",
    "lumen_on",
]

[defines]

[enum]
prefix_with_name = false
rename_variants = "ScreamingSnakeCase"
must_use = "MUST_USE"

[fn]
prefix = ""
postfix = ""

[macro_expansion]
bitflags = false
