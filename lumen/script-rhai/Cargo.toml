[package]
name = "lumen-script-rhai"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Rhai ScriptHost impl."

[dependencies]
lumen-script = { path = "../script", default-features = false }
lumen-core = { path = "../core" }
bevy_ecs.workspace = true
rhai.workspace = true
serde_json.workspace = true
# T5.3: non-poisoning, faster-on-uncontested, smaller-sizeof Mutex.
# Already pulled transitively by taffy + winit; we just opt in directly.
parking_lot = "0.12"
# D1.2: markdown -> block list for mdeditor demo.
pulldown-cmark.workspace = true
tracing.workspace = true

[features]
# `http-fetch` is on by default so a plain build behaves exactly as
# before; it exists as a packager knob for size-trimmed lumenc builds.
# The actual ureq dep + `fetch()` transport lives in lumen-script; this
# feature forwards so existing `lumen-script-rhai/http-fetch` references
# (lumenc's feature wiring) keep working unchanged.
default = ["http-fetch"]
http-fetch = ["lumen-script/http-fetch"]

[dev-dependencies]
# `metadata` enables `Engine::gen_fn_signatures`, used by the
# `builtins_parity` test to prove every entry in `builtins::BUILTINS` is
# actually registered on the engine. Confined to test builds - normal
# builds of this crate and its dependents never pull the feature.
rhai = { workspace = true, features = ["metadata"] }
