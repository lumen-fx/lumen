# Pinned so rustfmt/clippy output is identical across local dev, CI, and
# worktree agents. Drift here reformats fmt-clean files and breaks
# `cargo fmt --check` (see commit b6c4dbf). Bump deliberately, in one commit.
[toolchain]
channel = "1.97.0"
components = ["rustfmt", "clippy"]
# The browser runtime (crates/web-runtime) and the wasm compile gate over the
# crates it shares with the desktop build. Listed here so `rustup` installs the
# standard library for it on checkout, in CI and locally alike, rather than
# every wasm command failing until someone runs `rustup target add`.
targets = ["wasm32-unknown-unknown"]
