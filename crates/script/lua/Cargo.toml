[package]
name = "lumen-script-lua"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Lua (mlua / Lua 5.4) ScriptHost impl - selectable alternative to the Rhai host, same engine-function surface."
keywords = ["ui", "gui", "scripting", "lua", "mlua"]
categories = ["gui"]
# Not published: `lumenc` and `lumenui` are the only crates.io packages.
publish = false

[dependencies]
# `json` and `markdown` pull in the shared `parse_json` / `parse_markdown`
# walk (and, with it, serde_json / pulldown-cmark) through the builtin table.
lumen-script = { workspace = true, features = ["json", "markdown"] }
lumen-core = { workspace = true }
bevy_ecs.workspace = true
# Lua 5.4, statically vendored, Send+Sync (see workspace dep comment).
mlua.workspace = true
# Non-poisoning, smaller-sizeof Mutex; matches the Rhai host's choice so
# the two hosts stay behaviourally aligned. Already in the dep graph.
parking_lot = "0.12"
tracing.workspace = true
