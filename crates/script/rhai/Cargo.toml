[package]
name = "lumen-script-rhai"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Rhai ScriptHost impl."
keywords = ["ui", "gui", "scripting", "rhai", "lumen"]
categories = ["gui"]

[dependencies]
lumen-script = { path = "../api", version = "0.0.4", default-features = false }
lumen-core = { path = "../../core", version = "0.0.4" }
bevy_ecs.workspace = true
rhai.workspace = true
serde_json.workspace = true
# T5.3: non-poisoning, faster-on-uncontested, smaller-sizeof Mutex.
# Already pulled transitively by taffy + winit; we just opt in directly.
parking_lot = "0.12"
# D1.2: markdown -> block list for mdeditor demo.
pulldown-cmark.workspace = true
tracing.workspace = true

[dev-dependencies]
# `metadata` enables `Engine::gen_fn_signatures`, used by the
# `builtins_parity` test to prove every entry in `builtins::BUILTINS` is
# actually registered on the engine. Confined to test builds - normal
# builds of this crate and its dependents never pull the feature.
rhai = { workspace = true, features = ["metadata"] }
