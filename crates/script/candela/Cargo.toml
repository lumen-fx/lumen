[package]
name = "lumen-script-candela"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "candela ScriptHost impl."
keywords = ["ui", "gui", "scripting", "candela", "lumen"]
categories = ["gui"]
# Not published: `lumenc` and `lumenui` are the only crates.io packages.
publish = false

[features]
default = ["compiler"]
# The candela compiler front-end: `CandelaHost`, `ScriptCandelaPlugin`,
# `compile_bytecode`, and with them source compilation, hot reload, and
# `lumenc check`. Off, the crate keeps the builtin surface, the prelude, and
# `CandelaVmHost`, which runs a precompiled `.cdlb` on `candela-vm` alone. That
# is what a shipped app and the browser target want, and it is the difference
# between linking a compiler and not.
compiler = ["dep:candela"]

[dependencies]
# `json` and `markdown` pull in the shared `parse_json` / `parse_markdown`
# walk (and, with it, serde_json / pulldown-cmark) through the builtin table.
lumen-script = { workspace = true, features = ["json", "markdown"] }
lumen-core = { workspace = true }
bevy_ecs.workspace = true
# candela embedding API (Engine/Program) lives on the crate's `main` branch.
# Structured host-fn marshalling (string/int/float/bool/null plus Array/Map),
# the fallible host-fn result, the data-signature registration this crate binds
# a typed plugin function through, and the variadic registration that carries
# dynamically-shaped values.
#
# The package on the candela side is named `candela-lang` (the bare `candela`
# name on crates.io is an unrelated 2020 crate); its library keeps the
# `candela` import name. The git source drives a development build, and the
# version resolves to the release in a published one.
candela = { package = "candela-lang", git = "https://github.com/lumen-fx/candela", branch = "main", version = "0.0.6", optional = true }
# The runtime half of the same toolchain: the executor, the value marshalling,
# and the `.cdlb` load/call API. Always present - the builtin surface and the
# artifact host are written against it, and `candela` re-exports it, so the two
# hosts share one implementation of both.
candela-vm = { git = "https://github.com/lumen-fx/candela", branch = "main", version = "0.0.6" }

[build-dependencies]
# Reads the resolved dependency graph, the only place a dependency's own source
# directory is named, so the build script can stage the standard library out of
# the candela source this crate compiles against.
serde_json.workspace = true
# Names the C compiler and the flags for the target. The build script drives
# the command itself, because candela opens the C-backed standard library
# modules as shared libraries and `cc` builds static archives.
cc.workspace = true
