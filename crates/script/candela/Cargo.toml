[package]
name = "lumen-script-candela"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "candela ScriptHost impl."

[dependencies]
lumen-script = { path = "../api", default-features = false }
lumen-core = { path = "../../core" }
bevy_ecs.workspace = true
# candela embedding API (Engine/Program) lives on the crate's `main` branch.
# Structured host-fn marshalling (string/int/float/bool/null plus Array/Map),
# plus the variadic registration that carries dynamically-shaped values.
candela = { git = "https://github.com/lumen-fx/candela", branch = "main" }
# `parse_json`: JSON text -> candela values. Same dep the Rhai and Lua hosts
# carry for their own `parse_json`.
serde_json.workspace = true
# `parse_markdown`: markdown -> block list, matching the Rhai and Lua hosts.
pulldown-cmark.workspace = true

[features]
# Mirrors `lumen-script-rhai`: `http-fetch` is on by default and forwards to
# lumen-script so a plain build ships the `fetch(url, tag)` transport;
# packagers can size-trim by turning default features off.
default = ["http-fetch"]
http-fetch = ["lumen-script/http-fetch"]
