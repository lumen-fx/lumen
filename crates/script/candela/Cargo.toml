[package]
name = "lumen-script-candela"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "candela ScriptHost impl."
keywords = ["ui", "gui", "scripting", "candela", "lumen"]
categories = ["gui"]

[dependencies]
lumen-script = { path = "../api", version = "0.0.3", default-features = false }
lumen-core = { path = "../../core", version = "0.0.3" }
bevy_ecs.workspace = true
# candela embedding API (Engine/Program) lives on the crate's `main` branch.
# Structured host-fn marshalling (string/int/float/bool/null plus Array/Map),
# plus the variadic registration that carries dynamically-shaped values.
#
# The package on the candela side is named `candela-lang` (the bare `candela`
# name on crates.io is an unrelated 2020 crate); its library keeps the
# `candela` import name. The git source drives a development build, and the
# version resolves to the release in a published one.
candela = { package = "candela-lang", git = "https://github.com/lumen-fx/candela", branch = "main", version = "0.0.4" }
# `parse_json`: JSON text -> candela values. Same dep the Rhai and Lua hosts
# carry for their own `parse_json`.
serde_json.workspace = true
# `parse_markdown`: markdown -> block list, matching the Rhai and Lua hosts.
pulldown-cmark.workspace = true
