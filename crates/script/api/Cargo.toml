[package]
name = "lumen-script"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Scripting backend trait (ScriptHost, StateProxy)."
keywords = ["ui", "gui", "scripting", "host", "lumen"]
categories = ["gui"]

[dependencies]
lumen-core = { path = "../../core", version = "0.0.3" }
lumen-ir = { path = "../../ir", version = "0.0.3" }
lumen-input = { path = "../../input", version = "0.0.3" }
lumen-primitives = { path = "../../primitives", version = "0.0.3" }
lumen-os-dnd = { path = "../../os/dnd", version = "0.0.3" }
bevy_ecs.workspace = true
crossbeam-channel.workspace = true
thiserror.workspace = true

[build-dependencies]
# Reads `builtins.ron` when this crate compiles, so the builtin metadata
# tables are generated rather than hand-maintained per host. A build
# dependency, so the parser never reaches a shipped binary.
ron.workspace = true
serde.workspace = true
