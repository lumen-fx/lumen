[package]
name = "lumen-text-cosmic"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "cosmic-text TextShaper + FontDB impl."
keywords = ["ui", "gui", "text", "fonts", "cosmic-text"]
categories = ["gui", "text-processing"]
# Not published: `lumenc` and `lumenui` are the only crates.io packages.
publish = false

[dependencies]
lumen-text = { workspace = true }
cosmic-text.workspace = true
# Bounded LRU cache for shape results. Replaces a HashMap with a
# catastrophic-clear-on-cap policy. Pure-Rust, ~200 LoC.
lru = "0.18"
# FxHasher for the font-id -> face-data dedup map (trusted keys; no need
# for SipHash's DoS resistance).
rustc-hash.workspace = true

[dev-dependencies]
# Tests resolve the default `line-height` rather than restating its ratio.
lumen-core = { workspace = true }
# The layout engine's shaped-text producer is exercised against a real
# shaper here; nothing in the shipped crate depends on the layout engine.
lumen-layout-taffy = { workspace = true }
bevy_ecs.workspace = true
glam.workspace = true
