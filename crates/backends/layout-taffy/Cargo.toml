[package]
name = "lumen-layout-taffy"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "taffy-backed LayoutEngine impl."
keywords = ["ui", "gui", "layout", "flexbox", "taffy"]
categories = ["gui"]
# Not published: `lumenc` and `lumenui` are the only crates.io packages.
publish = false

[dependencies]
lumen-core = { workspace = true }
# Intrinsic text sizing during taffy's MeasureFunc callback goes through
# the `TextShaper` trait, so the layout engine names no shaping backend.
lumen-text = { workspace = true }
bevy_ecs.workspace = true   # needed for #[derive(Resource)] macro expansion path
glam.workspace = true
taffy.workspace = true

[dev-dependencies]
proptest.workspace = true
