[package]
name = "lumen-web-http"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Browser HttpDispatch impl for Lumen. Runs the scripts' fetch() and http() builtins on the page's own fetch, with a bounded body read."
keywords = ["ui", "gui", "http", "web", "lumen"]
categories = ["gui", "wasm", "web-programming::http-client"]

[dependencies]
lumen-script = { path = "../../script/api", version = "0.0.3" }

# Not target-gated. The crate is a browser backend and only a browser runs it,
# but building it for the host is what puts it under the workspace's own clippy
# and type check rather than only under the wasm one.
wasm-bindgen.workspace = true
# The reply arrives as a promise, and the page's task queue is what resolves
# it: `spawn_local` is how a request leaves the tick without a thread.
wasm-bindgen-futures.workspace = true
js-sys.workspace = true
# Explicit interface list, not a blanket enable: every named interface is
# generated into the module, so this list is a size lever. Add one only when
# something calls it.
web-sys = { workspace = true, features = [
    "AbortSignal",
    "Headers",
    "ReadableStream",
    "ReadableStreamDefaultReader",
    "Request",
    "RequestInit",
    "Response",
    "Window",
] }

[dev-dependencies]
wasm-bindgen-test.workspace = true
# The suite waits on a reply, which takes a timer the crate itself never sets,
# and it fetches the page it is running in, which takes the address of that
# page. Naming both here keeps them out of the module a page loads.
web-sys = { workspace = true, features = ["Location"] }
