[package]
name = "lumen-audio-rodio"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "rodio/cpal AudioBackend impl for Lumen. Decodes wav and ogg and mixes off the UI thread; degrades to a silent transport when no output device is available (headless/CI)."
# Not published: `lumenc` and `lumenui` are the only crates.io packages.
publish = false

[dependencies]
lumen-audio = { workspace = true }

# rodio provides the cpal device sink + Player control handle and the
# symphonia-backed decoders. Lean feature set: `playback` (cpal output),
# `wav` (symphonia PCM/WAV) and `vorbis` (symphonia OGG/Vorbis) only -
# the mp3 / mp4 / flac symphonia codecs are dropped to keep the decoder
# table and binary small. Matches the wav+ogg minimum; user-supplied
# .ogg files decode because `vorbis` is on.
rodio = { version = "0.22", default-features = false, features = [
    "playback",
    "wav",
    "vorbis",
] }

# symphonia (already in-tree via rodio's decoders) is depended on directly
# so we can *probe* a track's total duration from its encoded bytes. rodio's
# `Source::total_duration()` returns `None` for Ogg/Vorbis (Vorbis streams
# don't expose a frame count without reading the final Ogg page's granule
# position), leaving the seek bar's total time blank. We probe metadata only:
# one cheap pass at load, no full decode. Feature set mirrors rodio's:
# ogg+vorbis and wav+pcm, `default-features = false`. Version pinned to the
# rodio-resolved 0.5: rodio 0.22 still depends on symphonia 0.5, and a direct
# 0.6 here would put two symphonia majors in the tree.
symphonia = { version = "0.5", default-features = false, features = [
    "ogg",
    "vorbis",
    "wav",
    "pcm",
] }
