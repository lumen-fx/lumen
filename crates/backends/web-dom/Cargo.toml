[package]
name = "lumen-web-dom"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Lumen's browser render backend: adopts a prerendered document, projects the world onto it, and turns DOM events into Lumen events."
keywords = ["ui", "gui", "web", "wasm", "lumen"]
categories = ["gui", "wasm"]
# Not published: `lumenc` and `lumenui` are the only crates.io packages.
publish = false

[dependencies]
lumen-core = { workspace = true }
lumen-ir = { workspace = true }
# The contract the emitter wrote the document against: node paths, the
# `data-lm-*` attributes, the tag map. Hand-rolling any of it here would put
# the two halves on different rules.
lumen-html = { workspace = true }
# The scene this backend projects: the spawner that built it and the markers
# the reconcilers maintain.
lumen-scene = { workspace = true }
# The markers a widget carries that have no attribute a document could hold:
# a checkbox's tri-state one is set on the control as a property or not at
# all.
lumen-primitives = { workspace = true }
# The drop-accept filter the spawner already put on every `drop-target` it
# built. Reading it here is what makes `accept="..."` mean the same thing in a
# browser as it does on the desktop; the crate is already in the wasm graph
# through `lumen-scene`, so naming it pulls no new code.
lumen-os-dnd = { workspace = true }
bevy_ecs.workspace = true
glam.workspace = true
# Not target-gated. The crate is a browser backend and only a browser runs it,
# but building it for the host is what puts it under the workspace's own
# clippy and type check rather than only under the wasm one.
wasm-bindgen.workspace = true
js-sys.workspace = true
# Explicit interface list, not a blanket enable: every named interface is
# generated into the module, so this list is a size lever. Add one only when
# something calls it.
web-sys = { workspace = true, features = [
    "DataTransfer",
    "Document",
    "DomTokenList",
    "DragEvent",
    "Element",
    "Event",
    "EventTarget",
    "History",
    "HtmlAnchorElement",
    "HtmlDialogElement",
    "HtmlElement",
    "HtmlInputElement",
    "HtmlTextAreaElement",
    "InputEvent",
    "KeyboardEvent",
    "Location",
    "MouseEvent",
    "Node",
    "NodeList",
    "Text",
    "Window",
    "console",
] }

[dev-dependencies]
# The other half of the contract. The tests emit their fixtures with the real
# emitter rather than checking against a copy of what it writes, because a
# copy would agree with itself while the two halves drifted apart.
lumen-web = { workspace = true }
# The pipeline a page runs a key through, which is the desktop's own: what a
# forwarded key does is this crate's question only because this crate and
# lumen-primitives above answer it, so the key tests put it in rather than
# restating what it would do.
lumen-input = { workspace = true }
wasm-bindgen-test.workspace = true
# A test raises an event the way the browser raises it, which takes a
# dictionary nothing in the crate itself constructs. Naming it here keeps it
# out of the module a page loads.
web-sys = { workspace = true, features = [
    "CssStyleDeclaration",
    "DataTransferItem",
    "DataTransferItemList",
    "DragEventInit",
    "EventInit",
    "File",
    "KeyboardEventInit",
    "MouseEventInit",
] }
