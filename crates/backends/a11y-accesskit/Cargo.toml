[package]
name = "lumen-a11y-accesskit"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "AccessKit A11yBackend impl: ECS -> TreeUpdate translator + winit adapter wrapper."
keywords = ["ui", "gui", "accessibility", "a11y", "accesskit"]
categories = ["accessibility", "gui"]

[dependencies]
lumen-core = { path = "../../core", version = "0.0.4" }
bevy_ecs.workspace = true
glam.workspace = true
accesskit.workspace = true
accesskit_winit.workspace = true
# The bridge binds AccessKit to a live window, so it names winit directly
# rather than the window backend naming AccessKit. The pin must match both
# accesskit_winit's and the window backend's, or the `Window` handed over at
# the seam is a different type on each side.
winit.workspace = true
