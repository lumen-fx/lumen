[package]
name = "lumen-window-winit"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "winit WindowBackend impl + raw input source."
keywords = ["ui", "gui", "window", "winit", "lumen"]
categories = ["gui", "os"]

[dependencies]
lumen-core = { path = "../../core", version = "0.0.3" }
lumen-text = { path = "../../text", version = "0.0.3" }
lumen-render-wgpu = { path = "../render-wgpu", version = "0.0.3" }
lumen-a11y-accesskit = { path = "../a11y-accesskit", version = "0.0.3" }
# Reads `lumen_assets::ExtractedSvg` to interleave SVGs into the painter
# stream; see lumen-render-wgpu for the same justification.
lumen-assets = { path = "../../assets", version = "0.0.3" }
# Native menu bar: the menu tree itself is `lumen_core::window::MenuModel`
# (it arrives inside `WindowOptions`); this crate is here for the muda
# attach and the click drain.
lumen-os-menu = { path = "../../os/menu", version = "0.0.3" }
bevy_ecs.workspace = true
glam.workspace = true
winit.workspace = true
vello.workspace = true
pollster = "1.0"
thiserror.workspace = true
tracing.workspace = true

[target.'cfg(unix)'.dependencies]
# Graceful SIGINT/SIGTERM: a watcher thread (`signal_hook::iterator`)
# forwards the first signal into the winit loop as a close request so
# script/native `on_close` hooks run and teardown stays orderly; the
# second signal force-exits with the conventional `128 + signo` code.
# Only the thin frontend is new - `signal-hook-registry` was already in
# the dependency tree via tokio's `signal` feature.
signal-hook = { version = "0.4", default-features = false, features = ["iterator"] }

[target.'cfg(target_os = "macos")'.dependencies]
raw-window-handle = "0.6"

[target.'cfg(target_os = "windows")'.dependencies]
raw-window-handle = "0.6"
# Ctrl+C / Ctrl+Break / console-close -> graceful close request, mirroring
# the Unix SIGINT/SIGTERM watcher (SetConsoleCtrlHandler under the hood).
ctrlc = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
# Reads the desktop's color-scheme preference via
# `org.freedesktop.portal.Settings` (the standard XDG Settings portal).
# Best-effort: when the portal daemon is missing (CI, headless
# containers) the spawn returns early and the runtime falls back to the
# `winit::WindowEvent::ThemeChanged` path (which on Linux only fires on
# some compositors). See `WinitHandler::resumed`.
#
# Feature choice: `async-io` (NOT `tokio`). zbus feature unification is
# workspace-wide - with `ashpd/tokio`, every zbus consumer in the final
# binary is forced onto the tokio executor, and zbus consumers living on
# plain threads (accesskit_unix's AT-SPI adapter thread; notify-rust /
# ksni are at the same risk) panic at startup with "there is no reactor
# running, must be called from the context of a Tokio 1.x runtime"
# (zbus executor.rs), killing Linux a11y in every app. With `async-io`,
# zbus drives its own reactor and works from any thread / executor;
# the subscription future below still runs happily on the shared tokio
# runtime because it is executor-agnostic.
ashpd = { version = "0.13", default-features = false, features = ["async-io", "settings"] }
# The portal subscription runs on its own dedicated thread via
# `pollster::block_on` - ashpd/async-io futures are executor-agnostic
# and drive through async-io's global reactor, so no shared tokio
# runtime is required (and none is assumed: the default lumenc stack
# installs no TokioRuntime resource).
futures-util = { version = "0.3", default-features = false }
