[package]
name = "lumen-render-wgpu"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "WGPU renderer backend (Vulkan/Metal/DX12)."
keywords = ["ui", "gui", "rendering", "wgpu", "vello"]
categories = ["rendering", "gui"]

[dependencies]
lumen-core = { path = "../../core", version = "0.0.3" }
lumen-text = { path = "../../text", version = "0.0.3" }
# `lumen-assets` owns ExtractedSvg + LoadedSvg because their cached
# vello::Scene keeps the vello dep out of `lumen-core`. The renderer
# reads them like any other Extracted* component.
lumen-assets = { path = "../../assets", version = "0.0.3" }
bevy_ecs.workspace = true
glam.workspace = true
# vello re-exports wgpu (`vello::wgpu`) so code never drifts the version.
# `default-features = false, features = ["wgpu"]` (set at workspace level)
# drops vello's `wgpu_default` alias -- see the direct per-OS `wgpu` dep
# below, which owns the single-backend selection.
vello.workspace = true
pollster = "1.0"
thiserror.workspace = true
# Bounded LRU for the scene-fragment cache (T1.3). Same crate text-
# cosmic uses; cheap, pure-Rust.
lru = "0.18"
# FxHasher for the scene-fragment cache's per-key hasher (trusted keys).
rustc-hash.workspace = true

# Part A (runtime-tree-shaking): ONE direct, target-scoped `wgpu` dep that
# owns the backend selection. Because cargo unifies features as a union,
# vello's `wgpu = [std, wgsl]` plus exactly one native backend below resolves
# wgpu to that single backend per OS -- naga then compiles only that OS's
# shader-output generator (spv-out on Linux, msl-out on macOS, hlsl-out on
# Windows) instead of all four. `std` + `parking_lot` are the non-web runtime
# basics; `wgsl` is mandatory (vello ships WGSL shader source -> naga/wgsl-in).
# The GL backend (`gles` -> glow + khronos-egl + naga/glsl-out) is opt-in via
# the off-by-default `gl-fallback` feature for a compat build target.
[target.'cfg(target_os = "linux")'.dependencies]
wgpu = { workspace = true, features = ["std", "parking_lot", "vulkan", "wgsl"] }

[target.'cfg(target_os = "macos")'.dependencies]
wgpu = { workspace = true, features = ["std", "parking_lot", "metal", "wgsl"] }

[target.'cfg(target_os = "windows")'.dependencies]
wgpu = { workspace = true, features = ["std", "parking_lot", "dx12", "wgsl"] }

[features]
# Compat build: re-add the OpenGL/GLES backend (glow + khronos-egl +
# naga/glsl-out) and the explicit `Backends::GL` fallback instance in
# `new_offscreen_async`. Off by default: the shipped per-OS release trims to
# the native backend only. Enable for ancient GPUs, GL-only VMs, or
# Vulkan-less headless containers.
gl-fallback = ["wgpu/gles"]

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
lumen-layout-taffy = { path = "../layout-taffy" }
lumen-text-cosmic = { path = "../text-cosmic" }
