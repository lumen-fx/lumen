[package]
name = "lumen-mcp"
description = "Runtime introspection plugin for Lumen - exposes a JSON-RPC TCP server for MCP clients."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
lumen-core = { path = "../core" }
lumen-primitives = { path = "../primitives" }
lumen-assets = { path = "../assets" }
lumen-render-headless = { path = "../backends/render-headless" }
bevy_ecs.workspace = true
glam.workspace = true
tokio = { version = "1.52", features = ["rt-multi-thread", "net", "io-util", "io-std", "sync", "macros", "time"] }
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
image.workspace = true
base64.workspace = true
