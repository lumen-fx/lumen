[package]
name = "lumen-mcp"
description = "Runtime introspection plugin for Lumen - exposes a JSON-RPC TCP server for MCP clients."
keywords = ["ui", "gui", "mcp", "introspection", "lumen"]
categories = ["development-tools", "gui"]
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
# Not published: `lumenc` and `lumenui` are the only crates.io packages.
publish = false

[dependencies]
lumen-core = { workspace = true }
lumen-primitives = { workspace = true }
lumen-assets = { workspace = true }
bevy_ecs.workspace = true
glam.workspace = true
tokio = { version = "1.52", features = ["rt-multi-thread", "net", "io-util", "io-std", "sync", "macros", "time"] }
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
image.workspace = true
base64.workspace = true
