[package]
name = "lumen-widget-macros"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "#[derive(Widget)] proc-macro - generates Plugin + spawn glue for lumen-widget."
keywords = ["ui", "gui", "widgets", "macros", "derive"]
categories = ["gui", "development-tools"]
# Not published: `lumenc` and `lumenui` are the only crates.io packages.
publish = false

[lib]
proc-macro = true

[dependencies]
syn = { version = "3", features = ["full"] }
quote = "1"
proc-macro2 = "1"

[dev-dependencies]
lumen-widget = { workspace = true }
lumen-core = { workspace = true }
bevy_ecs.workspace = true
