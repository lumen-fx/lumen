[package]
name = "lumen-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Lumen runtime core: winit/ECS run loop, default plugin stack, hot reload, file-based pages, and app loaders. Parser-free (injected via SourceParser)."
keywords.workspace = true
categories.workspace = true

[lib]
name = "lumen_runtime"
path = "src/lib.rs"

[dependencies]
lumen-core = { path = "../core", version = "0.0.3" }
# Runtime-shared IR (LayoutIR, CSS AST + Cascade-5 application, value parsers,
# `var()` resolver, AOT artifact). The runtime consumes it directly; the
# markup/CSS front-end that PRODUCES it stays in `lumenc` and is injected via
# `SourceParser`.
lumen-ir = { path = "../ir", version = "0.0.3" }
lumen-primitives = { path = "../primitives", version = "0.0.3" }
lumen-assets = { path = "../assets", version = "0.0.3" }
# Translation catalogues + locale-aware formatters. The runtime resolves the
# app's locale, loads `locale/*.ftl`, and publishes the translator that
# `translatable="..."` markup and the scripts' `t()` builtin read.
lumen-i18n = { path = "../i18n", version = "0.0.3" }
bevy_ecs.workspace = true
glam.workspace = true
thiserror.workspace = true

# Default plugin stack + OS surface crates the run loop wires.
lumen-input = { path = "../input", version = "0.0.3" }
lumen-os-clipboard = { path = "../os/clipboard", version = "0.0.3" }
lumen-os-dnd = { path = "../os/dnd", version = "0.0.3" }
lumen-os-filedialog = { path = "../os/filedialog", version = "0.0.3" }
lumen-os-tray = { path = "../os/tray", version = "0.0.3" }
lumen-os-notify = { path = "../os/notify", version = "0.0.3" }
lumen-os-hotkey = { path = "../os/hotkey", version = "0.0.3" }
lumen-os-launcher = { path = "../os/launcher", version = "0.0.3" }
lumen-os-power = { path = "../os/power", version = "0.0.3" }
# Async spawn/timer bridge (tokio rt-multi-thread). Part B tree-shaking:
# OPTIONAL behind the `async` feature. File dialogs resolve on this runtime,
# so the run loop installs `AsyncTokioPlugin` for an app that opens them; a
# trimmed bundle drops the crate and falls back to the blocking path.

lumen-async-tokio = { path = "../backends/async-tokio", optional = true }
# Audio capability: the transport model + the `AudioBackend` trait, with no
# device and no decoder behind it. Part B: OPTIONAL behind `audio`.
lumen-audio = { path = "../audio", optional = true }
# The audio backend Lumen ships (rodio + cpal + symphonia). OPTIONAL behind
# `audio-rodio`; without it the audio systems run against the silent backend.
lumen-audio-rodio = { path = "../backends/audio-rodio", optional = true }
# The HTTP client the scripts' `fetch()` / `http()` builtins run on. OPTIONAL
# behind `http-fetch`; without it the builtins report that no client is
# installed, and an embedder can install its own `lumen_script::HttpClient`.
lumen-http-ureq = { path = "../backends/http-ureq", version = "0.0.3", optional = true }
lumen-layout-taffy = { path = "../backends/layout-taffy" }


# Script hosts. Every host is a Part B tree-shaking knob, OPTIONAL behind
# `host-rhai` / `host-lua` / `host-candela`, so a bundle links exactly the
# languages its app ships.
lumen-script = { path = "../script/api", version = "0.0.3", default-features = false }
lumen-script-rhai = { path = "../script/rhai", version = "0.0.3", default-features = false, optional = true }
rhai = { workspace = true, optional = true }
lumen-script-lua = { path = "../script/lua", version = "0.0.3", default-features = false, optional = true }
lumen-script-candela = { path = "../script/candela", version = "0.0.3", default-features = false, optional = true }
mlua = { workspace = true, optional = true }

lumen-text-cosmic = { path = "../backends/text-cosmic", version = "0.0.3" }
lumen-text = { path = "../text", version = "0.0.3" }
lumen-window-winit = { path = "../backends/window-winit", version = "0.0.3" }
# The renderer, on screen and off: the windowed path attaches the surface
# renderer to the winit window, and `run --headless` drives the offscreen one
# through the same Node-IR walker.
lumen-render-wgpu = { path = "../backends/render-wgpu", version = "0.0.3" }
# Accessibility. The window backend drives whatever bridge it is handed;
# picking AccessKit is this crate's call, as the composition point.
lumen-a11y-accesskit = { path = "../backends/a11y-accesskit", version = "0.0.3" }
# MCP introspection server (tokio + serde_json + http). Part B: OPTIONAL
# behind `mcp`. Dev-only; lumenc never infers it into a release bundle.
lumen-mcp = { path = "../mcp", version = "0.0.3", optional = true }
# Dev-only in-window devtools overlay. Optional + gated behind the off-by-
# default `devtools` feature.
lumen-devtools = { path = "../dev/devtools", version = "0.0.3", optional = true }

# Hot-reload file watching (inotify / FSEvents / ReadDirectoryChangesW).
notify.workspace = true

# Per-app config (lumen.toml) + app-kind detection.
toml.workspace = true
serde.workspace = true
serde_json.workspace = true

# Clipboard image decode (script `image` clipboard commands).
image.workspace = true

tracing.workspace = true
# Dev-mode profiler stack (see [features]).
tracing-subscriber = { workspace = true, features = ["env-filter"], optional = true }
tracing-chrome = { workspace = true, optional = true }
tracing-tracy = { version = "0.11", optional = true, features = [
    "manual-lifetime",
    "delayed-init",
] }

# Headless mode graceful shutdown (SIGINT/SIGTERM). Unix-only.
[target.'cfg(unix)'.dependencies]
signal-hook.workspace = true

# Windows: Ctrl+C / console-close -> headless exit flag.
[target.'cfg(windows)'.dependencies]
ctrlc.workspace = true

[features]
# The DEFAULT set is FULL: the shared dlopen'd `liblumen` cdylib and the
# dev `lumenc run` path build with every subsystem so one shared library serves
# every app. Per-app trimming happens ONLY on the static `--bundle` path, where
# lumenc selects `--no-default-features --features "<resolved capabilities>"`.
default = [
    "http-fetch",
    "runtime-parse",
    "audio-rodio",
    "mcp",
    "async",
    "host-rhai",
    "host-lua",
    "host-candela",
]
# Audio subsystem: the transport, the player entity, and the script transport
# commands, against whichever backend is selected. Part B tree-shaking knob.
audio = ["dep:lumen-audio"]
# The audio backend Lumen ships (rodio/cpal/symphonia), and the one the default
# build selects. Turn it off and the audio subsystem runs silent, which is what
# an app that supplies its own backend wants.
audio-rodio = ["audio", "dep:lumen-audio-rodio"]
# MCP introspection server. Part B tree-shaking knob (dev-only capability).
mcp = ["dep:lumen-mcp"]
# Async spawn/timer (tokio) bridge. Part B tree-shaking knob.
async = ["dep:lumen-async-tokio"]
# Script hosts. Each one ADDS a language, so a bundle can carry exactly the
# hosts its app uses. All three are on by default.
host-rhai = ["dep:lumen-script-rhai", "dep:rhai"]
host-lua = ["dep:lumen-script-lua", "dep:mlua"]
host-candela = ["dep:lumen-script-candela"]
# Dev-only in-window devtools overlay (F12). OFF by default.
devtools = ["dep:lumen-devtools"]
# The HTTP client behind the scripts' `fetch(url, tag)` / `http(#{...})`
# builtins, and the one the default build selects. On by default; a packager
# size knob, since ureq's rustls+ring stack is about a megabyte of release
# .text. Turn it off and both builtins still parse and queue, but every request
# resolves to `on_fetch_error(tag, "...built without the http-fetch
# feature...")` - which is also the build an embedder starts from when it
# installs its own `HttpClient`.
http-fetch = ["dep:lumen-http-ureq"]
# Compile the from-source load path (dev source-load + hot reload). ON by
# default. Unlike the old lumenc feature this carries NO parser dependency -
# the parser is injected via `SourceParser` - it only gates the load-from-
# source CODE so a runtime that only loads precompiled AOT artifacts can drop
# it (`--no-default-features`).
runtime-parse = []
# `--profile chrome|stderr` support.
profiling = [
    "dep:tracing-subscriber",
    "dep:tracing-chrome",
    "bevy_ecs/trace",
    "bevy_ecs/debug",
]
# `--profile tracy` on top of `profiling`.
profiling-tracy = ["profiling", "dep:tracing-tracy"]
