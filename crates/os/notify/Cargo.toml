[package]
name = "lumen-os-notify"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Desktop-notification host for Lumen (notify-rust wrapper, Action-based buttons, NotificationActionInvoked message). QSystemTrayIcon::showMessage / GNotification analog."
keywords = ["ui", "gui", "notification", "desktop", "lumen"]
categories = ["os", "gui"]
# Not published: `lumenc` and `lumenui` are the only crates.io packages.
publish = false

[dependencies]
lumen-core = { workspace = true }
lumen-os-mime = { workspace = true }
bevy_ecs.workspace = true
tracing.workspace = true

# Cross-platform notifications: libnotify (Linux/BSD),
# NSUserNotificationCenter (macOS), Toast (Windows).
notify-rust = "4"
