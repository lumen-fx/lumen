[package]
name = "lumen-os-tray"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "System tray host for Lumen (tray-icon wrapper, MenuModel from lumen-os-menu, TrayClicked / TrayDoubleClicked / TrayMenuClicked messages). QSystemTrayIcon / AppIndicator analog."

[dependencies]
lumen-core = { path = "../../core" }
lumen-os-mime = { path = "../mime" }
bevy_ecs.workspace = true
image.workspace = true
tracing.workspace = true

# tray-icon's Linux backend pulls libxdo-dev; target-gate to macOS +
# Windows.
[target.'cfg(target_os = "macos")'.dependencies]
tray-icon = { version = "0.24", default-features = false }

[target.'cfg(target_os = "windows")'.dependencies]
tray-icon = { version = "0.24", default-features = false }

# Linux: ksni is a pure-Rust StatusNotifierItem implementation. Speaks
# the KDE-original SNI D-Bus protocol; GNOME requires the
# AppIndicator/KStatusNotifierItem Support extension to show the tray
# icon (documented on the crate-level doc-comment).
#
# `default-features = false` + `async-io` matters: ksni's default `tokio`
# feature enables `zbus/tokio` for the whole binary (cargo feature
# unification), which forces every zbus consumer onto the tokio executor
# and panics zbus users on plain threads (accesskit_unix's AT-SPI adapter:
# "there is no reactor running, must be called from the context of a
# Tokio 1.x runtime") - killing Linux a11y in every app. With `async-io`,
# zbus drives its own reactor; ksni's blocking API works with either.
[target.'cfg(target_os = "linux")'.dependencies]
ksni = { version = "0.3", default-features = false, features = ["blocking", "async-io"] }
