[package]
name = "lumen-os-clipboard"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "OS clipboard host (arboard wrapper) for Lumen - MIME-typed read/write, optional PRIMARY selection on Linux."
keywords = ["ui", "gui", "clipboard", "arboard", "lumen"]
categories = ["os", "gui"]

[features]
default = []
# Gate the X11 PRIMARY-selection helpers. arboard 3.x exposes them only on
# the Linux/X11 build; setting this feature requires consumers to opt in.
linux_primary = []

[dependencies]
lumen-os-mime = { path = "../mime", version = "0.0.4" }

# arboard speaks to X11, Wayland, NSPasteboard, and the Win32 clipboard, none
# of which exist in a browser, and it is the one dependency that stops the
# lumen-core -> lumen-script-candela graph from building for wasm32. The host
# still exists on that target; it just reports the backend as unavailable.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
arboard.workspace = true
