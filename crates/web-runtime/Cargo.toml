[package]
name = "lumen-web-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Lumen's browser runtime: boots a Lumen app in a page and runs its candela bytecode."
keywords = ["ui", "gui", "web", "wasm", "lumen"]
categories = ["gui", "wasm"]
publish = false

[lib]
# `cdylib` is the artifact `wasm-bindgen` post-processes into the module a page
# loads; `rlib` is what the browser test harness links against.
crate-type = ["cdylib", "rlib"]

[dependencies]
lumen-core = { path = "../core", version = "0.0.3" }
# The compiled artifact a page fetches, and the emitter/runtime contract that
# says what the files beside it are called.
lumen-ir = { path = "../ir", version = "0.0.3" }
lumen-html = { path = "../html", version = "0.0.3" }
# The IR-to-ECS spawner and the reconcilers, shared with the desktop runtime.
lumen-scene = { path = "../scene", version = "0.0.3" }
# The browser as a render backend: adopting the prerendered document, keeping
# it in step with the world, and turning DOM events into Lumen events.
lumen-web-dom = { path = "../backends/web-dom", version = "0.0.3" }
# The app a page runs, and the script hosts that run its scripts: everything
# about a Lumen app that is not about the platform it runs on.
lumen-portable = { path = "../portable", version = "0.0.3", default-features = false }
lumen-text = { path = "../text", version = "0.0.3" }
lumen-script = { path = "../script/api", version = "0.0.3", default-features = false }
bevy_ecs.workspace = true
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
js-sys.workspace = true
serde_json.workspace = true
# Explicit interface list, not a blanket enable: every named interface is
# generated into the module, so this list is a size lever. Add one only when
# something calls it.
web-sys = { workspace = true, features = [
    "Window",
    "Document",
    "Element",
    "HtmlElement",
    "Location",
    "Response",
    "console",
] }

[build-dependencies]
# Compiles the test fixtures to `.cdlb` at build time, on the host, so the
# artifact the browser loads is always the one this toolchain produces. Build
# dependencies are resolved for the host and never linked into the wasm module,
# so the compiler feature here does not reach the page.
lumen-script-candela = { path = "../script/candela", version = "0.0.3" }

[dev-dependencies]
wasm-bindgen-test.workspace = true

[features]
# The script hosts this module carries. A host is a language, and each one is a
# feature, so a page pays for the languages its app ships and nothing else.
# candela is on by default because it is the only host that runs in a browser
# today: rhai has yet to be wired up here, and lua's C core does not build for
# `wasm32-unknown-unknown` at all.
default = ["host-candela"]
host-candela = ["lumen-portable/host-candela"]
