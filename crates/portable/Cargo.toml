[package]
name = "lumen-portable"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Lumen's platform-free app assembly: the plugins, reconcilers and script hosts that run the same wherever an app runs."
keywords = ["ui", "gui", "lumen", "wasm", "server"]
categories = ["gui"]
publish = false

[dependencies]
lumen-core = { workspace = true }
# The emitter/runtime contract, for the seed a rendered document carries.
lumen-html = { workspace = true }
# The IR-to-ECS spawner and the reconcilers, shared with the desktop runtime.
lumen-scene = { workspace = true }
# The widget behaviour and the focus layer, unchanged from the desktop: what a
# tab strip does when it is clicked is not a per-platform question.
lumen-input = { workspace = true }
lumen-primitives = { workspace = true }
lumen-script = { workspace = true }
# The candela host, behind `host-candela`. The artifact half only: this
# assembly runs precompiled `.cdlb` bytecode, so the candela compiler never
# reaches whatever loads it.
lumen-script-candela = { workspace = true, optional = true }
bevy_ecs.workspace = true

# The browser's own `fetch`, behind the scripts' HTTP builtins. Target-gated
# because it is the transport for exactly one platform: a server assembles the
# same app and wants the native client, which its own composition point
# installs.
[target.'cfg(target_arch = "wasm32")'.dependencies]
lumen-web-http = { workspace = true }

[build-dependencies]
# Compiles the test fixtures to `.cdlb` at build time, on the host, so the
# artifact a host loads is always the one this toolchain produces. Build
# dependencies are resolved for the host and never linked into the library, so
# the compiler feature here does not reach a shipped runtime.
lumen-script-candela = { workspace = true, default-features = true }

[dev-dependencies]
# The compiled app the boot benchmark reads. A running app never needs the
# artifact container, only what came out of it.
lumen-ir = { workspace = true }
# Settling an app and reading the state it settled into is one implementation,
# and the benchmark measures that one rather than a copy of it.
lumen-prerender = { workspace = true, default-features = true }

[[bench]]
name = "boot"
# The benchmark takes compiled apps on the command line, which libtest's
# harness would swallow as filters.
harness = false

[features]
# The script hosts this assembly carries. A host is a language, and each one is
# a feature, so a build pays for the languages its app ships and nothing else.
# candela is on by default because it is the only host that runs from bytecode
# alone: rhai and lua have yet to be wired up here.
default = ["host-candela"]
host-candela = ["dep:lumen-script-candela"]
