# The expansion half of `lumen-capability`. Separate because the crate that
# names a capability keeps `#![forbid(unsafe_code)]` and still has to export
# an entry the linker can find by name: the unsafe attributes that spell that
# name out come from here.
#
# Authors depend on `lumen-capability`, which re-exports the macro; nothing
# takes this crate directly.
[package]
name = "lumen-capability-macros"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "The lumen_capability! macro: registers an optional runtime subsystem before main and gives the linker a symbol to select it by."
keywords.workspace = true
categories.workspace = true
publish = false

[lib]
proc-macro = true

[dependencies]
syn = { version = "3", features = ["full"] }
quote = "1"
proc-macro2 = "1"
