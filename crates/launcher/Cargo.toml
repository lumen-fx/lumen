[package]
name = "lumen-launcher"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Lumen app launcher: the executable stub `lumenc package` turns into a shippable app."
keywords = ["ui", "gui", "launcher", "packaging", "lumen"]
categories = ["gui", "command-line-utilities"]

[[bin]]
name = "lumen-launcher"
path = "src/main.rs"

[dependencies]
# The dlopen seam only. `default-features = false` matters: a default lumenc
# links the whole runtime (wgpu / winit / cosmic-text / the script hosts), and
# the stub must carry none of it - it finds liblumen beside itself at run time.
# Check with `cargo tree -p lumen-launcher` after any dependency change.
lumenc = { path = "../lumenc", version = "0.0.3", default-features = false, features = [
    "dlopen-run",
] }
