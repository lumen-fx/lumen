[package]
name = "lumen-devtools"
description = "Dev-only in-window devtools overlay for Lumen (Elements/Signals+Perf/Network)."
keywords = ["ui", "gui", "devtools", "inspector", "lumen"]
categories = ["development-tools", "gui"]
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

# Dev-only crate: never linked into a release / bundle build. lumenc pulls
# it in only behind its own `devtools` feature (off by default), which
# `lumenc run` enables in the dev loop.

[dependencies]
lumen-core = { path = "../../core", version = "0.0.3" }
# Snapshot data model + the snap_* builder pipeline that populates it. The
# overlay reads the shared `SnapshotHandle` resource in-process; it never
# stands up the TCP/MCP server.
lumen-mcp = { path = "../../mcp", version = "0.0.3" }
bevy_ecs.workspace = true
glam.workspace = true
