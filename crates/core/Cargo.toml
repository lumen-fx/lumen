[package]
name = "lumen-core"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Lumen UI framework core: tick loop, ECS, command queue, backend traits."
keywords.workspace = true
categories.workspace = true

[dependencies]
# Core runtime/storage primitives only. No backend (render/window/text/script) deps.
# Hierarchy lives in bevy_ecs::hierarchy. No bevy_hierarchy crate.
bevy_ecs.workspace = true
bevy_tasks.workspace = true
crossbeam-channel.workspace = true
glam.workspace = true
thiserror.workspace = true
# A11y state flags (mirrors GTK4 / Qt6 state bus). Already a transitive dep
# via wgpu/winit/accesskit so no new code joins the tree.
bitflags = "2"
# Small inline buffer for a11y relations (labelled_by, controls, owns).
# Most entities carry zero or one relation; inline 2 keeps it heap-free.
# Already a transitive dep via wgpu/cosmic-text/etc.
smallvec = "1"
# W3.1: rope buffer for editable text.
ropey.workspace = true
# W3.1: grapheme cluster iteration for TextPos.
unicode-segmentation.workspace = true
# Window/display handle vocabulary for the `RenderTarget` seam: the window
# backend hands the renderer a handle, and both sides name these types
# instead of each other. Types and two traits only, no platform code and no
# graphics API, so the "no backend deps" rule holds. Already in the tree via
# wgpu and winit, which speak the same version.
raw-window-handle = "0.6"

[dev-dependencies]
proptest.workspace = true
