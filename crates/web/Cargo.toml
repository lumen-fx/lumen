[package]
name = "lumen-web"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Emits a Lumen app as a static site: one HTML document per page, plus the manifest the browser runtime boots from."
keywords = ["ui", "gui", "html", "web", "lumen"]
categories = ["web-programming", "gui"]
# Not published: `lumenc` and `lumenui` are the only crates.io packages.
publish = false

[lib]
name = "lumen_web"
path = "src/lib.rs"

[dependencies]
# The contract the emitted documents are written against.
lumen-html = { workspace = true }
# The IR a page is emitted from.
lumen-ir = { workspace = true }
lumen-core = { workspace = true }
# A bound value is held to the bounds its widget holds it to, and the widget
# owns that rule. Already in the graph under lumen-ir, which converts the IR
# into these components.
lumen-primitives = { workspace = true }
# Locale parsing, so a document's writing direction is decided the same way
# the desktop runtime decides it.
lumen-i18n = { workspace = true }
serde.workspace = true
serde_json.workspace = true
