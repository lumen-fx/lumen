[package]
# The Rust SDK's code. Apps depend on `lumenui` (public/lumenui/rust), which a
# release publishes: that crate re-exports this one from a prebuilt copy,
# compiled once per target by the release (tools/release/lumenui-engine.py), so
# an app links the engine without compiling it. Not published itself.
name = "lumenui-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Lumen UI framework Rust SDK, the engine side: what the published lumenui crate re-exports."
keywords = ["ui", "gui", "framework", "desktop", "sdk"]
categories = ["gui"]
publish = false

[lib]
# Not `lumenui`: the published crate of that name says `extern crate
# lumenui_engine`, and a crate cannot name a dependency that shares its own
# library name.
name = "lumenui_engine"

# The engine: everything the SDK is written against - the runtime, the ECS
# app, the DOM surface, the widget trait, `bevy_ecs` itself - is reached
# through it rather than depended on again, so an app gets exactly one copy
# of each. A second path to any of them would compile a second copy, and two
# copies of, say, `lumen-core` are two different types to the compiler with
# two different signal stores behind them.
#
# Which engine crate differs by platform. `lumen-dylib` is the engine crate
# that also builds as a shared library; Windows has no such crate - its linker
# cannot produce the library at all, see public/lumen-dylib/Cargo.toml - so
# there the engine crate is named directly. An app links either one
# statically: the prebuilt set the published `lumenui` points the compiler at
# holds the compiled crates (`.rlib`), not the shared library, and `lumenc
# run`, `build` and `package` build a Rust app with plain cargo.
#
# The parser and compiler front-end (`lumenc`, a library here) sits outside
# the shared engine - the `lumenc` binary is itself a consumer of the engine
# library, and a crate cannot be on both sides of a dylib. It is small, its
# heavy dependencies resolve into the engine, and it compiles into the app
# beside the SDK's own code.
[target.'cfg(not(windows))'.dependencies]
lumen-dylib = { workspace = true }
lumenc = { workspace = true, features = ["runtime-parse", "dev-run"] }

[target.'cfg(windows)'.dependencies]
lumen = { workspace = true }

[dependencies]
# The math types the engine's components and messages carry (a click's
# `position` is a `Vec2`), re-exported so an app names them through the SDK.
# The same crate the engine resolves, not a second copy: one version, one
# workspace pin.
glam.workspace = true
# PNG encode and decode for `Frame`, the screenshot type. The engine already
# links this crate for its own screenshots and clipboard images, so this is
# the same copy, not a second one.
image.workspace = true
