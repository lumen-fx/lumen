# The authoring side of runtime modules: what a module crate depends on,
# whether its library gets opened or its rlib gets linked in. Small on
# purpose - the macro, the config wrapper, and the re-exports an author
# writes against; the loading half lives in `lumen-modules` inside the
# engine.
[package]
name = "lumen-module"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Lumen runtime-module SDK: implement the Plugin trait, export it with lumen_module!, ship it as a version-locked dylib or compile it in."
keywords.workspace = true
categories.workspace = true
publish = false

[dependencies]
lumen-core = { workspace = true }
# The expansion behind `lumen_module!`, re-exported so a module crate keeps
# one dependency. A proc macro rather than a `macro_rules!` because the
# exported entries carry the module's own name, which means building symbol
# names from a string the caller passes.
lumen-module-macros = { workspace = true }
# Where the generated pre-main constructor leaves the module when it is
# linked into a binary rather than opened as a library.
lumen-module-registry = { workspace = true }
# The byte-source seam a module reads app data through: `AssetServer` and
# `SourceReader`, re-exported so a module resolves bundled and registered
# sources instead of assuming the raw filesystem.
lumen-assets = { workspace = true }
# The script-surface types a module registers through: `ScriptFn`, the
# registry extension trait, the ordering sets, and the plugin-event wire.
# Re-exported below so a module crate needs no dependency of its own.
lumen-script = { workspace = true }
# The markup-tag registry. A module that brings an element registers its tag
# from `Plugin::build`, which is what makes a run accept the markup; the
# `tags` key in `lumen.toml` is the same claim for a compile, where nothing is
# loaded.
lumen-widget = { workspace = true }
serde = { workspace = true }
toml = { workspace = true }

# The painting surface, behind the off-by-default `paint` feature. These are
# the engine's own renderer and text crates, not a second copy: a module
# hands the painter a `vello::Scene` and the downcast that receives it is a
# `TypeId` match, which only holds when both sides mean the same vello. The
# workspace's one resolution is what makes them the same, and the release
# build compiles the engine and its modules in one invocation so cargo's
# feature unification cannot pull them apart.
lumen-render-wgpu = { workspace = true, optional = true }
lumen-text = { workspace = true, optional = true }

# The engine as a linkable dylib: depending on it is what resolves
# `lumen-core` (and everything else the module touches) into the shared
# engine instance instead of a second static copy, and what records the
# module's `NEEDED` entry on `liblumen_engine`. Windows has no such library
# (see public/lumen-dylib/Cargo.toml), so the entries that need it are absent
# there whatever the feature says.
[target.'cfg(not(windows))'.dependencies]
lumen-dylib = { workspace = true, optional = true }

[features]
default = ["engine-dylib"]
# The shared engine, and with it the probe-and-install pair a loader looks up
# after opening a module's library. A module that is only ever linked into a
# binary drops the feature and stops anchoring the engine dylib; what it
# registers before `main` is unaffected.
engine-dylib = ["dep:lumen-dylib", "lumen-module-macros/engine-dylib"]

# Painting: the vello scene a native painter draws into, and the text shaper
# it shapes through. Off by default, because most modules never paint and
# would otherwise carry the whole renderer in their graph.
paint = ["dep:lumen-render-wgpu", "dep:lumen-text"]

[dev-dependencies]
# The end-to-end harness parses cargo's JSON artifact messages to find the
# fixture module, the dylib-linked host runner, and the engine library.
serde_json = { workspace = true }

