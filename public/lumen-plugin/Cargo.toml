[package]
name = "lumen-plugin"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "SDK for Lumen runtime plugins: the RuntimePlugin trait and the C-ABI export macro."
# Published as a bundle rather than from here: tools/release/bundle-crate.py
# writes this crate out with the source of the Lumen crates it uses, none of
# which is on crates.io, and publish.yml uploads that package.
publish = false

[lib]
name = "lumen_plugin"
path = "src/lib.rs"

[features]
default = []
# The loader side: dlopen a plugin cdylib, verify its descriptor, run its
# init, and bind what it registered onto an app. Only the runtime enables
# this; plugin authors never do.
#
# The loader takes paths that are already resolved, so nothing about the
# registry reaches its dependency graph.
host = ["dep:libloading", "lumen-plugin-abi/dlopen"]
# Test-only helper that builds the fixture plugin cdylib once per tree.
testing = ["dep:serde_json"]

[dependencies]
lumen-core = { workspace = true }
lumen-plugin-abi = { workspace = true }
lumen-script = { workspace = true }
serde = { workspace = true }
toml = { workspace = true }
thiserror = { workspace = true }
libloading = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }

[dev-dependencies]
lumen-plugin = { workspace = true, features = ["host", "testing"] }
# A built compiler plugin, as the wrong kind of cdylib to point the runtime
# loader at.
lumenc-plugin = { workspace = true, features = ["testing"] }
toml = { workspace = true }
