# The engine as a library a Rust program can link, rather than open.
#
# Lives beside the Rust SDK because the SDK was its first consumer; today the
# shipped `lumenc` and `liblumen` link it too (their `dynamic-engine`
# feature), which is what lets one engine instance serve the process and the
# runtime modules it dlopens. Beside the SDK rather than inside it: a
# workspace cannot exclude a directory that sits within one of its members,
# because the member owns its whole subtree, and being excluded is the point.
#
# The dependency list below IS the engine: the runtime with every shipped
# subsystem turned on, plus the crates the SDK surface re-exports. It names
# the engine's pieces directly - never the root `lumen` crate or `lumenc` -
# because those two are consumers of this library: `liblumen` and the `lumenc`
# binary link it under their `dynamic-engine` feature, and a dependency in
# either direction from here would close a package cycle. What they add on
# top (the C ABI, the parser and CLI) is compiled into them, not into the
# shared engine.
#
# The feature set of `lumen-runtime` (and the `compiler` default of
# `lumen-script-candela`) is pinned to the union the shipped binaries enable.
# A runtime module is only loadable against an engine built from the same
# graph, so this list changing is an engine-ABI event, not a tidy-up.
#
# Deliberately NOT a member of the workspace, and reached only through
# `cfg(not(windows))` dependencies. Both facts are load-bearing:
#
#   - A `dylib` exports every symbol of the crate graph behind it. On Windows
#     the import library that describes those exports caps at 65535 entries,
#     and this graph is far past it, so linking one there fails outright
#     (LNK1189). Keeping it out of `members` is what stops a plain
#     `cargo build --workspace` from trying.
#   - Off Windows it is an ordinary dependency of the Rust SDK, so it is built
#     with the rest of the workspace and nothing has to be asked for.
#
# `version`, `edition` and the rest are spelled out rather than inherited,
# because a package outside the workspace cannot inherit from it.
# Its own workspace root as well as being excluded from the one above. The
# exclusion is what keeps it out of `cargo build --workspace`; this table is
# what answers a tool that walks path dependencies and resolves this manifest
# on its own (`cargo fmt --all`), which would otherwise keep searching upwards
# for a workspace that claims it. Safe only because nothing above this
# directory is a workspace member - inside a member's subtree the two roots
# collide.
[workspace]

[package]
name = "lumen-dylib"
version = "0.0.6"
edition = "2024"
license = "MPL-2.0"
authors = ["Lumen contributors"]
repository = "https://github.com/lumen-fx/lumen"
rust-version = "1.85"
description = "Lumen engine as a linkable shared library, for Rust apps that link the runtime rather than compile it in."
publish = false

[lib]
# Not `lumen`: the engine crate's own cdylib already writes `liblumen.so` into
# the same directory, and two targets cannot produce one file name. The name
# here is the one a packaged Rust app carries and asks its loader for.
name = "lumen_engine"
# Both forms. With `lib` present, a plain `cargo build` takes the rlib and the
# app links the engine statically, which is what a developer running `cargo
# run` wants and what Windows gets. `-C prefer-dynamic` takes the `dylib`
# instead, which is what `lumenc build` and `lumenc package` pass.
crate-type = ["lib", "dylib"]

[dependencies]
# The runtime, with the full shipped subsystem set: the union of what the
# `lumenc` binary (dev-run + devtools) and `liblumen` (the default shared
# library) enable, so the one engine those builds share is the same engine a
# standalone build of this crate produces.
lumen-runtime = { path = "../../crates/runtime", default-features = false, features = [
    "runtime-parse",
    "http-fetch",
    "mcp",
    "async",
    "modules",
    "host-rhai",
    "host-lua",
    "host-candela",
    "devtools",
] }
# The rest of the SDK surface, re-exported through `sdk` below.
lumen-core = { path = "../../crates/core" }
lumen-script = { path = "../../crates/script/api", default-features = false }
lumen-widget = { path = "../../crates/widget" }
lumen-widget-macros = { path = "../../crates/widget-macros" }
# Same spec as the workspace pin; spelled out because this manifest cannot
# inherit it.
bevy_ecs = { version = "0.19", default-features = false, features = [
    "multi_threaded",
] }
rhai = { version = "1.24", features = ["sync"] }
# Not re-exported: named to pin its `compiler` default into the engine build,
# because the `lumenc` binary enables it and a module built against an engine
# without it would resolve nothing. See the feature-pinning note above.
lumen-script-candela = { path = "../../crates/script/candela", default-features = true }
