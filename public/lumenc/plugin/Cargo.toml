[package]
name = "lumenc-plugin"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "SDK for lumenc compiler plugins: the CompilerPlugin trait and the C-ABI export macro."
# Published as a bundle rather than from here: tools/release/bundle-crate.py
# writes this crate out with the source of the Lumen crates it uses, none of
# which is on crates.io, and publish.yml uploads that package.
publish = false

[lib]
name = "lumenc_plugin"
path = "src/lib.rs"

[features]
default = []
# The loader side: dlopen a plugin cdylib, verify its descriptor, and drive
# its hooks. Only lumenc enables this; plugin authors never do. The loader
# takes paths that are already resolved, so nothing here reaches the registry.
host = ["dep:libloading", "lumen-plugin-abi/dlopen"]
# Test-only helper that builds the fixture plugin cdylib once per tree.
testing = ["dep:serde_json"]

[dependencies]
lumen-ir = { workspace = true }
lumen-plugin-abi = { workspace = true }
serde = { workspace = true }
toml = { workspace = true }
thiserror = { workspace = true }
libloading = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }

[dev-dependencies]
lumenc-plugin = { workspace = true, features = ["host", "testing"] }
toml = { workspace = true }
