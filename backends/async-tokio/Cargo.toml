[package]
name = "lumen-async-tokio"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "tokio Spawn + Timer impl."
keywords = ["ui", "gui", "async", "tokio", "lumen"]
categories = ["asynchronous", "gui"]
# Not published: `lumenc` and `lumenui` are the only crates.io packages.
publish = false

[dependencies]
# The optional-subsystem entry this crate registers itself through.
lumen-capability = { workspace = true }
# Only for the names of the builtins whose use is what asks for an executor.
lumen-script = { workspace = true }
lumen-core = { workspace = true }
bevy_ecs.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time", "fs", "net"] }
crossbeam-channel.workspace = true
tracing.workspace = true
