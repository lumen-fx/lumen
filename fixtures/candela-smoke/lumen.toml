# Proof fixture for runtime script-host selection: the external `main.cdl` is
# run by the candela host module the runtime loads for a `.cdl` file, and
# exercises `.cdl` script loading plus the scalar `host "lumen" { ... }`
# builtin surface (signal_set / on).

# No introspection server - keeps `--headless` CI runs from binding a port.
[mcp]
port = 0
