# Proof fixture for target-specific script code. The app depends on the
# `greet` module beside it, which has only a web half, for its web build only,
# and its script reaches the module only in code compiled for the web; the desktop build compiles the
# other side of each `@cfg(...)` instead. The label shows which side ran.
[script]
engine = "candela"

[target.web.dependencies]
greet = { path = "greet" }

# No introspection server, so a `--headless` run binds no port.
[mcp]
port = 0
