# Proof fixture for prehydration in more than one language. The script writes
# a status line through `t()` while it starts, so a page written from a run
# reads in the language that run was in.
[script]
engine = "candela"

[web]
locales = ["en-US", "de-DE"]
prerender = "run"

# No introspection server, so a headless CI run binds no port.
[mcp]
port = 0
