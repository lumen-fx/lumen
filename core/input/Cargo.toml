[package]
name = "lumen-input"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Focus tracker, hit-test, event dispatch. Consumes WindowBackend events."
keywords = ["ui", "gui", "input", "events", "focus"]
categories = ["gui"]
# Not published: `lumenc` and `lumenui` are the only crates.io packages.
publish = false

[dependencies]
lumen-core = { workspace = true }
lumen-os-clipboard = { workspace = true }
lumen-text = { workspace = true }
bevy_ecs.workspace = true
glam.workspace = true

[dev-dependencies]
bevy_ecs.workspace = true
glam.workspace = true
# D4/D8 integration tests drive the real shaper to build `ShapedText`
# geometry (proportional-font hit-test, IME caret rect). Dev-only: the
# runtime deps stay shaper-free.
lumen-text-cosmic = { workspace = true }
