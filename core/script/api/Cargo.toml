[package]
name = "lumen-script"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Scripting backend trait (ScriptHost, StateProxy)."
keywords = ["ui", "gui", "scripting", "host", "lumen"]
categories = ["gui"]
# Not published: `lumenc` and `lumenui` are the only crates.io packages.
publish = false

[dependencies]
lumen-core = { workspace = true }
lumen-ir = { workspace = true }
lumen-input = { workspace = true }
lumen-primitives = { workspace = true }
lumen-os-dnd = { workspace = true }
bevy_ecs.workspace = true
crossbeam-channel.workspace = true
glam.workspace = true
# Encoding for the value, command, and signature types a script host is spoken
# to in, for a host that does not share the engine's address space. See the
# `wire` module.
serde.workspace = true
thiserror.workspace = true
# `parse_json`: JSON text -> `ScriptValue`, behind the `json` feature so a
# build that links no script host does not carry it. See [features].
serde_json = { workspace = true, optional = true }
# `parse_markdown`: markdown -> a block-record `ScriptValue`, behind the
# `markdown` feature.
pulldown-cmark = { workspace = true, optional = true }

# The plugin boundary's byte codec, for decoding the events portable plugins
# push onto the core bus. Default features only: the dlopen half stays in the
# loader crates. Native only: a browser page cannot load a portable plugin,
# so the wasm module carries neither the pipeline nor the codec.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
lumen-plugin-abi.workspace = true

[dev-dependencies]
bincode.workspace = true

[build-dependencies]
# Reads `builtins.ron` when this crate compiles, so the builtin metadata
# tables are generated rather than hand-maintained per host. A build
# dependency, so the parser never reaches a shipped binary.
ron.workspace = true
serde.workspace = true

[features]
# The `parse_json` builtin. Every script host crate enables this; a build
# that links none of them carries neither the feature nor `serde_json`.
json = ["dep:serde_json"]
# The `parse_markdown` builtin, same shape as `json`.
markdown = ["dep:pulldown-cmark"]
