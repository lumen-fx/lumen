[package]
name = "lumen-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Lumen runtime core: winit/ECS run loop, default plugin stack, hot reload, file-based pages, and app loaders. Parser-free (injected via SourceParser)."
keywords.workspace = true
categories.workspace = true
# Not published: `lumenc` and `lumenui` are the only crates.io packages.
publish = false

[lib]
name = "lumen_runtime"
path = "src/lib.rs"

[dependencies]
lumen-core = { workspace = true }
# Runtime-shared IR (LayoutIR, CSS AST + Cascade-5 application, value parsers,
# `var()` resolver, AOT artifact). The runtime consumes it directly; the
# markup/CSS front-end that PRODUCES it stays in `lumenc` and is injected via
# `SourceParser`.
lumen-ir = { workspace = true }
lumen-primitives = { workspace = true }
# The host-neutral scene layer: the IR spawner, the reconcilers, fragments,
# and the page resolver. Re-exported from here, so `lumen_runtime::spawn` and
# `lumen_runtime::pages` still name what they always did.
lumen-scene = { workspace = true }
lumen-assets = { workspace = true }
# The `[dependencies]` runtime-module schema, always parsed; the dlopen loader
# inside it follows the `modules` feature. Its own crate because the loader is
# unsafe by nature and this crate forbids unsafe code.
lumen-modules = { workspace = true }
# Translation catalogues + locale-aware formatters. The runtime resolves the
# app's locale, loads `locale/*.ftl`, and publishes the translator that
# `translatable="..."` markup and the scripts' `t()` builtin read.
lumen-i18n = { workspace = true }
# The list the optional subsystems below register themselves on, and the
# environment they are installed with. The run loop reads the list; it names
# none of them.
lumen-capability = { workspace = true }
bevy_ecs.workspace = true
glam.workspace = true
thiserror.workspace = true

# The core stack the run loop wires, and the optional subsystems this
# composition ships. An optional one is reached only through its own
# constructor (see `lib.rs`), so a link that leaves it out drops it whole.
lumen-input = { workspace = true }
lumen-os-clipboard = { workspace = true }
lumen-os-dnd = { workspace = true }
# The OS integration hosts, each through the crate that registers it as a
# capability. Only that registration is named anywhere in this crate.
lumen-os-filedialog-capability = { workspace = true }
lumen-os-tray-capability = { workspace = true }
lumen-os-notify-capability = { workspace = true }
lumen-os-hotkey-capability = { workspace = true }
lumen-os-launcher-capability = { workspace = true }
lumen-os-lifecycle-capability = { workspace = true }
lumen-os-power-capability = { workspace = true }
# Async spawn/timer bridge (tokio rt-multi-thread). OPTIONAL behind the
# `async` feature. File dialogs resolve on this runtime; a trimmed bundle
# drops the crate and falls back to the blocking path.
lumen-async-tokio-capability = { workspace = true, optional = true }
# The HTTP client the scripts' `fetch()` / `http()` builtins run on. OPTIONAL
# behind `http-fetch`; without it the builtins report that no client is
# installed, and an embedder can install its own `lumen_script::HttpClient`.
lumen-http-ureq-capability = { workspace = true, optional = true }
lumen-layout-taffy = { workspace = true }
# PNG decode and encode for the scripts' clipboard image round-trips.
image.workspace = true


# Script hosts. Every host is a Part B tree-shaking knob, OPTIONAL behind
# `host-rhai` / `host-lua` / `host-candela`, so a bundle links exactly the
# languages its app ships.
lumen-script = { workspace = true }
lumen-script-rhai = { workspace = true, optional = true }
rhai = { workspace = true, optional = true }
lumen-script-lua = { workspace = true, optional = true }
lumen-script-candela = { workspace = true, optional = true, features = ["compiler"] }
mlua = { workspace = true, optional = true }

lumen-text-cosmic = { workspace = true }
lumen-text = { workspace = true }
lumen-window-winit = { workspace = true }
# The renderer, on screen and off: the windowed path attaches the surface
# renderer to the winit window, and `run --headless` drives the offscreen one
# through the same Node-IR walker.
lumen-render-wgpu = { workspace = true }
# Accessibility. The window backend drives whatever bridge it is handed;
# picking AccessKit is this crate's call, as the composition point.
lumen-a11y-accesskit = { workspace = true }
# MCP introspection server (tokio + serde_json + http). OPTIONAL behind
# `mcp`. Dev-only; lumenc never infers it into a release bundle.
lumen-mcp-capability = { workspace = true, optional = true }
# Dev-only in-window devtools overlay. Optional + gated behind the off-by-
# default `devtools` feature.
lumen-devtools-capability = { workspace = true, optional = true }

# Hot-reload file watching (inotify / FSEvents / ReadDirectoryChangesW).
notify.workspace = true

# Per-app config (lumen.toml) + app-kind detection.
toml.workspace = true
serde.workspace = true
serde_json.workspace = true

tracing.workspace = true
# Dev-mode profiler stack (see [features]).
tracing-subscriber = { workspace = true, features = ["env-filter"], optional = true }
tracing-chrome = { workspace = true, optional = true }
tracing-tracy = { version = "0.11", optional = true, features = [
    "manual-lifetime",
    "delayed-init",
] }

[dev-dependencies]
# The lifecycle services, read back by the tests that drive them through the
# script builtins.
lumen-os-lifecycle = { workspace = true }
# The loader dispatch tests build the real fixture cdylibs: the portable
# plugin (the kind a static host loads) and a compiler plugin (the wrong
# kind, named as one in the banner).
lumen-plugin = { workspace = true, features = ["testing"] }
lumenc-plugin = { workspace = true, features = ["testing"] }
# The same list a compiled-in module's constructor writes to, so the loader
# tests can put one there without linking a module crate.
lumen-module-registry = { workspace = true }

# Headless mode graceful shutdown (SIGINT/SIGTERM). Unix-only.
[target.'cfg(unix)'.dependencies]
signal-hook.workspace = true

# Windows: Ctrl+C / console-close -> headless exit flag.
[target.'cfg(windows)'.dependencies]
ctrlc.workspace = true

[features]
# The DEFAULT set is FULL: it is what `cargo test -p lumen-runtime`
# exercises. The shipped shared engine takes the pinned list in
# public/lumen-dylib instead. Per-app trimming happens
# ONLY on the static `--bundle` path, where lumenc selects
# `--no-default-features --features "<resolved capabilities>"`.
default = [
    "http-fetch",
    "runtime-parse",
    "mcp",
    "async",
    "modules",
    "host-rhai",
    "host-lua",
    "host-candela",
]
# MCP introspection server. Part B tree-shaking knob (dev-only capability).
mcp = ["dep:lumen-mcp-capability"]
# Async spawn/timer (tokio) bridge. Part B tree-shaking knob.
async = ["dep:lumen-async-tokio-capability"]
# Script hosts. Each one ADDS a language, so a bundle can carry exactly the
# hosts its app uses. All three are on by default.
host-rhai = ["dep:lumen-script-rhai", "dep:rhai"]
host-lua = ["dep:lumen-script-lua", "dep:mlua"]
host-candela = ["dep:lumen-script-candela"]
# Dev-only in-window devtools overlay (F12). OFF by default.
devtools = ["dep:lumen-devtools-capability"]
# Runtime modules: load the prebuilt engine-linked dylibs an app declares in
# `[dependencies]`. The schema is always parsed; this gates the dlopen loader.
# A Part B tree-shaking knob like the rest, but the `[capabilities]` resolver
# keeps it ON for any app that declares a dependency.
modules = ["lumen-modules/loader"]
# The HTTP client behind the scripts' `fetch(url, tag)` / `http(#{...})`
# builtins, and the one the default build selects. On by default; a packager
# size knob, since ureq's rustls+ring stack is about a megabyte of release
# .text. Turn it off and both builtins still parse and queue, but every request
# resolves to `on_fetch_error(tag, "...built without the http-fetch
# feature...")` - which is also the build an embedder starts from when it
# installs its own `HttpClient`.
http-fetch = ["dep:lumen-http-ureq-capability"]
# Compile the from-source load path (dev source-load + hot reload). ON by
# default. Unlike the old lumenc feature this carries NO parser dependency -
# the parser is injected via `SourceParser` - it only gates the load-from-
# source CODE so a runtime that only loads precompiled AOT artifacts can drop
# it (`--no-default-features`).
runtime-parse = []
# `--profile chrome|stderr` support.
profiling = [
    "dep:tracing-subscriber",
    "dep:tracing-chrome",
    "bevy_ecs/trace",
    "bevy_ecs/debug",
]
# `--profile tracy` on top of `profiling`.
profiling-tracy = ["profiling", "dep:tracing-tracy"]
