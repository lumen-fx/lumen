[package]
name = "lumenui"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Lumen UI framework Rust SDK: the single dependency for building and embedding Lumen apps in Rust."
keywords = ["ui", "gui", "framework", "desktop", "sdk"]
categories = ["gui"]

[dependencies]
# The engine, and the SDK's only Lumen dependency. Everything the SDK is
# written against - the runtime, the ECS app, the DOM surface, the widget
# trait, the parser, `bevy_ecs` itself - is reached through `lumen::sdk`
# rather than depended on again here, so an app gets exactly one copy of each
# of them. A second direct dependency would compile a second copy, and two
# copies of, say, `lumen-core` are two different types to the compiler with
# two different signal stores behind them.
lumen = { path = "../.." }

# The same engine, in the form an app can link instead of compile in. Naming
# it is what puts the shared library in the app's link graph; `-C
# prefer-dynamic`, which `lumenc build` and `lumenc package` pass, is what
# makes the app take that form rather than the static one. Windows is left out
# because its linker cannot produce the library at all (see
# crates/dylib/Cargo.toml), so a Rust app there links the engine in.
[target.'cfg(not(windows))'.dependencies]
lumen-dylib = { path = "../../crates/dylib" }

[features]
default = ["host-rhai"]
# The `AppBuilder::rhai_extension` passthrough, which takes a `rhai::Engine`
# and so binds to one host. `AppBuilder::native_fn` exposes a function to
# every host the app runs and needs no feature.
host-rhai = ["lumen/host-rhai"]

[dev-dependencies]
# Tests construct `ClickEvent { position: Vec2, .. }` directly.
glam.workspace = true
