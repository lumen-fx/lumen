# The engine as a library a Rust program can link, rather than open.
#
# Lives beside the Rust SDK because the SDK is its only consumer: nothing else
# links the engine, and everything under crates/ is a piece of the engine
# rather than a form of it. Beside it rather than inside it: a workspace cannot
# exclude a directory that sits within one of its members, because the member
# owns its whole subtree, and being excluded is the point.
#
# Deliberately NOT a member of the workspace, and reached only through a
# `cfg(not(windows))` dependency in the SDK. Both facts are load-bearing:
#
#   - A `dylib` exports every symbol of the crate graph behind it. On Windows
#     the import library that describes those exports caps at 65535 entries,
#     and this graph is far past it, so linking one there fails outright
#     (LNK1189). Keeping it out of `members` is what stops a plain
#     `cargo build --workspace` from trying.
#   - Off Windows it is an ordinary dependency of the Rust SDK, so it is built
#     with the rest of the workspace and nothing has to be asked for.
#
# `version`, `edition` and the rest are spelled out rather than inherited,
# because a package outside the workspace cannot inherit from it.
# Its own workspace root as well as being excluded from the one above. The
# exclusion is what keeps it out of `cargo build --workspace`; this table is
# what answers a tool that walks path dependencies and resolves this manifest
# on its own (`cargo fmt --all`), which would otherwise keep searching upwards
# for a workspace that claims it. Safe only because nothing above this
# directory is a workspace member - inside a member's subtree the two roots
# collide.
[workspace]

[package]
name = "lumen-dylib"
version = "0.0.3"
edition = "2024"
license = "MPL-2.0"
authors = ["Lumen contributors"]
repository = "https://github.com/lumen-fx/lumen"
rust-version = "1.85"
description = "Lumen engine as a linkable shared library, for Rust apps that link the runtime rather than compile it in."
publish = false

[lib]
# Not `lumen`: the engine crate's own cdylib already writes `liblumen.so` into
# the same directory, and two targets cannot produce one file name. The name
# here is the one a packaged Rust app carries and asks its loader for.
name = "lumen_engine"
# Both forms. With `lib` present, a plain `cargo build` takes the rlib and the
# app links the engine statically, which is what a developer running `cargo
# run` wants and what Windows gets. `-C prefer-dynamic` takes the `dylib`
# instead, which is what `lumenc build` and `lumenc package` pass.
crate-type = ["lib", "dylib"]

[dependencies]
lumen = { path = "../.." }

[features]
# Passed straight through to the engine. The Rust SDK reaches the engine only
# through this crate on the platforms where it is built, so a feature it
# cannot forward is a feature an app cannot turn on.
host-rhai = ["lumen/host-rhai"]
