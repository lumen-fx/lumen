# The build-script half of the Rust SDK. An app names it under
# [build-dependencies] and calls `lumenui_build::compile()` from its build.rs,
# which compiles the app's UI with the `lumenc` of the same Lumen release; the
# `lumenui` crate's own build script calls `lumenui_build::link_engine()`,
# which points the compiler at the release's prebuilt engine. Both fetch from
# the release this crate's version names.
#
# Outside the workspace, like sdk/lumenui and for the same reason: the
# manifest is the one crates.io gets. Its own `[workspace]` table answers a
# tool that resolves this manifest on its own instead of searching upward.
# `version` and the rest are spelled out because a package outside the
# workspace cannot inherit them; bump-version.py keeps the version in step.
[workspace]

[package]
name = "lumenui-build"
version = "0.0.11"
edition = "2024"
license = "MPL-2.0"
authors = ["Lumen contributors"]
repository = "https://github.com/lumen-fx/lumen"
homepage = "https://lumenfx.dev"
documentation = "https://docs.lumenfx.dev/reference/ffi/#rust-sdk"
rust-version = "1.88"
description = "Lumen UI framework Rust SDK, build-script side: compiles an app's UI into the artifact its executable carries."
keywords = ["ui", "gui", "framework", "desktop", "sdk"]
categories = ["gui", "development-tools::build-utils"]
include = ["src/**", "Cargo.toml"]

[lib]
name = "lumenui_build"

[dependencies]
# The downloads: the release's checksums, then the asset, verified before
# anything is unpacked.
ureq = "3"
sha2 = "0.10"
tar = "0.4"
# Pure-Rust decoders, so building an app needs no C compiler for them.
ruzstd = "0.8"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
zip = { version = "6", default-features = false, features = ["deflate"] }
serde_json = "1"
